<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회사 회원가입</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="demo-banner">예시 화면 · 실제로 저장되진 않아요 · [가입하기]를 누르면 대시보드로 넘어갑니다</div>
<div class="container-narrow">
  <h1>회사 회원가입</h1>
  <p class="muted">우리 회사를 등록하고 근태관리를 시작하세요.</p>
  <div class="card">
    <label class="label">회사명</label>
    <input class="input" placeholder="예: 가온상사" value="가온상사">

    <input class="input" placeholder="예: boss@gaon.com" value="boss@gaon.com">
    <label class="label">비밀번호</label>
    <input class="input" type="password" value="12345678">
    <div style="height:20px"></div>
    <a href="03-dashboard.html" class="btn">가입하기</a>
  </div>
  <div class="center-link">이미 계정이 있으세요? <a href="02-login.html">로그인</a></div>
</div>
</body>
</html>
