# 근태관리 자동 배포 (2026-11-21) — 학원관리(newgaon-LMS)와 같은 방식
#
# 동작: main 가지에 푸시되면 → 서버 E(gaon-main, attend.newgaon.com)에 SSH로 접속 →
#       서버가 /opt/attendance/deploy/server/deploy.sh 를 실행한다
#       (최신본 받기 → 반영 전 백업 → 상자 새로 빌드 → DB 구조 맞춤 → healthy 확인).
#       끝나면 바깥에서 로그인 화면이 200으로 열리는지 한 번 더 본다.
#
# 보안: 이 워크플로가 쓰는 SSH 열쇠는 서버 /root/.ssh/authorized_keys 에서
#       restrict,command="..." 로 잠겨 있어 deploy.sh 외에는 아무것도 실행할 수 없다(열쇠가 새도 배포만 가능).
#       따라서 아래 script 내용은 서버가 무시한다(형식상 필요).
#
# 접속 정보는 코드에 두지 않고 깃허브 저장소 Secrets 에서 읽는다:
#   SERVER_HOST / SERVER_PORT / SERVER_USER / SERVER_SSH_KEY
#
# 실패해도: 빌드가 실패하면 deploy.sh 가 교체 전에 멈춰 기존 상자가 그대로 돈다.
#           자동 배포가 고장 나도 서버에서 `bash /opt/attendance/deploy/server/deploy.sh` 수동 반영은 그대로 된다.
# 다시 돌리기: 깃허브 Actions 화면 → 이 워크플로 → "Run workflow" 버튼(푸시 없이 같은 배포를 한 번 더).

name: Deploy attendance to gaon-main

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 배포가 겹치지 않게 한 줄로 세운다(앞 배포를 중간에 끊지 않는다 — 끊으면 상자 교체 도중 멈출 수 있다)
concurrency:
  group: attendance-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 운영 서버(gaon-main)에 SSH 접속하여 배포 실행
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # 빌드(약 1~5분) + 앞선 배포 기다림(deploy.sh 잠금 최대 15분)을 감안해 넉넉히 둔다
          command_timeout: 25m
          # 서버 열쇠의 강제명령(deploy.sh) 때문에 이 내용은 무시된다(형식상 필요)
          script: echo "배포 요청 — 실제 배포는 서버의 deploy.sh가 수행"

      - name: 바깥에서 로그인 화면 확인(200)
        run: |
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://attend.newgaon.com/login || echo 000)
            echo "시도 $i: 로그인 화면 응답 $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "❌ 로그인 화면이 200으로 열리지 않습니다 — 서버에서 docker logs --tail 50 attendance-app 확인"
          exit 1
