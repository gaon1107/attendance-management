<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background:#E5E7EB; }
</style>
</helmet>
<div style="min-height:100vh;background:#E5E7EB;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Pretendard,-apple-system,sans-serif;color:#111827;">

  <!-- Phone frame -->
  <div style="width:390px;height:844px;background:#F9FAFB;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(17,24,39,0.18);display:flex;flex-direction:column;position:relative;">

    <!-- Status bar -->
    <div style="height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;">
      <span>9:41</span>
      <span style="color:#6B7280;">근태관리</span>
    </div>

    <!-- Top bar -->
    <header style="height:52px;flex-shrink:0;display:flex;align-items:center;padding:0 12px;">
      <button style="width:40px;height:40px;border:none;background:transparent;color:#374151;cursor:pointer;display:flex;align-items:center;justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </header>

    <!-- Heading -->
    <div style="padding:8px 24px 16px;flex-shrink:0;">
      <div style="font-size:20px;font-weight:700;line-height:1.35;margin-bottom:8px;">생체정보 이용 동의</div>
      <div style="font-size:16px;color:#6B7280;line-height:1.55;">얼굴인증을 사용하려면 아래 내용에 동의가 필요합니다.</div>
    </div>

    <!-- Scrollable boxes -->
    <div style="flex:1;overflow-y:auto;padding:0 24px 8px;">
      <div style="display:flex;flex-direction:column;gap:12px;">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
          <div style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:18px 18px;">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
              <span style="width:28px;height:28px;flex-shrink:0;border-radius:8px;background:#EFF6FF;color:#2563EB;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;">{{ it.no }}</span>
              <span style="font-size:16px;font-weight:700;">{{ it.title }}</span>
            </div>
            <div style="font-size:16px;color:#374151;line-height:1.55;padding-left:38px;">{{ it.body }}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- Consent + action -->
    <div style="flex-shrink:0;border-top:1px solid #E5E7EB;background:#FFFFFF;padding:16px 24px 26px;">
      <label onClick="{{ toggle }}" style="display:flex;align-items:center;gap:12px;cursor:pointer;padding:6px 2px;margin-bottom:12px;">
        <span style="width:24px;height:24px;flex-shrink:0;border-radius:6px;border:2px solid {{ boxBorder }};background:{{ boxBg }};display:flex;align-items:center;justify-content:center;">
          <span style="display:{{ checkDisplay }};color:#fff;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
        </span>
        <span style="font-size:16px;font-weight:700;">위 내용에 동의합니다</span>
      </label>
      <button disabled="{{ disabled }}" style="width:100%;height:52px;border:none;border-radius:10px;background:{{ btnBg }};color:{{ btnColor }};font-family:inherit;font-size:16px;font-weight:700;cursor:{{ btnCursor }};">동의하고 계속하기</button>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { agreed: false };
  renderVals() {
    const a = this.state.agreed;
    return {
      items: [
        { no: '1', title: '무엇을 수집하나요', body: '얼굴 이미지와 얼굴 특징점(수치화된 데이터)을 수집합니다.' },
        { no: '2', title: '왜 이용하나요', body: '본인 확인 및 출퇴근 기록 용도로만 이용합니다.' },
        { no: '3', title: '얼마나 보관하나요', body: '재직 중 또는 동의 철회 시까지 보관하며, 목적 달성 시 지체 없이 파기합니다.' },
        { no: '4', title: '어떻게 철회하나요', body: '[내 정보] 메뉴에서 언제든 삭제를 요청할 수 있습니다.' },
      ],
      toggle: () => this.setState(s => ({ agreed: !s.agreed })),
      boxBorder: a ? '#2563EB' : '#D1D5DB',
      boxBg: a ? '#2563EB' : '#FFFFFF',
      checkDisplay: a ? 'flex' : 'none',
      disabled: !a,
      btnBg: a ? '#2563EB' : '#E5E7EB',
      btnColor: a ? '#FFFFFF' : '#9CA3AF',
      btnCursor: a ? 'pointer' : 'not-allowed',
    };
  }
}
</script>
</body>
</html>
