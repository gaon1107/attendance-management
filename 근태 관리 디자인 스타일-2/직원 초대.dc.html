<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;position:relative;">

  <!-- Dimmed context: employee page underneath -->
  <div style="display:flex;filter:blur(1.5px);opacity:0.5;pointer-events:none;user-select:none;">
    <aside style="width:220px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;padding:20px 12px;">
      <div style="display:flex;align-items:center;gap:9px;padding:0 8px;margin-bottom:22px;">
        <div style="width:28px;height:28px;border-radius:7px;background:#2563EB;display:flex;align-items:center;justify-content:center;"><span style="color:#fff;font-size:15px;font-weight:700;">근</span></div>
        <span style="font-size:16px;font-weight:700;">근태관리</span>
      </div>
    </aside>
    <main style="flex:1;padding:24px 28px;">
      <div style="font-size:22px;font-weight:700;margin-bottom:3px;">직원 관리</div>
      <div style="font-size:13px;color:#6B7280;">㈜하늘테크 · 총 3명</div>
    </main>
  </div>

  <!-- Scrim -->
  <div style="position:fixed;inset:0;background:rgba(17,24,39,0.35);"></div>

  <!-- Side panel -->
  <aside style="position:fixed;top:0;right:0;bottom:0;width:440px;background:#FFFFFF;border-left:1px solid #E5E7EB;box-shadow:-8px 0 24px rgba(17,24,39,0.08);display:flex;flex-direction:column;">
    <!-- Panel header -->
    <div style="display:flex;align-items:flex-start;justify-content:space-between;padding:28px 28px 20px;border-bottom:1px solid #E5E7EB;">
      <div>
        <div style="font-size:20px;font-weight:700;margin-bottom:4px;">직원 초대</div>
        <div style="font-size:13px;color:#6B7280;line-height:1.5;">이메일로 초대장을 보내면 직원이 직접 가입합니다.</div>
      </div>
      <button style="width:36px;height:36px;flex-shrink:0;border:none;border-radius:8px;background:transparent;color:#6B7280;cursor:pointer;display:flex;align-items:center;justify-content:center;" style-hover="background:#F3F4F6;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Panel body -->
    <div style="flex:1;overflow-y:auto;padding:24px 28px;">
      <label style="display:block;font-size:13px;font-weight:700;margin-bottom:10px;">초대할 이메일</label>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <sc-for list="{{ emails }}" as="e" hint-placeholder-count="2">
          <div style="display:flex;align-items:center;gap:8px;">
            <input value="{{ e.value }}" placeholder="name@skytech.co.kr" style="flex:1;height:44px;padding:0 14px;border:1px solid #D1D5DB;border-radius:8px;font-family:inherit;font-size:16px;color:#111827;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
            <button onClick="{{ e.remove }}" style="width:44px;height:44px;flex-shrink:0;border:1px solid #E5E7EB;border-radius:8px;background:#fff;color:#9CA3AF;cursor:pointer;display:flex;align-items:center;justify-content:center;" style-hover="background:#F9FAFB;color:#DC2626;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
        </sc-for>
      </div>
      <button onClick="{{ addEmail }}" style="display:flex;align-items:center;gap:6px;height:40px;margin-top:12px;padding:0 4px;border:none;background:transparent;color:#2563EB;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        이메일 추가
      </button>

      <div style="height:1px;background:#F3F4F6;margin:24px 0;"></div>

      <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">부서 (선택)</label>
      <select style="width:100%;height:44px;padding:0 14px;border:1px solid #D1D5DB;border-radius:8px;font-family:inherit;font-size:16px;color:#111827;outline:none;background:#fff;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);">
        <option>부서를 나중에 지정</option>
        <option>영업팀</option>
        <option>총무팀</option>
        <option>개발팀</option>
      </select>
    </div>

    <!-- Panel footer -->
    <div style="display:flex;gap:12px;padding:20px 28px;border-top:1px solid #E5E7EB;">
      <button style="height:48px;flex:0 0 auto;padding:0 22px;border:1px solid #D1D5DB;border-radius:8px;background:#fff;color:#111827;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#F9FAFB;">취소</button>
      <button style="height:48px;flex:1;border:none;border-radius:8px;background:#2563EB;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#1D4ED8;">초대 발송 ({{ count }}명)</button>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { emails: ['admin.hong@skytech.co.kr', ''] };
  renderVals() {
    const emails = this.state.emails;
    const filled = emails.filter(v => v.trim() !== '').length;
    return {
      emails: emails.map((value, i) => ({
        value,
        remove: () => this.setState(s => ({
          emails: s.emails.length > 1 ? s.emails.filter((_, j) => j !== i) : s.emails,
        })),
      })),
      addEmail: () => this.setState(s => ({ emails: [...s.emails, ''] })),
      count: filled || emails.length,
    };
  }
}
</script>
</body>
</html>
