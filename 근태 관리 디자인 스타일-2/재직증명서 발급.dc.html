<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background:#E5E7EB; }
</style>
</helmet>
<div style="min-height:100vh;background:#E5E7EB;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Pretendard,-apple-system,sans-serif;color:#111827;">

  <div style="width:390px;height:844px;background:#F9FAFB;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(17,24,39,0.18);display:flex;flex-direction:column;position:relative;">

    <div style="height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;"><span>9:41</span><span style="color:#6B7280;">근태관리</span></div>

    <header style="height:52px;flex-shrink:0;display:flex;align-items:center;padding:0 12px;">
      <button style="width:40px;height:40px;border:none;background:transparent;color:#374151;cursor:pointer;display:flex;align-items:center;justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span style="font-size:16px;font-weight:700;margin-left:4px;">재직증명서 발급</span>
    </header>

    <div style="flex:1;overflow-y:auto;padding:8px 24px 8px;">
      <!-- Document type -->
      <label style="display:block;font-size:13px;font-weight:700;margin-bottom:10px;">서류 종류</label>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:22px;">
        <sc-for list="{{ docs }}" as="d" hint-placeholder-count="3">
          <button onClick="{{ d.select }}" style="text-align:left;width:100%;border:1px solid {{ d.border }};border-radius:10px;background:{{ d.bg }};padding:14px 16px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:12px;" style-hover="border-color:#2563EB;">
            <span style="width:22px;height:22px;flex-shrink:0;border-radius:50%;border:2px solid {{ d.radioBorder }};display:flex;align-items:center;justify-content:center;"><span style="width:10px;height:10px;border-radius:50%;background:{{ d.radioDot }};"></span></span>
            <span style="flex:1;min-width:0;"><span style="display:block;font-size:15px;font-weight:700;">{{ d.label }}</span><span style="display:block;font-size:13px;color:#9CA3AF;margin-top:1px;">{{ d.desc }}</span></span>
          </button>
        </sc-for>
      </div>

      <!-- Options -->
      <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">제출처 <span style="color:#9CA3AF;font-weight:400;">(서류에 표기)</span></label>
      <input value="국민은행 대출 심사" style="width:100%;height:48px;padding:0 14px;border:1px solid #D1D5DB;border-radius:9px;font-family:inherit;font-size:15px;color:#111827;outline:none;margin-bottom:16px;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
        <div>
          <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">발급 부수</label>
          <select style="width:100%;height:48px;padding:0 12px;border:1px solid #D1D5DB;border-radius:9px;font-family:inherit;font-size:15px;color:#111827;outline:none;background:#fff;"><option>1부</option><option>2부</option><option>3부</option></select>
        </div>
        <div>
          <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">수령 방법</label>
          <select style="width:100%;height:48px;padding:0 12px;border:1px solid #D1D5DB;border-radius:9px;font-family:inherit;font-size:15px;color:#111827;outline:none;background:#fff;"><option>PDF 다운로드</option><option>이메일</option><option>사무실 수령</option></select>
        </div>
      </div>

      <!-- Privacy -->
      <label onClick="{{ toggleMask }}" style="display:flex;align-items:center;gap:12px;cursor:pointer;padding:12px 2px;">
        <span style="width:22px;height:22px;flex-shrink:0;border-radius:6px;border:2px solid {{ maskBorder }};background:{{ maskBg }};display:flex;align-items:center;justify-content:center;">
          <span style="display:{{ maskCheck }};color:#fff;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
        </span>
        <span style="font-size:15px;font-weight:700;">주민등록번호 뒷자리 가림</span>
      </label>

      <!-- Preview -->
      <div style="margin-top:16px;background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:18px 20px;">
        <div style="text-align:center;font-size:16px;font-weight:700;padding-bottom:14px;border-bottom:1px solid #F3F4F6;margin-bottom:14px;">{{ selDoc }}</div>
        <div style="display:flex;flex-direction:column;gap:9px;">
          <div style="display:flex;justify-content:space-between;"><span style="font-size:13px;color:#6B7280;">성명</span><span style="font-size:13px;font-weight:700;">홍길동</span></div>
          <div style="display:flex;justify-content:space-between;"><span style="font-size:13px;color:#6B7280;">소속·직급</span><span style="font-size:13px;font-weight:700;">영업팀 · 대리</span></div>
          <div style="display:flex;justify-content:space-between;"><span style="font-size:13px;color:#6B7280;">입사일</span><span style="font-size:13px;font-weight:700;">2024-03-11</span></div>
          <div style="display:flex;justify-content:space-between;"><span style="font-size:13px;color:#6B7280;">재직 상태</span><span style="font-size:13px;font-weight:700;color:#15803D;">재직 중</span></div>
        </div>
      </div>
    </div>

    <div style="flex-shrink:0;border-top:1px solid #E5E7EB;background:#FFFFFF;padding:16px 24px 26px;">
      <button style="width:100%;height:52px;border:none;border-radius:10px;background:#2563EB;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#1D4ED8;">발급하기</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { doc: '재직증명서', mask: true };
  renderVals() {
    const defs = [
      { label:'재직증명서', desc:'현재 재직 사실 증명' },
      { label:'경력증명서', desc:'입사~현재 경력 사항' },
      { label:'근로소득 원천징수영수증', desc:'연간 소득·세액' },
    ];
    const sel = this.state.doc;
    const mask = this.state.mask;
    return {
      docs: defs.map(d => {
        const a = d.label === sel;
        return { label:d.label, desc:d.desc, select: () => this.setState({ doc: d.label }),
          bg: a?'#EFF6FF':'#fff', border: a?'#2563EB':'#D1D5DB',
          radioBorder: a?'#2563EB':'#D1D5DB', radioDot: a?'#2563EB':'transparent' };
      }),
      selDoc: sel,
      toggleMask: () => this.setState(s => ({ mask: !s.mask })),
      maskBorder: mask ? '#2563EB' : '#D1D5DB',
      maskBg: mask ? '#2563EB' : '#fff',
      maskCheck: mask ? 'flex' : 'none',
    };
  }
}
</script>
</body>
</html>
