<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background:#E5E7EB; }
</style>
</helmet>
<div style="min-height:100vh;background:#E5E7EB;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Pretendard,-apple-system,sans-serif;color:#111827;">

  <div style="width:390px;height:844px;background:#F9FAFB;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(17,24,39,0.18);display:flex;flex-direction:column;position:relative;">

    <div style="height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;"><span>9:41</span><span style="color:#6B7280;">근태관리</span></div>

    <!-- Top bar -->
    <header style="height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;">
      <div style="display:flex;align-items:center;gap:9px;">
        <div style="width:26px;height:26px;border-radius:7px;background:#2563EB;display:flex;align-items:center;justify-content:center;"><span style="color:#fff;font-size:14px;font-weight:700;">근</span></div>
        <span style="font-size:16px;font-weight:700;">근태관리</span>
      </div>
      <button style="position:relative;width:38px;height:38px;border:none;background:transparent;color:#374151;cursor:pointer;display:flex;align-items:center;justify-content:center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span style="position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:#DC2626;border:2px solid #F9FAFB;"></span>
      </button>
    </header>

    <div style="flex:1;overflow-y:auto;padding:8px 20px 24px;">

      <!-- Greeting -->
      <div style="margin-bottom:16px;">
        <div style="font-size:20px;font-weight:700;">홍길동님, 근무 중이에요</div>
        <div style="font-size:13px;color:#6B7280;margin-top:2px;">2026년 7월 4일 (금)</div>
      </div>

      <!-- Status card -->
      <div style="background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:18px 20px;margin-bottom:12px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
          <span style="display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:7px;background:#F3F4F6;"><span style="width:7px;height:7px;border-radius:50%;background:#2563EB;"></span><span style="font-size:13px;font-weight:700;color:#374151;">근무 중</span></span>
          <span style="font-size:13px;color:#9CA3AF;">사내 네트워크 확인됨</span>
        </div>
        <div style="display:flex;">
          <div style="flex:1;"><div style="font-size:13px;color:#6B7280;margin-bottom:4px;">출근</div><div style="font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;">09:02</div></div>
          <div style="flex:1;"><div style="font-size:13px;color:#6B7280;margin-bottom:4px;">경과</div><div style="font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:#2563EB;">3:41</div></div>
          <div style="flex:1;"><div style="font-size:13px;color:#6B7280;margin-bottom:4px;">예정 퇴근</div><div style="font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:#9CA3AF;">18:00</div></div>
        </div>
      </div>

      <!-- Primary actions -->
      <div style="display:flex;gap:10px;margin-bottom:20px;">
        <button style="flex:1;height:52px;border:1px solid #D1D5DB;border-radius:10px;background:#fff;color:#374151;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;" style-hover="background:#F3F4F6;">외출</button>
        <button style="flex:2;height:52px;border:none;border-radius:10px;background:#2563EB;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#1D4ED8;">퇴근하기</button>
      </div>

      <!-- Notice -->
      <div style="display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:13px 14px;margin-bottom:20px;">
        <span style="width:32px;height:32px;flex-shrink:0;border-radius:8px;background:#EFF6FF;color:#2563EB;display:flex;align-items:center;justify-content:center;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">7월 근무제 변경 안내</div>
          <div style="font-size:13px;color:#9CA3AF;">공지 · 7월 1일</div>
        </div>
        <span style="width:15px;height:15px;color:#C7CDD4;display:flex;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>

      <!-- Menu grid -->
      <div style="font-size:13px;font-weight:700;color:#6B7280;margin:0 2px 10px;">바로가기</div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;">
        <sc-for list="{{ shortcuts }}" as="s" hint-placeholder-count="4">
          <button style="text-align:left;height:76px;padding:0 16px;border:1px solid #E5E7EB;border-radius:10px;background:#fff;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:8px;" style-hover="background:#F9FAFB;">
            <span style="width:30px;height:30px;border-radius:8px;background:#F3F4F6;color:#374151;display:flex;align-items:center;justify-content:center;" dangerouslySetInnerHTML="{{ s.icon }}"></span>
            <span style="font-size:15px;font-weight:700;">{{ s.label }}</span>
          </button>
        </sc-for>
      </div>

      <!-- This week summary -->
      <div style="font-size:13px;font-weight:700;color:#6B7280;margin:20px 2px 10px;">이번 주</div>
      <div style="background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:16px 18px;display:flex;">
        <div style="flex:1;"><div style="font-size:13px;color:#6B7280;margin-bottom:4px;">실근무</div><div style="font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;">32:10</div></div>
        <div style="flex:1;"><div style="font-size:13px;color:#6B7280;margin-bottom:4px;">잔여 연차</div><div style="font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;">15.5일</div></div>
        <div style="flex:1;"><div style="font-size:13px;color:#6B7280;margin-bottom:4px;">지각</div><div style="font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;">0</div></div>
      </div>
    </div>

    <!-- Bottom nav -->
    <nav style="flex-shrink:0;display:flex;padding:8px 8px 26px;border-top:1px solid #E5E7EB;background:#fff;">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="4">
        <a href="#" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:{{ n.color }};padding:6px 0;">
          <span style="width:22px;height:22px;display:flex;" dangerouslySetInnerHTML="{{ n.icon }}"></span>
          <span style="font-size:12px;font-weight:700;">{{ n.label }}</span>
        </a>
      </sc-for>
    </nav>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ic = (p, sz) => ({ __html: '<svg width="'+(sz||17)+'" height="'+(sz||17)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    return {
      shortcuts: [
        { label:'내 근태 조회', icon: ic('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>') },
        { label:'휴가 신청', icon: ic('<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>') },
        { label:'근태 정정', icon: ic('<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>') },
        { label:'내 정보', icon: ic('<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 12 0v1"/>') },
      ],
      nav: [
        { label:'홈', color:'#2563EB', icon: ic('<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11h14V9"/>', 22) },
        { label:'근태', color:'#9CA3AF', icon: ic('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>', 22) },
        { label:'휴가', color:'#9CA3AF', icon: ic('<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>', 22) },
        { label:'내 정보', color:'#9CA3AF', icon: ic('<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 12 0v1"/>', 22) },
      ],
    };
  }
}
</script>
</body>
</html>
