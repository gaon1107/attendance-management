<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background:#E5E7EB; }
</style>
</helmet>
<div style="min-height:100vh;background:#E5E7EB;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Pretendard,-apple-system,sans-serif;color:#111827;">

  <div style="width:390px;height:844px;background:#F9FAFB;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(17,24,39,0.18);display:flex;flex-direction:column;position:relative;">

    <div style="height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;"><span>9:41</span><span style="color:#6B7280;">근태관리</span></div>

    <header style="height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;">
      <div style="display:flex;align-items:center;">
        <button style="width:40px;height:40px;border:none;background:transparent;color:#374151;cursor:pointer;display:flex;align-items:center;justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <span style="font-size:16px;font-weight:700;margin-left:4px;">인사평가</span>
      </div>
      <select style="height:34px;padding:0 10px;margin-right:8px;border:1px solid #D1D5DB;border-radius:8px;font-family:inherit;font-size:13px;font-weight:700;color:#374151;outline:none;background:#fff;"><option>2026 상반기</option><option>2025 하반기</option></select>
    </header>

    <div style="flex:1;overflow-y:auto;padding:8px 24px 24px;">
      <!-- Overall grade -->
      <div style="background:#2563EB;border-radius:14px;padding:22px;text-align:center;margin-bottom:14px;">
        <div style="font-size:13px;font-weight:700;color:rgba(255,255,255,0.8);margin-bottom:10px;">종합 평가 등급</div>
        <div style="font-size:44px;font-weight:700;color:#fff;line-height:1;">A</div>
        <div style="font-size:13px;color:rgba(255,255,255,0.8);margin-top:10px;">상위 20% · 팀 내 2위 / 7명</div>
      </div>

      <!-- Confirm status -->
      <div style="display:flex;align-items:center;gap:8px;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:10px;padding:12px 14px;margin-bottom:16px;">
        <span style="width:16px;height:16px;color:#16A34A;display:flex;flex-shrink:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></span>
        <span style="font-size:13px;color:#15803D;font-weight:700;">평가 확정 완료 · 2026-07-01 · 정우성 팀장</span>
      </div>

      <!-- Competency scores -->
      <div style="font-size:13px;font-weight:700;color:#6B7280;margin:0 2px 10px;">역량별 점수</div>
      <div style="background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:18px 20px;margin-bottom:16px;">
        <div style="display:flex;flex-direction:column;gap:16px;">
          <sc-for list="{{ scores }}" as="s" hint-placeholder-count="4">
            <div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;">
                <span style="font-size:15px;font-weight:700;">{{ s.label }}</span>
                <span style="font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:{{ s.color }};">{{ s.score }}</span>
              </div>
              <div style="height:8px;border-radius:5px;background:#F3F4F6;overflow:hidden;"><div style="height:100%;width:{{ s.pct }};background:{{ s.color }};border-radius:5px;"></div></div>
            </div>
          </sc-for>
        </div>
      </div>

      <!-- Manager comment -->
      <div style="font-size:13px;font-weight:700;color:#6B7280;margin:0 2px 10px;">평가자 피드백</div>
      <div style="background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:18px 20px;margin-bottom:16px;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
          <span style="width:32px;height:32px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">정</span>
          <div><div style="font-size:15px;font-weight:700;">정우성 팀장</div><div style="font-size:13px;color:#9CA3AF;">1차 평가자</div></div>
        </div>
        <p style="font-size:15px;color:#374151;line-height:1.6;margin:0;">고객 응대와 성실성이 특히 뛰어납니다. 목표 달성률도 안정적이며, 하반기에는 신규 거래처 발굴에서 리더십을 발휘해 보길 기대합니다.</p>
      </div>

      <!-- Objection -->
      <button style="width:100%;height:48px;border:1px solid #D1D5DB;border-radius:10px;background:#fff;color:#374151;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;" style-hover="background:#F9FAFB;">
        <span style="width:16px;height:16px;display:flex;color:#6B7280;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
        이의 신청하기
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      scores: [
        { label:'업무 성과', score:'4.5 / 5', pct:'90%', color:'#2563EB' },
        { label:'성실성·근태', score:'4.8 / 5', pct:'96%', color:'#16A34A' },
        { label:'협업·소통', score:'4.2 / 5', pct:'84%', color:'#2563EB' },
        { label:'문제 해결', score:'3.9 / 5', pct:'78%', color:'#F59E0B' },
      ],
    };
  }
}
</script>
</body>
</html>
