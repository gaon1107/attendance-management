<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background:#E5E7EB; }
</style>
</helmet>
<div style="min-height:100vh;background:#E5E7EB;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Pretendard,-apple-system,sans-serif;color:#111827;">

  <div style="width:390px;height:844px;background:#F9FAFB;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(17,24,39,0.18);display:flex;flex-direction:column;position:relative;">

    <div style="height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;"><span>9:41</span><span style="color:#6B7280;">근태관리</span></div>

    <header style="height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;">
      <div style="display:flex;align-items:center;">
        <button style="width:40px;height:40px;border:none;background:transparent;color:#374151;cursor:pointer;display:flex;align-items:center;justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <span style="font-size:16px;font-weight:700;margin-left:4px;">알림</span>
      </div>
      <button style="height:36px;padding:0 12px;margin-right:8px;border:none;background:transparent;color:#2563EB;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;">모두 읽음</button>
    </header>

    <div style="flex:1;overflow-y:auto;padding:8px 20px 24px;">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
        <div style="font-size:13px;font-weight:700;color:#6B7280;margin:14px 4px 10px;">{{ g.label }}</div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <sc-for list="{{ g.items }}" as="n" hint-placeholder-count="3">
            <div style="display:flex;gap:12px;background:{{ n.bg }};border:1px solid {{ n.border }};border-radius:12px;padding:16px 16px;">
              <span style="width:38px;height:38px;flex-shrink:0;border-radius:10px;background:{{ n.iconBg }};color:{{ n.iconFg }};display:flex;align-items:center;justify-content:center;" dangerouslySetInnerHTML="{{ n.icon }}"></span>
              <div style="flex:1;min-width:0;">
                <div style="display:flex;align-items:center;gap:8px;">
                  <span style="font-size:16px;font-weight:700;">{{ n.title }}</span>
                  <sc-if value="{{ n.unread }}" hint-placeholder-val="{{ false }}"><span style="width:8px;height:8px;border-radius:50%;background:#2563EB;flex-shrink:0;"></span></sc-if>
                </div>
                <div style="font-size:13px;color:#6B7280;line-height:1.5;margin-top:3px;">{{ n.body }}</div>
                <div style="font-size:13px;color:#9CA3AF;margin-top:6px;">{{ n.time }}</div>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ic = (p) => ({ __html: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const icons = {
      ok:   ic('<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>'),
      no:   ic('<circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/>'),
      warn: ic('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
      info: ic('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'),
    };
    const styleOf = (kind, unread) => {
      const map = {
        ok:   { iconBg:'#DCFCE7', iconFg:'#16A34A', icon:icons.ok },
        no:   { iconBg:'#FEE2E2', iconFg:'#DC2626', icon:icons.no },
        warn: { iconBg:'#FEF3C7', iconFg:'#B45309', icon:icons.warn },
        info: { iconBg:'#EFF6FF', iconFg:'#2563EB', icon:icons.info },
      }[kind];
      return { ...map, unread,
        bg: unread ? '#FFFFFF' : '#FFFFFF',
        border: unread ? '#BFDBFE' : '#E5E7EB' };
    };
    return {
      groups: [
        { label: '오늘', items: [
          { ...styleOf('ok', true),  title:'휴가 승인됨', body:'7월 8~9일 연차 신청이 승인되었어요.', time:'2시간 전' },
          { ...styleOf('warn', true), title:'지각 기록', body:'오늘 09:20 출근으로 지각 처리되었습니다.', time:'오전 9:20' },
        ]},
        { label: '이번 주', items: [
          { ...styleOf('no', false), title:'정정 요청 반려', body:'7월 1일 퇴근시각 정정 요청이 반려되었어요.', time:'7월 2일' },
          { ...styleOf('info', false), title:'근무 규칙 변경', body:'지각 허용 시간이 10분으로 변경되었습니다.', time:'7월 1일' },
          { ...styleOf('ok', false), title:'얼굴 등록 완료', body:'얼굴 인증이 정상 등록되었습니다.', time:'6월 30일' },
        ]},
      ],
    };
  }
}
</script>
</body>
</html>
