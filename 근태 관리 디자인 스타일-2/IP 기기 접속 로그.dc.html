<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:220px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;padding:20px 12px;">
    <div style="display:flex;align-items:center;gap:9px;padding:0 8px;margin-bottom:22px;">
      <div style="width:28px;height:28px;border-radius:7px;background:#2563EB;display:flex;align-items:center;justify-content:center;"><span style="color:#fff;font-size:15px;font-weight:700;">근</span></div>
      <span style="font-size:16px;font-weight:700;letter-spacing:-0.01em;">근태관리</span>
    </div>
    <nav style="display:flex;flex-direction:column;gap:1px;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="8">
        <a href="#" style="display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:7px;text-decoration:none;font-size:15px;font-weight:{{ m.weight }};color:{{ m.color }};background:{{ m.bg }};" style-hover="background:#F3F4F6;">
          <span style="width:17px;height:17px;display:flex;color:{{ m.iconColor }};" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          {{ m.label }}
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px;border-top:1px solid #F3F4F6;">
      <div style="width:30px;height:30px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
      <div style="min-width:0;"><div style="font-size:13px;font-weight:700;">관리자</div><div style="font-size:13px;color:#9CA3AF;">admin@skytech.co.kr</div></div>
    </div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div>
        <div style="font-size:22px;font-weight:700;line-height:1.2;">IP·기기 접속 로그</div>
        <div style="font-size:13px;color:#6B7280;margin-top:3px;">출퇴근·로그인 접속 기록. 이상 접속을 확인하세요.</div>
      </div>
      <button style="height:40px;padding:0 16px;border:1px solid #D1D5DB;border-radius:7px;background:#fff;color:#374151;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#F9FAFB;">내보내기</button>
    </div>

    <!-- KPI -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;">
      <sc-for list="{{ kpis }}" as="k" hint-placeholder-count="4">
        <div style="background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:16px 18px;">
          <div style="font-size:13px;color:#6B7280;margin-bottom:8px;">{{ k.label }}</div>
          <div style="font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:{{ k.color }};">{{ k.value }}</div>
        </div>
      </sc-for>
    </div>

    <!-- Filter -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <div style="display:inline-flex;background:#EEF2F7;border-radius:8px;padding:3px;">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
          <button onClick="{{ t.select }}" style="height:34px;padding:0 14px;border:none;border-radius:6px;background:{{ t.bg }};color:{{ t.fg }};font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;box-shadow:{{ t.shadow }};">{{ t.label }}</button>
        </sc-for>
      </div>
      <div style="position:relative;flex:1;max-width:260px;">
        <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#9CA3AF;display:flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
        <input placeholder="이름·IP 검색" style="width:100%;height:40px;padding:0 12px 0 36px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
      </div>
    </div>

    <!-- Table -->
    <section style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;">
      <div style="overflow-x:auto;">
      <table style="width:100%;min-width:900px;border-collapse:collapse;">
        <thead>
          <tr style="background:#F9FAFB;border-bottom:1px solid #E5E7EB;">
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;">시각</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">이름</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">동작</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">기기</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">IP 주소</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">위치</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;">판정</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
            <tr style="border-bottom:1px solid #F3F4F6;background:{{ r.rowBg }};">
              <td style="padding:11px 20px;font-size:15px;font-variant-numeric:tabular-nums;color:#6B7280;white-space:nowrap;">{{ r.time }}</td>
              <td style="padding:11px 14px;font-size:15px;font-weight:700;white-space:nowrap;">{{ r.name }}</td>
              <td style="padding:11px 14px;font-size:15px;color:#374151;white-space:nowrap;">{{ r.action }}</td>
              <td style="padding:11px 14px;font-size:15px;color:#6B7280;white-space:nowrap;">
                <span style="display:inline-flex;align-items:center;gap:7px;"><span style="width:15px;height:15px;color:#9CA3AF;display:flex;" dangerouslySetInnerHTML="{{ r.icon }}"></span>{{ r.device }}</span>
              </td>
              <td style="padding:11px 14px;font-size:15px;color:#6B7280;font-variant-numeric:tabular-nums;white-space:nowrap;">{{ r.ip }}</td>
              <td style="padding:11px 14px;font-size:15px;color:#6B7280;white-space:nowrap;">{{ r.loc }}</td>
              <td style="padding:11px 20px;">
                <span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:{{ r.chipBg }};">
                  <span style="width:6px;height:6px;border-radius:50%;background:{{ r.dot }};"></span>
                  <span style="font-size:13px;font-weight:700;color:{{ r.chipFg }};white-space:nowrap;">{{ r.verdict }}</span>
                </span>
              </td>
            </tr>
          </sc-for>
        </tbody>
      </table>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: '전체' };
  renderVals() {
    const ic = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', false, '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', false, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', false, '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', false,   '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['보안로그', true,  '<path d="M12 2 4 5v6c0 5 3.5 8 8 11 4.5-3 8-6 8-11V5z"/>'],
      ['설정', false,     '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: ic(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    const phone = ic('<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>');
    const pc = ic('<rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/>');
    const V = {
      ok:   { verdict:'정상', dot:'#16A34A', chipBg:'#F3F4F6', chipFg:'#374151', rowBg:'#fff' },
      warn: { verdict:'주의', dot:'#F59E0B', chipBg:'#FEF3C7', chipFg:'#B45309', rowBg:'#fff' },
      block:{ verdict:'차단', dot:'#DC2626', chipBg:'#FEE2E2', chipFg:'#B91C1C', rowBg:'#FEFCFC' },
    };
    const all = [
      { time:'07-04 08:52', name:'홍길동', action:'출근 (얼굴)', device:'iPhone 15', icon:phone, ip:'211.45.128.34', loc:'본사 (사내망)', ...V.ok },
      { time:'07-04 08:47', name:'이서윤', action:'출근 (GPS)', device:'Galaxy S24', icon:phone, ip:'123.98.11.220', loc:'본사 반경 내', ...V.ok },
      { time:'07-04 08:41', name:'김민준', action:'로그인', device:'Windows PC', icon:pc, ip:'211.45.128.12', loc:'본사 (사내망)', ...V.ok },
      { time:'07-04 08:20', name:'최유진', action:'출근 (GPS)', device:'iPhone 13', icon:phone, ip:'58.140.77.9', loc:'서울 강서구', ...V.warn },
      { time:'07-04 02:14', name:'한도윤', action:'로그인 시도', device:'알 수 없음', icon:pc, ip:'45.132.88.6', loc:'해외 (네덜란드)', ...V.block },
      { time:'07-03 18:10', name:'박도현', action:'퇴근 (얼굴)', device:'iPhone 12', icon:phone, ip:'211.45.128.51', loc:'본사 (사내망)', ...V.ok },
      { time:'07-03 09:30', name:'정우성', action:'로그인', device:'MacBook', icon:pc, ip:'211.45.128.20', loc:'본사 (사내망)', ...V.ok },
      { time:'07-03 09:05', name:'최유진', action:'출근 (GPS)', device:'iPhone 13', icon:phone, ip:'112.220.5.44', loc:'경기 성남시', ...V.warn },
    ];
    const tab = this.state.tab;
    const tabs = ['전체','주의','차단'].map(label => {
      const a = label === tab;
      return { label, select: () => this.setState({ tab: label }),
        bg: a?'#fff':'transparent', fg: a?'#2563EB':'#6B7280', shadow: a?'0 1px 2px rgba(0,0,0,0.08)':'none' };
    });
    const rows = tab==='전체' ? all : all.filter(r => (tab==='주의'&&r.verdict==='주의')||(tab==='차단'&&r.verdict==='차단'));
    return {
      menu, tabs, rows,
      kpis: [
        { label:'오늘 접속', value:'128건', color:'#111827' },
        { label:'사내망 접속', value:'86%', color:'#111827' },
        { label:'주의', value:'2건', color:'#B45309' },
        { label:'차단', value:'1건', color:'#B91C1C' },
      ],
    };
  }
}
</script>
</body>
</html>
