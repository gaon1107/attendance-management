<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background:#E5E7EB; }
</style>
</helmet>
<div style="min-height:100vh;background:#E5E7EB;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Pretendard,-apple-system,sans-serif;color:#111827;">

  <div style="width:390px;height:844px;background:#F9FAFB;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(17,24,39,0.18);display:flex;flex-direction:column;position:relative;">

    <div style="height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;"><span>9:41</span><span style="color:#6B7280;">근태관리</span></div>

    <header style="height:52px;flex-shrink:0;display:flex;align-items:center;padding:0 12px;">
      <button style="width:40px;height:40px;border:none;background:transparent;color:#374151;cursor:pointer;display:flex;align-items:center;justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span style="font-size:16px;font-weight:700;margin-left:4px;">만족도 설문</span>
    </header>

    <!-- ===== FORM ===== -->
    <sc-if value="{{ showForm }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1;overflow-y:auto;padding:8px 24px 8px;">
      <div style="font-size:13px;color:#6B7280;line-height:1.5;margin-bottom:6px;">2026년 2분기 · 익명으로 제출됩니다</div>
      <div style="font-size:20px;font-weight:700;margin-bottom:20px;">이번 분기, 어떻게 지내셨나요?</div>

      <!-- Q1 rating -->
      <div style="background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:18px;margin-bottom:12px;">
        <div style="font-size:15px;font-weight:700;margin-bottom:14px;">1. 전반적인 업무 만족도는?</div>
        <div style="display:flex;justify-content:space-between;gap:6px;">
          <sc-for list="{{ scores }}" as="s" hint-placeholder-count="5">
            <button onClick="{{ s.select }}" style="flex:1;height:52px;border:1px solid {{ s.border }};border-radius:9px;background:{{ s.bg }};cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit;">
              <span style="font-size:18px;font-weight:700;color:{{ s.fg }};">{{ s.num }}</span>
            </button>
          </sc-for>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:8px;">
          <span style="font-size:13px;color:#9CA3AF;">매우 불만족</span>
          <span style="font-size:13px;color:#9CA3AF;">매우 만족</span>
        </div>
      </div>

      <!-- Q2 chips -->
      <div style="background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:18px;margin-bottom:12px;">
        <div style="font-size:15px;font-weight:700;margin-bottom:6px;">2. 개선이 필요한 부분은? <span style="font-size:13px;font-weight:400;color:#9CA3AF;">(복수 선택)</span></div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;">
          <sc-for list="{{ topics }}" as="t" hint-placeholder-count="6">
            <button onClick="{{ t.toggle }}" style="height:38px;padding:0 14px;border:1px solid {{ t.border }};border-radius:19px;background:{{ t.bg }};color:{{ t.fg }};font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;">{{ t.label }}</button>
          </sc-for>
        </div>
      </div>

      <!-- Q3 free -->
      <div style="background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:18px;margin-bottom:8px;">
        <div style="font-size:15px;font-weight:700;margin-bottom:12px;">3. 자유롭게 의견을 남겨주세요 <span style="font-size:13px;font-weight:400;color:#9CA3AF;">(선택)</span></div>
        <textarea placeholder="근무 환경, 제도, 소통 등 무엇이든 좋아요." style="width:100%;height:88px;padding:12px 14px;border:1px solid #D1D5DB;border-radius:9px;font-family:inherit;font-size:15px;color:#111827;outline:none;resize:none;line-height:1.5;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);"></textarea>
      </div>
    </div>
    <div style="flex-shrink:0;border-top:1px solid #E5E7EB;background:#FFFFFF;padding:16px 24px 26px;">
      <button onClick="{{ submit }}" style="width:100%;height:52px;border:none;border-radius:10px;background:#2563EB;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#1D4ED8;">제출하기</button>
    </div>
    </sc-if>

    <!-- ===== DONE ===== -->
    <sc-if value="{{ showDone }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 40px;">
      <div style="width:88px;height:88px;border-radius:50%;background:#DCFCE7;display:flex;align-items:center;justify-content:center;margin-bottom:24px;">
        <span style="color:#16A34A;"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
      </div>
      <div style="font-size:20px;font-weight:700;margin-bottom:10px;">참여해 주셔서 감사해요</div>
      <div style="font-size:15px;color:#6B7280;line-height:1.6;max-width:260px;">소중한 의견은 익명으로 전달되며, 더 나은 근무 환경을 만드는 데 사용됩니다.</div>
    </div>
    <div style="flex-shrink:0;padding:16px 24px 30px;">
      <button style="width:100%;height:52px;border:none;border-radius:10px;background:#2563EB;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#1D4ED8;">홈으로</button>
    </div>
    </sc-if>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { score: 4, topics: { pay:false, worklife:true, comm:false, growth:false, welfare:false, tools:false }, done: false };
  renderVals() {
    const sel = this.state.score;
    const scores = [1,2,3,4,5].map(num => {
      const a = num === sel;
      return { num, select: () => this.setState({ score: num }),
        bg: a?'#2563EB':'#fff', fg: a?'#fff':'#374151', border: a?'#2563EB':'#D1D5DB' };
    });
    const topicDefs = [['pay','급여·보상'],['worklife','워라밸'],['comm','소통·문화'],['growth','성장 기회'],['welfare','복지'],['tools','업무 도구']];
    const topics = topicDefs.map(([key, label]) => {
      const on = this.state.topics[key];
      return { label, toggle: () => this.setState(s => ({ topics: { ...s.topics, [key]: !s.topics[key] } })),
        bg: on?'#EFF6FF':'#fff', fg: on?'#1D4ED8':'#6B7280', border: on?'#2563EB':'#D1D5DB' };
    });
    return {
      showForm: !this.state.done,
      showDone: this.state.done,
      scores, topics,
      submit: () => this.setState({ done: true }),
    };
  }
}
</script>
</body>
</html>
