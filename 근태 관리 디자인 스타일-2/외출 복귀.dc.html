<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background:#E5E7EB; }
</style>
</helmet>
<div style="min-height:100vh;background:#E5E7EB;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Pretendard,-apple-system,sans-serif;color:#111827;">

  <!-- Phone frame -->
  <div style="width:390px;height:844px;background:#F9FAFB;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(17,24,39,0.18);display:flex;flex-direction:column;position:relative;">

    <!-- Status bar -->
    <div style="height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;">
      <span>9:41</span>
      <span style="color:#6B7280;">근태관리</span>
    </div>

    <!-- Top bar -->
    <header style="height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;">
      <div style="display:flex;align-items:center;gap:9px;">
        <div style="width:28px;height:28px;border-radius:7px;background:#2563EB;display:flex;align-items:center;justify-content:center;"><span style="color:#fff;font-size:15px;font-weight:700;">근</span></div>
        <span style="font-size:16px;font-weight:700;">근태관리</span>
      </div>
      <button style="width:40px;height:40px;border:none;background:transparent;color:#374151;cursor:pointer;display:flex;align-items:center;justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </header>

    <!-- Body -->
    <div style="flex:1;display:flex;flex-direction:column;padding:16px 24px 0;">

      <!-- Greeting -->
      <div style="margin-bottom:20px;">
        <div style="font-size:20px;font-weight:700;margin-bottom:4px;">홍길동님, {{ greeting }}</div>
        <div style="font-size:16px;color:#6B7280;">2026년 7월 5일 (토)</div>
      </div>

      <!-- Status card -->
      <div style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:20px 22px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
          <span style="font-size:13px;font-weight:700;color:#6B7280;">현재 상태</span>
          <span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:#F3F4F6;">
            <span style="width:6px;height:6px;border-radius:50%;background:{{ badgeDot }};"></span>
            <span style="font-size:13px;font-weight:700;color:#374151;">{{ badgeLabel }}</span>
          </span>
        </div>
        <div style="display:flex;align-items:stretch;">
          <div style="flex:1;">
            <div style="font-size:13px;color:#6B7280;margin-bottom:6px;">{{ leftLabel }}</div>
            <div style="font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;color:{{ leftColor }};">{{ leftValue }}</div>
          </div>
          <div style="width:1px;background:#F3F4F6;margin:0 4px;"></div>
          <div style="flex:1;padding-left:20px;">
            <div style="font-size:13px;color:#6B7280;margin-bottom:6px;">{{ rightLabel }}</div>
            <div style="font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;color:{{ rightColor }};">{{ rightValue }}</div>
          </div>
        </div>
      </div>

      <div style="flex:1;"></div>

      <!-- ===== WORKING actions ===== -->
      <sc-if value="{{ isWorking }}" hint-placeholder-val="{{ true }}">
        <div style="padding-bottom:26px;">
          <button onClick="{{ openSheet }}" style="width:100%;height:52px;border:1px solid #D1D5DB;border-radius:12px;background:#fff;color:#111827;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:28px;" style-hover="background:#F9FAFB;">
            <span style="width:18px;height:18px;display:flex;color:#374151;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></span>
            외출
          </button>
          <button style="width:100%;height:80px;border:none;border-radius:18px;background:#2563EB;color:#fff;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 6px 16px rgba(37,99,235,0.28);" style-hover="background:#1D4ED8;" style-active="transform:translateY(1px);">
            <span style="font-size:20px;font-weight:700;">퇴근하기</span>
            <span style="font-size:13px;font-weight:400;opacity:0.85;">지금 시각 12:03</span>
          </button>
        </div>
      </sc-if>

      <!-- ===== OUT actions ===== -->
      <sc-if value="{{ isOut }}" hint-placeholder-val="{{ false }}">
        <div style="padding-bottom:14px;">
          <button onClick="{{ back }}" style="width:100%;height:80px;border:none;border-radius:18px;background:#F59E0B;color:#fff;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 6px 16px rgba(245,158,11,0.30);" style-hover="filter:brightness(0.96);" style-active="transform:translateY(1px);">
            <span style="font-size:20px;font-weight:700;">복귀</span>
            <span style="font-size:13px;font-weight:400;opacity:0.9;">외출 {{ outReason }} · 12:03~</span>
          </button>
        </div>
        <div style="text-align:center;font-size:13px;color:#9CA3AF;padding-bottom:24px;">외출 시간은 실근무시간에서 제외됩니다</div>
      </sc-if>

    </div>

    <!-- ===== Out reason sheet ===== -->
    <sc-if value="{{ showSheet }}" hint-placeholder-val="{{ false }}">
      <div onClick="{{ closeSheet }}" style="position:absolute;inset:0;background:rgba(17,24,39,0.40);display:flex;align-items:flex-end;">
        <div onClick="{{ stop }}" style="width:100%;background:#FFFFFF;border-radius:20px 20px 0 0;padding:24px 24px 30px;">
          <div style="font-size:20px;font-weight:700;margin-bottom:6px;">외출</div>
          <div style="font-size:16px;color:#6B7280;margin-bottom:20px;">외출 사유를 선택해 주세요.</div>
          <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">외출 사유</label>
          <select value="{{ reason }}" onChange="{{ onReason }}" style="width:100%;height:48px;padding:0 14px;border:1px solid #D1D5DB;border-radius:8px;font-family:inherit;font-size:16px;color:#111827;outline:none;background:#fff;margin-bottom:20px;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);">
            <option>식사</option>
            <option>외근</option>
            <option>개인용무</option>
            <option>기타</option>
          </select>
          <button onClick="{{ startOut }}" style="width:100%;height:52px;border:none;border-radius:10px;background:#2563EB;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#1D4ED8;">외출 시작</button>
        </div>
      </div>
    </sc-if>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mode: 'working', sheet: false, reason: '식사', outReason: '식사' };
  renderVals() {
    const working = this.state.mode === 'working';
    return {
      greeting: working ? '근무 중이에요' : '외출 중이에요',
      isWorking: working,
      isOut: !working,
      // status card
      badgeDot: working ? '#16A34A' : '#F59E0B',
      badgeLabel: working ? '근무 중' : ('외출 중 · ' + this.state.outReason),
      leftLabel: '출근', leftValue: '09:02', leftColor: '#111827',
      rightLabel: working ? '경과' : '외출 시작',
      rightValue: working ? '3:01' : '12:03',
      rightColor: working ? '#2563EB' : '#B45309',
      outReason: this.state.outReason,
      // sheet
      showSheet: this.state.sheet,
      reason: this.state.reason,
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false }),
      stop: (e) => e.stopPropagation(),
      onReason: (e) => this.setState({ reason: e.target.value }),
      startOut: () => this.setState(s => ({ mode: 'out', sheet: false, outReason: s.reason })),
      back: () => this.setState({ mode: 'working' }),
    };
  }
}
</script>
</body>
</html>
