<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:220px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;padding:20px 12px;">
    <div style="display:flex;align-items:center;gap:9px;padding:0 8px;margin-bottom:22px;">
      <div style="width:28px;height:28px;border-radius:7px;background:#2563EB;display:flex;align-items:center;justify-content:center;"><span style="color:#fff;font-size:15px;font-weight:700;">근</span></div>
      <span style="font-size:16px;font-weight:700;letter-spacing:-0.01em;">근태관리</span>
    </div>
    <nav style="display:flex;flex-direction:column;gap:1px;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="8">
        <a href="#" style="display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:7px;text-decoration:none;font-size:15px;font-weight:{{ m.weight }};color:{{ m.color }};background:{{ m.bg }};" style-hover="background:#F3F4F6;">
          <span style="width:17px;height:17px;display:flex;color:{{ m.iconColor }};" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          {{ m.label }}
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px;border-top:1px solid #F3F4F6;">
      <div style="width:30px;height:30px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
      <div style="min-width:0;"><div style="font-size:13px;font-weight:700;">관리자</div><div style="font-size:13px;color:#9CA3AF;">admin@skytech.co.kr</div></div>
    </div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
      <div>
        <div style="font-size:22px;font-weight:700;line-height:1.2;">이상 접속 알림 설정</div>
        <div style="font-size:13px;color:#6B7280;margin-top:3px;">의심스러운 접속이 감지되면 관리자에게 알립니다.</div>
      </div>
      <button style="height:40px;padding:0 18px;border:none;border-radius:7px;background:#2563EB;color:#fff;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#1D4ED8;">저장</button>
    </div>

    <div style="max-width:760px;display:flex;flex-direction:column;gap:12px;">

      <!-- Detection rules -->
      <section style="background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:20px 24px;">
        <div style="font-size:16px;font-weight:700;margin-bottom:2px;">감지 규칙</div>
        <div style="font-size:13px;color:#6B7280;margin-bottom:8px;">감지할 이상 접속 유형을 선택합니다.</div>
        <div style="display:flex;flex-direction:column;">
          <sc-for list="{{ rules }}" as="r" hint-placeholder-count="4">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-top:1px solid #F3F4F6;">
              <div style="display:flex;align-items:center;gap:12px;min-width:0;">
                <span style="width:34px;height:34px;flex-shrink:0;border-radius:8px;background:#F3F4F6;color:{{ r.iconColor }};display:flex;align-items:center;justify-content:center;" dangerouslySetInnerHTML="{{ r.icon }}"></span>
                <div style="min-width:0;"><div style="font-size:15px;font-weight:700;">{{ r.title }}</div><div style="font-size:13px;color:#9CA3AF;">{{ r.desc }}</div></div>
              </div>
              <button onClick="{{ r.toggle }}" style="width:48px;height:28px;flex-shrink:0;border:none;border-radius:14px;background:{{ r.track }};cursor:pointer;position:relative;"><span style="position:absolute;top:3px;left:{{ r.knob }};width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.2);transition:left 0.15s;"></span></button>
            </div>
          </sc-for>
        </div>
      </section>

      <!-- Severity threshold -->
      <section style="background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:20px 24px;">
        <div style="font-size:16px;font-weight:700;margin-bottom:14px;">자동 차단 기준</div>
        <div style="display:flex;gap:8px;">
          <sc-for list="{{ levels }}" as="l" hint-placeholder-count="3">
            <button onClick="{{ l.select }}" style="flex:1;height:64px;border:1px solid {{ l.border }};border-radius:9px;background:{{ l.bg }};cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:inherit;">
              <span style="font-size:15px;font-weight:700;color:{{ l.fg }};">{{ l.label }}</span>
              <span style="font-size:13px;color:{{ l.subColor }};">{{ l.sub }}</span>
            </button>
          </sc-for>
        </div>
      </section>

      <!-- Notify channels -->
      <section style="background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:20px 24px;">
        <div style="font-size:16px;font-weight:700;margin-bottom:8px;">알림 방법</div>
        <div style="display:flex;flex-direction:column;">
          <sc-for list="{{ channels }}" as="c" hint-placeholder-count="3">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-top:1px solid #F3F4F6;">
              <div style="min-width:0;"><div style="font-size:15px;font-weight:700;">{{ c.title }}</div><div style="font-size:13px;color:#9CA3AF;">{{ c.desc }}</div></div>
              <button onClick="{{ c.toggle }}" style="width:48px;height:28px;flex-shrink:0;border:none;border-radius:14px;background:{{ c.track }};cursor:pointer;position:relative;"><span style="position:absolute;top:3px;left:{{ c.knob }};width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.2);transition:left 0.15s;"></span></button>
            </div>
          </sc-for>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    level: '중간',
    rule: { overseas: true, night: true, newdevice: true, failed: false },
    ch: { dashboard: true, email: true, sms: false },
  };
  renderVals() {
    const nav = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', false, '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', false, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', false, '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', false,   '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['보안로그', true,  '<path d="M12 2 4 5v6c0 5 3.5 8 8 11 4.5-3 8-6 8-11V5z"/>'],
      ['설정', false,     '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: nav(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    const ic = (p) => ({ __html: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const ruleDefs = [
      ['overseas', ic('<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/>'), '#B45309', '해외 IP 접속', '등록된 출장 외 해외 접속 감지'],
      ['night', ic('<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>'), '#6D28D9', '심야 접속 (00–06시)', '업무 외 시간대 로그인 감지'],
      ['newdevice', ic('<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>'), '#2563EB', '새 기기 로그인', '처음 보는 기기에서 접속 시 감지'],
      ['failed', ic('<circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/>'), '#DC2626', '반복 로그인 실패', '5회 이상 연속 실패 시 감지'],
    ];
    const rules = ruleDefs.map(([key, icon, iconColor, title, desc]) => {
      const on = this.state.rule[key];
      return { icon, iconColor, title, desc,
        toggle: () => this.setState(s => ({ rule: { ...s.rule, [key]: !s.rule[key] } })),
        track: on ? '#2563EB' : '#D1D5DB', knob: on ? '23px' : '3px' };
    });
    const levels = [
      { id:'낮음', label:'낮음', sub:'알림만' },
      { id:'중간', label:'중간', sub:'감시 + 알림' },
      { id:'높음', label:'높음', sub:'즉시 차단' },
    ].map(l => {
      const a = l.id === this.state.level;
      return { label:l.label, sub:l.sub, select: () => this.setState({ level: l.id }),
        bg: a?'#EFF6FF':'#fff', border: a?'#2563EB':'#D1D5DB', fg: a?'#1D4ED8':'#374151', subColor: a?'#60A5FA':'#9CA3AF' };
    });
    const chDefs = [
      ['dashboard', '대시보드 알림', '알림 센터에 실시간 표시'],
      ['email', '이메일', 'admin@skytech.co.kr'],
      ['sms', 'SMS 문자', '긴급(높음) 등급만 발송'],
    ];
    const channels = chDefs.map(([key, title, desc]) => {
      const on = this.state.ch[key];
      return { title, desc,
        toggle: () => this.setState(s => ({ ch: { ...s.ch, [key]: !s.ch[key] } })),
        track: on ? '#2563EB' : '#D1D5DB', knob: on ? '23px' : '3px' };
    });
    return { menu, rules, levels, channels };
  }
}
</script>
</body>
</html>
