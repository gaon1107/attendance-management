<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;flex-direction:column;">

  <!-- Top bar -->
  <header style="height:56px;flex-shrink:0;background:#fff;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;justify-content:space-between;padding:0 24px;">
    <div style="display:flex;align-items:center;gap:9px;">
      <div style="width:28px;height:28px;border-radius:7px;background:#2563EB;display:flex;align-items:center;justify-content:center;"><span style="color:#fff;font-size:15px;font-weight:700;">근</span></div>
      <span style="font-size:16px;font-weight:700;letter-spacing:-0.01em;">근태관리</span>
    </div>
    <div style="display:flex;align-items:center;gap:18px;">
      <a href="#" style="font-size:15px;font-weight:700;color:#2563EB;text-decoration:none;">홈</a>
      <a href="#" style="font-size:15px;font-weight:400;color:#6B7280;text-decoration:none;">내 근태</a>
      <a href="#" style="font-size:15px;font-weight:400;color:#6B7280;text-decoration:none;">휴가</a>
      <a href="#" style="font-size:15px;font-weight:400;color:#6B7280;text-decoration:none;">급여</a>
      <div style="width:1px;height:20px;background:#E5E7EB;"></div>
      <button style="position:relative;width:36px;height:36px;border:none;background:transparent;color:#374151;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px;" style-hover="background:#F3F4F6;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span style="position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:#DC2626;border:1.5px solid #fff;"></span>
      </button>
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="width:30px;height:30px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">홍</div>
        <span style="font-size:15px;font-weight:700;">홍길동</span>
      </div>
    </div>
  </header>

  <main style="flex:1;min-width:0;padding:24px 32px 48px;max-width:1200px;width:100%;margin:0 auto;">
    <div style="margin-bottom:18px;">
      <div style="font-size:22px;font-weight:700;line-height:1.2;">홍길동님, 근무 중이에요</div>
      <div style="font-size:13px;color:#6B7280;margin-top:3px;">2026년 7월 5일 (토) · 영업팀</div>
    </div>

    <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start;">

      <!-- Left column -->
      <div style="display:flex;flex-direction:column;gap:16px;">
        <!-- Status + action -->
        <section style="background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:22px 24px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
            <span style="display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:7px;background:#F3F4F6;"><span style="width:7px;height:7px;border-radius:50%;background:#2563EB;"></span><span style="font-size:13px;font-weight:700;color:#374151;">근무 중</span></span>
            <span style="font-size:13px;color:#16A34A;font-weight:700;">사내 네트워크 확인됨</span>
          </div>
          <div style="display:flex;align-items:center;gap:24px;">
            <div style="flex:1;display:flex;gap:24px;">
              <div><div style="font-size:13px;color:#6B7280;margin-bottom:5px;">출근</div><div style="font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;">09:02</div></div>
              <div><div style="font-size:13px;color:#6B7280;margin-bottom:5px;">경과</div><div style="font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:#2563EB;">3:41</div></div>
              <div><div style="font-size:13px;color:#6B7280;margin-bottom:5px;">예정 퇴근</div><div style="font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:#9CA3AF;">18:00</div></div>
            </div>
            <div style="display:flex;gap:10px;">
              <button style="height:48px;padding:0 20px;border:1px solid #D1D5DB;border-radius:9px;background:#fff;color:#374151;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#F9FAFB;">외출</button>
              <button style="height:48px;padding:0 28px;border:none;border-radius:9px;background:#2563EB;color:#fff;font-family:inherit;font-size:16px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#1D4ED8;">퇴근하기</button>
            </div>
          </div>
        </section>

        <!-- This week -->
        <section style="background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:20px 24px;">
          <div style="font-size:16px;font-weight:700;margin-bottom:16px;">이번 주 근무</div>
          <div style="display:flex;align-items:flex-end;gap:14px;height:120px;margin-bottom:10px;">
            <sc-for list="{{ week }}" as="d" hint-placeholder-count="5">
              <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">
                <div style="font-size:13px;font-weight:700;color:#6B7280;margin-bottom:6px;">{{ d.hours }}</div>
                <div style="width:100%;max-width:40px;height:{{ d.h }};background:{{ d.color }};border-radius:6px 6px 0 0;"></div>
              </div>
            </sc-for>
          </div>
          <div style="display:flex;gap:14px;">
            <sc-for list="{{ week }}" as="d" hint-placeholder-count="5">
              <div style="flex:1;text-align:center;font-size:13px;color:{{ d.labelColor }};">{{ d.day }}</div>
            </sc-for>
          </div>
        </section>

        <!-- Recent -->
        <section style="background:#fff;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;">
          <div style="padding:16px 20px 12px;font-size:16px;font-weight:700;">최근 근태</div>
          <table style="width:100%;border-collapse:collapse;">
            <thead>
              <tr style="background:#F9FAFB;border-top:1px solid #E5E7EB;border-bottom:1px solid #E5E7EB;">
                <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:9px 20px;">날짜</th>
                <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:9px 14px;">출근</th>
                <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:9px 14px;">퇴근</th>
                <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:9px 20px;">상태</th>
              </tr>
            </thead>
            <tbody>
              <sc-for list="{{ recent }}" as="r" hint-placeholder-count="4">
                <tr style="border-bottom:1px solid #F3F4F6;">
                  <td style="padding:10px 20px;font-size:15px;font-variant-numeric:tabular-nums;">{{ r.date }}</td>
                  <td style="padding:10px 14px;font-size:15px;font-variant-numeric:tabular-nums;color:{{ r.inColor }};">{{ r.in }}</td>
                  <td style="padding:10px 14px;font-size:15px;font-variant-numeric:tabular-nums;color:#6B7280;">{{ r.out }}</td>
                  <td style="padding:10px 20px;"><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:#F3F4F6;"><span style="width:6px;height:6px;border-radius:50%;background:{{ r.dot }};"></span><span style="font-size:13px;font-weight:700;color:#374151;">{{ r.status }}</span></span></td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </section>
      </div>

      <!-- Right column -->
      <div style="display:flex;flex-direction:column;gap:16px;">
        <!-- Leave balance -->
        <section style="background:#2563EB;border-radius:10px;padding:20px 22px;color:#fff;">
          <div style="font-size:13px;font-weight:700;color:rgba(255,255,255,0.8);margin-bottom:8px;">잔여 연차</div>
          <div style="font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;">15.5<span style="font-size:15px;font-weight:400;margin-left:2px;">일</span></div>
          <div style="font-size:13px;color:rgba(255,255,255,0.75);margin-top:8px;">총 20일 중 4.5일 사용</div>
          <button style="width:100%;height:40px;margin-top:14px;border:none;border-radius:8px;background:rgba(255,255,255,0.16);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;" style-hover="background:rgba(255,255,255,0.24);">휴가 신청</button>
        </section>

        <!-- Quick actions -->
        <section style="background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:16px;">
          <div style="font-size:13px;font-weight:700;color:#6B7280;margin:0 4px 10px;">바로가기</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <sc-for list="{{ shortcuts }}" as="s" hint-placeholder-count="4">
              <button style="height:64px;border:1px solid #E5E7EB;border-radius:9px;background:#fff;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;" style-hover="background:#F9FAFB;">
                <span style="width:22px;height:22px;color:#374151;display:flex;" dangerouslySetInnerHTML="{{ s.icon }}"></span>
                <span style="font-size:13px;font-weight:700;">{{ s.label }}</span>
              </button>
            </sc-for>
          </div>
        </section>

        <!-- Notices -->
        <section style="background:#fff;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;">
          <div style="padding:14px 18px;border-bottom:1px solid #E5E7EB;font-size:15px;font-weight:700;">공지</div>
          <sc-for list="{{ notices }}" as="n" hint-placeholder-count="3">
            <div style="display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid #F3F4F6;">
              <span style="width:6px;height:6px;border-radius:50%;background:{{ n.dot }};flex-shrink:0;"></span>
              <span style="flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ n.title }}</span>
              <span style="font-size:13px;color:#9CA3AF;flex-shrink:0;">{{ n.date }}</span>
            </div>
          </sc-for>
        </section>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ic = (p) => ({ __html: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const week = [
      { day:'월', hours:'8:20', h:'70%', color:'#BFDBFE', labelColor:'#6B7280' },
      { day:'화', hours:'8:48', h:'82%', color:'#93C5FD', labelColor:'#6B7280' },
      { day:'수', hours:'9:35', h:'100%', color:'#60A5FA', labelColor:'#6B7280' },
      { day:'목', hours:'8:15', h:'68%', color:'#93C5FD', labelColor:'#6B7280' },
      { day:'금', hours:'3:41', h:'40%', color:'#2563EB', labelColor:'#2563EB' },
    ];
    const B = { ok:{status:'정상',dot:'#16A34A'}, late:{status:'지각',dot:'#F59E0B'} };
    return {
      week,
      recent: [
        { date:'07-04', in:'08:52', out:'18:10', inColor:'#111827', ...B.ok },
        { date:'07-03', in:'09:20', out:'18:05', inColor:'#B45309', ...B.late },
        { date:'07-02', in:'08:47', out:'18:02', inColor:'#111827', ...B.ok },
        { date:'07-01', in:'08:55', out:'19:30', inColor:'#111827', ...B.ok },
      ],
      shortcuts: [
        { label:'근태 조회', icon: ic('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>') },
        { label:'근태 정정', icon: ic('<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>') },
        { label:'급여명세서', icon: ic('<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>') },
        { label:'출장 신청', icon: ic('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>') },
      ],
      notices: [
        { dot:'#2563EB', title:'7월 근무제 변경 안내', date:'7/1' },
        { dot:'#16A34A', title:'여름 휴가 신청 안내', date:'6/28' },
        { dot:'#9CA3AF', title:'사내 WiFi 비밀번호 변경', date:'6/25' },
      ],
    };
  }
}
</script>
</body>
</html>
