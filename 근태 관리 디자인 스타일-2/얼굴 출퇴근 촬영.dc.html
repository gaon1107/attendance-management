<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background:#E5E7EB; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</helmet>
<div style="min-height:100vh;background:#E5E7EB;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Pretendard,-apple-system,sans-serif;color:#111827;">

  <!-- Phone frame -->
  <div style="width:390px;height:844px;background:#F9FAFB;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(17,24,39,0.18);display:flex;flex-direction:column;position:relative;">

    <!-- Status bar -->
    <div style="height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;">
      <span>9:41</span>
      <span style="color:#6B7280;">근태관리</span>
    </div>

    <!-- Top bar -->
    <header style="height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;">
      <button style="width:40px;height:40px;border:none;background:transparent;color:#374151;cursor:pointer;display:flex;align-items:center;justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <!-- state switcher (demo) -->
      <div style="display:flex;gap:4px;padding-right:6px;">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
          <button onClick="{{ t.select }}" style="height:28px;padding:0 10px;border:1px solid {{ t.border }};border-radius:7px;background:{{ t.bg }};color:{{ t.fg }};font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;">{{ t.label }}</button>
        </sc-for>
      </div>
    </header>

    <div style="padding:8px 24px 4px;text-align:center;flex-shrink:0;">
      <div style="font-size:20px;font-weight:700;">얼굴 출퇴근</div>
    </div>

    <!-- Camera area -->
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;">
      <div style="position:relative;width:260px;height:260px;">
        <div style="position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#111827;">
          <div style="width:100%;height:100%;background:radial-gradient(circle at 50% 42%, #4B5563 0%, #1F2937 60%, #111827 100%);display:flex;align-items:flex-end;justify-content:center;">
            <span style="color:#6B7280;margin-bottom:30px;"><svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg></span>
          </div>
        </div>
        <div style="position:absolute;inset:-6px;border-radius:50%;border:3px solid {{ ringColor }};"></div>

        <!-- overlay per state -->
        <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ true }}">
          <div style="position:absolute;inset:0;border-radius:50%;background:rgba(17,24,39,0.45);display:flex;align-items:center;justify-content:center;">
            <span style="width:44px;height:44px;border:4px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;display:block;animation:spin 0.8s linear infinite;"></span>
          </div>
        </sc-if>
        <sc-if value="{{ isSuccess }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;inset:0;border-radius:50%;background:rgba(22,163,74,0.20);display:flex;align-items:center;justify-content:center;">
            <span style="width:72px;height:72px;border-radius:50%;background:#16A34A;color:#fff;display:flex;align-items:center;justify-content:center;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
          </div>
        </sc-if>
        <sc-if value="{{ isFail }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;inset:0;border-radius:50%;background:rgba(220,38,38,0.20);display:flex;align-items:center;justify-content:center;">
            <span style="width:72px;height:72px;border-radius:50%;background:#DC2626;color:#fff;display:flex;align-items:center;justify-content:center;"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></span>
          </div>
        </sc-if>
      </div>

      <!-- Status text -->
      <div style="text-align:center;margin-top:28px;min-height:64px;">
        <div style="font-size:20px;font-weight:700;color:{{ titleColor }};margin-bottom:8px;">{{ title }}</div>
        <div style="font-size:16px;color:#6B7280;line-height:1.5;">{{ subtitle }}</div>
      </div>
    </div>

    <!-- Bottom actions -->
    <div style="flex-shrink:0;padding:0 24px 30px;">
      <sc-if value="{{ isSuccess }}" hint-placeholder-val="{{ false }}">
        <button style="width:100%;height:52px;border:none;border-radius:10px;background:#2563EB;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#1D4ED8;">확인</button>
      </sc-if>
      <sc-if value="{{ isFail }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;gap:12px;">
          <button style="flex:1;height:52px;border:1px solid #D1D5DB;border-radius:10px;background:#fff;color:#111827;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#F9FAFB;">GPS로 전환</button>
          <button onClick="{{ retry }}" style="flex:1;height:52px;border:none;border-radius:10px;background:#2563EB;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#1D4ED8;">다시 촬영</button>
        </div>
      </sc-if>
      <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ true }}">
        <button disabled style="width:100%;height:52px;border:none;border-radius:10px;background:#E5E7EB;color:#9CA3AF;font-family:inherit;font-size:16px;font-weight:700;cursor:not-allowed;">확인 중...</button>
      </sc-if>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { view: 'loading' }; // loading | success | fail
  renderVals() {
    const v = this.state.view;
    const mk = (id, label) => ({
      label,
      select: () => this.setState({ view: id }),
      bg: v === id ? '#2563EB' : '#FFFFFF',
      fg: v === id ? '#FFFFFF' : '#6B7280',
      border: v === id ? '#2563EB' : '#E5E7EB',
    });
    const map = {
      loading: { ring: '#2563EB', titleColor: '#111827', title: '확인 중...', subtitle: '잠시만 기다려 주세요' },
      success: { ring: '#16A34A', titleColor: '#15803D', title: '본인 확인 완료!', subtitle: '출근시각 09:02 기록됨' },
      fail:    { ring: '#DC2626', titleColor: '#B91C1C', title: '얼굴을 확인하지 못했어요', subtitle: '밝은 곳에서 다시 시도하거나 GPS로 전환하세요' },
    };
    const s = map[v];
    return {
      tabs: [ mk('loading', '확인중'), mk('success', '성공'), mk('fail', '실패') ],
      isLoading: v === 'loading',
      isSuccess: v === 'success',
      isFail: v === 'fail',
      ringColor: s.ring,
      titleColor: s.titleColor,
      title: s.title,
      subtitle: s.subtitle,
      retry: () => this.setState({ view: 'loading' }),
    };
  }
}
</script>
</body>
</html>
