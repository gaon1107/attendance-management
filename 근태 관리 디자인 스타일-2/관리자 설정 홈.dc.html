<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:220px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;padding:20px 12px;">
    <div style="display:flex;align-items:center;gap:9px;padding:0 8px;margin-bottom:22px;">
      <div style="width:28px;height:28px;border-radius:7px;background:#2563EB;display:flex;align-items:center;justify-content:center;"><span style="color:#fff;font-size:15px;font-weight:700;">근</span></div>
      <span style="font-size:16px;font-weight:700;letter-spacing:-0.01em;">근태관리</span>
    </div>
    <nav style="display:flex;flex-direction:column;gap:1px;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="8">
        <a href="#" style="display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:7px;text-decoration:none;font-size:15px;font-weight:{{ m.weight }};color:{{ m.color }};background:{{ m.bg }};" style-hover="background:#F3F4F6;">
          <span style="width:17px;height:17px;display:flex;color:{{ m.iconColor }};" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          {{ m.label }}
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px;border-top:1px solid #F3F4F6;">
      <div style="width:30px;height:30px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
      <div style="min-width:0;"><div style="font-size:13px;font-weight:700;">관리자</div><div style="font-size:13px;color:#9CA3AF;">admin@skytech.co.kr</div></div>
    </div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="margin-bottom:18px;">
      <div style="font-size:22px;font-weight:700;line-height:1.2;">설정</div>
      <div style="font-size:13px;color:#6B7280;margin-top:3px;">㈜하늘테크 · 관리자 홍길동</div>
    </div>

    <!-- Groups -->
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
      <div style="font-size:13px;font-weight:700;color:#6B7280;margin:0 2px 10px;">{{ g.title }}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;">
        <sc-for list="{{ g.items }}" as="c" hint-placeholder-count="3">
          <a href="#" style="display:flex;align-items:flex-start;gap:13px;background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:16px 18px;text-decoration:none;" style-hover="border-color:#C7CDD4;background:#FCFCFD;">
            <span style="width:38px;height:38px;flex-shrink:0;border-radius:9px;background:#EFF6FF;color:#2563EB;display:flex;align-items:center;justify-content:center;" dangerouslySetInnerHTML="{{ c.icon }}"></span>
            <span style="flex:1;min-width:0;">
              <span style="display:flex;align-items:center;gap:7px;">
                <span style="font-size:15px;font-weight:700;color:#111827;">{{ c.title }}</span>
                <sc-if value="{{ c.badge }}" hint-placeholder-val="{{ false }}"><span style="height:20px;padding:0 7px;border-radius:6px;background:#F3F4F6;font-size:13px;font-weight:700;color:#6B7280;display:inline-flex;align-items:center;">{{ c.badge }}</span></sc-if>
              </span>
              <span style="display:block;font-size:13px;color:#6B7280;margin-top:3px;line-height:1.45;">{{ c.desc }}</span>
            </span>
          </a>
        </sc-for>
      </div>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const nav = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', false, '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', false, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['초과근무', false, '<circle cx="12" cy="12" r="9"/><path d="M12 8v4l2.5 2.5"/><path d="M9 2h6"/>'],
      ['휴가관리', false, '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', false,   '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['설정', true,      '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: nav(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    const c = (p) => ({ __html: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    return {
      menu,
      groups: [
        { title: '근무 · 근태', items: [
          { icon:c('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'), title:'근무제·기준시간', desc:'표준 근무시간, 지각 기준, 휴게' },
          { icon:c('<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>'), title:'사업장·네트워크', desc:'GPS 반경, 회사 WiFi·IP 등록' },
          { icon:c('<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.5"/>'), title:'자리 확인', desc:'근무 중 자리 유무 확인 주기' },
        ]},
        { title: '데이터 · 연동', items: [
          { icon:c('<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>'), title:'급여 연동', desc:'더존 iCUBE · 항목 매핑', badge:'연결됨' },
          { icon:c('<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'), title:'생체정보 관리', desc:'동의·파기 이력, 감사 로그' },
          { icon:c('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>'), title:'데이터 내보내기', desc:'법정 근로기록 · CSV/PDF' },
        ]},
        { title: '조직 · 계정', items: [
          { icon:c('<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>'), title:'부서 관리', desc:'부서 추가·이동, 팀장 지정' },
          { icon:c('<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 12 0v1"/><path d="M17 11l2 2 4-4"/>'), title:'관리자 권한', desc:'관리자 2명 · 권한 범위 설정', badge:'2명' },
          { icon:c('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'), title:'알림 설정', desc:'결근·정정·초과근무 알림' },
        ]},
      ],
    };
  }
}
</script>
</body>
</html>
