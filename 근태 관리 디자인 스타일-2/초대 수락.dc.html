<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;">

  <div style="display:flex;align-items:center;gap:10px;margin-bottom:28px;">
    <div style="width:32px;height:32px;border-radius:8px;background:#2563EB;display:flex;align-items:center;justify-content:center;"><span style="color:#fff;font-size:18px;font-weight:700;">근</span></div>
    <span style="font-size:18px;font-weight:700;letter-spacing:-0.01em;">근태관리</span>
  </div>

  <div style="width:100%;max-width:440px;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:36px 36px 32px;">

    <!-- Invite banner -->
    <div style="display:flex;align-items:center;gap:12px;background:#EFF6FF;border-radius:10px;padding:14px 16px;margin-bottom:28px;">
      <div style="width:40px;height:40px;flex-shrink:0;border-radius:10px;background:#2563EB;display:flex;align-items:center;justify-content:center;"><span style="color:#fff;font-size:18px;font-weight:700;">하</span></div>
      <div style="font-size:16px;color:#374151;line-height:1.5;"><strong style="color:#111827;">㈜하늘테크</strong>에서 근태관리에<br/>초대했어요.</div>
    </div>

    <div style="font-size:20px;font-weight:700;margin-bottom:6px;">계정 설정</div>
    <div style="font-size:13px;color:#6B7280;margin-bottom:28px;line-height:1.5;">이름과 비밀번호를 설정하면 시작할 수 있어요.</div>

    <form onSubmit="{{ onSubmit }}" style="display:flex;flex-direction:column;gap:20px;">
      <div>
        <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">이메일</label>
        <input value="hong@skytech.co.kr" disabled style="width:100%;height:44px;padding:0 14px;border:1px solid #E5E7EB;border-radius:8px;font-family:inherit;font-size:16px;color:#9CA3AF;background:#F9FAFB;outline:none;" />
      </div>
      <div>
        <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">이름</label>
        <input placeholder="이름을 입력하세요" style="width:100%;height:44px;padding:0 14px;border:1px solid #D1D5DB;border-radius:8px;font-family:inherit;font-size:16px;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
      </div>
      <div>
        <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">비밀번호</label>
        <input type="password" placeholder="영문·숫자 포함 8자 이상" style="width:100%;height:44px;padding:0 14px;border:1px solid #D1D5DB;border-radius:8px;font-family:inherit;font-size:16px;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
      </div>
      <button type="submit" style="height:52px;margin-top:4px;border:none;border-radius:10px;background:#2563EB;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#1D4ED8;">시작하기</button>
    </form>
  </div>

  <div style="font-size:13px;color:#9CA3AF;margin-top:24px;">시작하면 이용약관 및 개인정보처리방침에 동의하게 됩니다.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { return { onSubmit: (e) => e.preventDefault() }; }
}
</script>
</body>
</html>
