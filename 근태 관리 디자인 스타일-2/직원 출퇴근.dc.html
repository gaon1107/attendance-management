<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background:#E5E7EB; }
</style>
</helmet>
<div style="min-height:100vh;background:#E5E7EB;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Pretendard,-apple-system,sans-serif;color:#111827;">

  <!-- Phone frame -->
  <div style="width:390px;height:844px;background:#F9FAFB;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(17,24,39,0.18);display:flex;flex-direction:column;position:relative;">

    <!-- Status bar -->
    <div style="height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;">
      <span>9:41</span>
      <span style="color:#6B7280;">근태관리</span>
    </div>

    <!-- Top bar -->
    <header style="height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;">
      <div style="display:flex;align-items:center;gap:9px;">
        <div style="width:28px;height:28px;border-radius:7px;background:#2563EB;display:flex;align-items:center;justify-content:center;"><span style="color:#fff;font-size:15px;font-weight:700;">근</span></div>
        <span style="font-size:16px;font-weight:700;">근태관리</span>
      </div>
      <button style="width:40px;height:40px;border:none;background:transparent;color:#374151;cursor:pointer;display:flex;align-items:center;justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </header>

    <!-- Body -->
    <div style="flex:1;display:flex;flex-direction:column;padding:24px 24px 0;">

      <!-- Greeting + date -->
      <div style="margin-bottom:20px;">
        <div style="font-size:20px;font-weight:700;margin-bottom:4px;">홍길동님, 좋은 아침이에요</div>
        <div style="font-size:13px;color:#6B7280;">2026년 7월 4일 (금)</div>
      </div>

      <!-- Status card -->
      <div style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:20px 22px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
          <span style="font-size:13px;font-weight:700;color:#6B7280;">현재 상태</span>
          <span style="display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:8px;background:#F3F4F6;">
            <span style="width:7px;height:7px;border-radius:50%;background:#9CA3AF;"></span>
            <span style="font-size:13px;font-weight:700;color:#4B5563;">출근 전</span>
          </span>
        </div>
        <div style="display:flex;align-items:stretch;">
          <div style="flex:1;">
            <div style="font-size:13px;color:#6B7280;margin-bottom:6px;">근무 예정</div>
            <div style="font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;">09:00</div>
            <div style="font-size:13px;color:#6B7280;margin-top:4px;">출근</div>
          </div>
          <div style="width:1px;background:#F3F4F6;margin:0 4px;"></div>
          <div style="flex:1;padding-left:20px;">
            <div style="font-size:13px;color:#6B7280;margin-bottom:6px;">&nbsp;</div>
            <div style="font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;color:#6B7280;">18:00</div>
            <div style="font-size:13px;color:#6B7280;margin-top:4px;">퇴근</div>
          </div>
        </div>
      </div>

      <!-- Location note -->
      <div style="display:flex;align-items:center;gap:8px;margin-top:16px;padding:0 2px;">
        <span style="width:16px;height:16px;color:#16A34A;display:flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
        <span style="font-size:13px;color:#6B7280;">본사 · 위치 확인됨</span>
      </div>

      <!-- Spacer pushes button to thumb zone -->
      <div style="flex:1;"></div>

      <!-- Primary action -->
      <button style="width:100%;height:88px;border:none;border-radius:18px;background:#2563EB;color:#fff;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 16px rgba(37,99,235,0.28);" style-hover="background:#1D4ED8;" style-active="transform:translateY(1px);">
        <span style="font-size:20px;font-weight:700;">출근하기</span>
        <span style="font-size:13px;font-weight:400;opacity:0.85;">지금 시각 08:57</span>
      </button>

    </div>

    <!-- Bottom secondary nav -->
    <nav style="flex-shrink:0;display:flex;padding:12px 16px 28px;border-top:1px solid #E5E7EB;background:#FFFFFF;">
      <a href="#" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;color:#6B7280;">
        <span style="width:24px;height:24px;display:flex;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
        <span style="font-size:13px;font-weight:700;">내 근태 조회</span>
      </a>
      <a href="#" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;color:#6B7280;">
        <span style="width:24px;height:24px;display:flex;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 12 0v1"/></svg></span>
        <span style="font-size:13px;font-weight:700;">내 정보</span>
      </a>
    </nav>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
