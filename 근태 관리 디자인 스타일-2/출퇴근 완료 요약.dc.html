<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background:#E5E7EB; }
</style>
</helmet>
<div style="min-height:100vh;background:#E5E7EB;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Pretendard,-apple-system,sans-serif;color:#111827;">

  <!-- Phone frame -->
  <div style="width:390px;height:844px;background:#F9FAFB;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(17,24,39,0.18);display:flex;flex-direction:column;position:relative;">

    <!-- Status bar -->
    <div style="height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;">
      <span>9:41</span>
      <span style="color:#6B7280;">근태관리</span>
    </div>

    <!-- Body -->
    <div style="flex:1;display:flex;flex-direction:column;padding:12px 24px 30px;">

      <!-- Greeting -->
      <div style="text-align:center;margin:20px 0 24px;">
        <div style="width:72px;height:72px;border-radius:50%;background:#DCFCE7;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;">
          <span style="color:#16A34A;"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
        </div>
        <div style="font-size:20px;font-weight:700;margin-bottom:6px;">수고하셨습니다!</div>
        <div style="font-size:13px;color:#6B7280;">2026년 7월 5일 (토) 근무를 마쳤어요</div>
      </div>

      <!-- Hero: worked time -->
      <div style="background:#2563EB;border-radius:16px;padding:28px 24px;text-align:center;margin-bottom:16px;">
        <div style="font-size:13px;font-weight:700;color:rgba(255,255,255,0.8);margin-bottom:10px;">오늘 실근무시간</div>
        <div style="font-size:44px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;line-height:1.05;">8시간 48분</div>
      </div>

      <!-- Detail rows -->
      <div style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;overflow:hidden;">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #F3F4F6;">
          <div style="display:flex;align-items:center;gap:11px;">
            <span style="width:32px;height:32px;border-radius:8px;background:#F3F4F6;color:#16A34A;display:flex;align-items:center;justify-content:center;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg></span>
            <span style="font-size:15px;font-weight:700;">출근</span>
          </div>
          <span style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;">09:02</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #F3F4F6;">
          <div style="display:flex;align-items:center;gap:11px;">
            <span style="width:32px;height:32px;border-radius:8px;background:#F3F4F6;color:#2563EB;display:flex;align-items:center;justify-content:center;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 17l5-5-5-5M21 12H9M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7"/></svg></span>
            <span style="font-size:15px;font-weight:700;">퇴근</span>
          </div>
          <span style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;">18:05</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:15px 18px;">
          <div style="display:flex;align-items:center;gap:11px;">
            <span style="width:32px;height:32px;border-radius:8px;background:#F3F4F6;color:#B45309;display:flex;align-items:center;justify-content:center;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
            <span style="font-size:15px;font-weight:700;">자리비움</span>
          </div>
          <span style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;color:#B45309;">15분</span>
        </div>
      </div>

      <div style="flex:1;"></div>

      <!-- Action -->
      <button style="width:100%;height:52px;border:none;border-radius:10px;background:#2563EB;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#1D4ED8;">확인</button>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
