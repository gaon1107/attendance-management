<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:220px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;padding:20px 12px;">
    <div style="display:flex;align-items:center;gap:9px;padding:0 8px;margin-bottom:22px;">
      <div style="width:28px;height:28px;border-radius:7px;background:#2563EB;display:flex;align-items:center;justify-content:center;"><span style="color:#fff;font-size:15px;font-weight:700;">근</span></div>
      <span style="font-size:16px;font-weight:700;letter-spacing:-0.01em;">근태관리</span>
    </div>
    <nav style="display:flex;flex-direction:column;gap:1px;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="7">
        <a href="#" style="display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:7px;text-decoration:none;font-size:15px;font-weight:{{ m.weight }};color:{{ m.color }};background:{{ m.bg }};" style-hover="background:#F3F4F6;">
          <span style="width:17px;height:17px;display:flex;color:{{ m.iconColor }};" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          {{ m.label }}
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px;border-top:1px solid #F3F4F6;">
      <div style="width:30px;height:30px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
      <div style="min-width:0;"><div style="font-size:13px;font-weight:700;">관리자</div><div style="font-size:13px;color:#9CA3AF;">admin@skytech.co.kr</div></div>
    </div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div>
        <div style="font-size:22px;font-weight:700;line-height:1.2;">근태 캘린더</div>
        <div style="font-size:13px;color:#6B7280;margin-top:3px;">홍길동 · 영업팀</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <select style="height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;color:#111827;outline:none;background:#fff;"><option>홍길동</option><option>김민준</option><option>이서윤</option></select>
        <div style="display:flex;align-items:center;background:#fff;border:1px solid #D1D5DB;border-radius:7px;height:40px;overflow:hidden;">
          <button style="width:40px;height:40px;border:none;background:transparent;color:#6B7280;cursor:pointer;display:flex;align-items:center;justify-content:center;" style-hover="background:#F3F4F6;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <span style="padding:0 8px;font-size:15px;font-weight:700;min-width:100px;text-align:center;">2026년 7월</span>
          <button style="width:40px;height:40px;border:none;background:transparent;color:#6B7280;cursor:pointer;display:flex;align-items:center;justify-content:center;" style-hover="background:#F3F4F6;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
      </div>
    </div>

    <!-- Legend -->
    <div style="display:flex;gap:16px;margin-bottom:12px;">
      <sc-for list="{{ legend }}" as="l" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;gap:6px;"><span style="width:9px;height:9px;border-radius:3px;background:{{ l.color }};"></span><span style="font-size:13px;color:#6B7280;font-weight:700;">{{ l.label }}</span></div>
      </sc-for>
    </div>

    <!-- Calendar -->
    <section style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;">
      <div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #E5E7EB;background:#F9FAFB;">
        <sc-for list="{{ dows }}" as="d" hint-placeholder-count="7">
          <div style="padding:10px 0;text-align:center;font-size:13px;font-weight:700;color:{{ d.color }};">{{ d.label }}</div>
        </sc-for>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);">
        <sc-for list="{{ cells }}" as="c" hint-placeholder-count="35">
          <div style="min-height:88px;border-right:1px solid #F3F4F6;border-bottom:1px solid #F3F4F6;padding:7px 9px;background:{{ c.bg }};">
            <div style="font-size:13px;font-weight:700;color:{{ c.numColor }};margin-bottom:5px;">{{ c.num }}</div>
            <sc-if value="{{ c.hasRecord }}" hint-placeholder-val="{{ false }}">
              <div style="display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:{{ c.tagBg }};font-size:13px;font-weight:700;color:{{ c.tagFg }};margin-bottom:3px;">{{ c.tag }}</div>
              <div style="font-size:13px;color:#9CA3AF;font-variant-numeric:tabular-nums;">{{ c.time }}</div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ic = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', false, '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', true,  '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', false, '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', false,   '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['설정', false,     '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: ic(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    const dows = ['일','월','화','수','목','금','토'].map((label, i) => ({
      label, color: i===0 ? '#DC2626' : (i===6 ? '#2563EB' : '#6B7280'),
    }));
    const T = {
      ok:   { tag:'정상', tagBg:'#DCFCE7', tagFg:'#15803D' },
      late: { tag:'지각', tagBg:'#FEF3C7', tagFg:'#B45309' },
      off:  { tag:'연차', tagBg:'#DBEAFE', tagFg:'#1D4ED8' },
      absent:{tag:'결근', tagBg:'#FEE2E2', tagFg:'#B91C1C' },
    };
    const rec = {
      1:{...T.ok,time:'08:47–18:02'}, 2:{...T.off,time:'개인 사정'}, 3:{...T.late,time:'09:20–18:05'},
      4:{...T.ok,time:'08:52–18:10'}, 7:{...T.ok,time:'08:50–18:00'}, 8:{...T.ok,time:'08:55–19:10'},
      9:{...T.ok,time:'08:48–18:04'}, 10:{...T.ok,time:'08:51–18:20'}, 13:{...T.ok,time:'08:49–18:02'},
      14:{...T.absent,time:'기록 없음'}, 15:{...T.ok,time:'08:53–18:08'}, 16:{...T.ok,time:'08:50–18:00'},
      17:{...T.late,time:'09:12–18:30'}, 20:{...T.ok,time:'08:47–18:05'}, 21:{...T.ok,time:'08:52–18:10'},
    };
    const cells = [];
    for (let i = 0; i < 3; i++) cells.push({ num:'', bg:'#FBFBFC', numColor:'#D1D5DB', hasRecord:false });
    for (let d = 1; d <= 31; d++) {
      const dow = (d + 2) % 7;
      const weekend = dow === 0 || dow === 6;
      const r = rec[d];
      cells.push({
        num: d,
        bg: weekend ? '#FBFBFC' : '#FFFFFF',
        numColor: dow===0 ? '#DC2626' : (dow===6 ? '#2563EB' : '#374151'),
        hasRecord: !!r,
        tag: r ? r.tag : '', tagBg: r ? r.tagBg : '', tagFg: r ? r.tagFg : '', time: r ? r.time : '',
      });
    }
    while (cells.length % 7 !== 0) cells.push({ num:'', bg:'#FBFBFC', numColor:'#D1D5DB', hasRecord:false });
    return {
      menu, dows, cells,
      legend: [
        { label:'정상', color:'#16A34A' },
        { label:'지각', color:'#F59E0B' },
        { label:'연차', color:'#2563EB' },
        { label:'결근', color:'#DC2626' },
      ],
    };
  }
}
</script>
</body>
</html>
