<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:220px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;padding:20px 12px;">
    <div style="display:flex;align-items:center;gap:9px;padding:0 8px;margin-bottom:22px;">
      <div style="width:28px;height:28px;border-radius:7px;background:#2563EB;display:flex;align-items:center;justify-content:center;"><span style="color:#fff;font-size:15px;font-weight:700;">근</span></div>
      <span style="font-size:16px;font-weight:700;letter-spacing:-0.01em;">근태관리</span>
    </div>
    <nav style="display:flex;flex-direction:column;gap:1px;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="7">
        <a href="#" style="display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:7px;text-decoration:none;font-size:15px;font-weight:{{ m.weight }};color:{{ m.color }};background:{{ m.bg }};" style-hover="background:#F3F4F6;">
          <span style="width:17px;height:17px;display:flex;color:{{ m.iconColor }};" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          {{ m.label }}
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px;border-top:1px solid #F3F4F6;">
      <div style="width:30px;height:30px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
      <div style="min-width:0;"><div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">관리자</div><div style="font-size:13px;color:#9CA3AF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">admin@skytech.co.kr</div></div>
    </div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
      <div>
        <div style="font-size:22px;font-weight:700;line-height:1.2;">대시보드</div>
        <div style="font-size:13px;color:#6B7280;margin-top:3px;">㈜하늘테크 · 오늘의 근태 현황</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:7px;font-size:15px;font-weight:700;">
          <span style="width:15px;height:15px;display:flex;color:#6B7280;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
          2026-07-04 금
        </div>
        <button style="height:40px;padding:0 16px;border:none;border-radius:7px;background:#2563EB;color:#fff;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#1D4ED8;">리포트 내보내기</button>
      </div>
    </div>

    <!-- Summary cards -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;">
      <sc-for list="{{ summary }}" as="s" hint-placeholder-count="4">
        <div style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;padding:16px 18px;">
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:10px;">
            <span style="width:7px;height:7px;border-radius:50%;background:{{ s.dot }};"></span>
            <span style="font-size:13px;color:#6B7280;font-weight:700;">{{ s.label }}</span>
          </div>
          <div style="font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:{{ s.valueColor }};">{{ s.value }}</div>
          <div style="font-size:13px;color:#9CA3AF;margin-top:5px;">{{ s.sub }}</div>
        </div>
      </sc-for>
    </div>

    <!-- Attention table -->
    <section style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;">
      <div style="padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E5E7EB;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="font-size:16px;font-weight:700;">주의가 필요한 직원</div>
          <span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:#FEE2E2;font-size:13px;font-weight:700;color:#B91C1C;">3건</span>
        </div>
        <a href="#" style="font-size:13px;font-weight:700;color:#2563EB;text-decoration:none;">전체 근태현황 보기</a>
      </div>
      <table style="width:100%;border-collapse:collapse;">
        <thead>
          <tr style="background:#F9FAFB;border-bottom:1px solid #E5E7EB;">
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;">이름</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">부서</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">출근</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">상태</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">사유</th>
            <th style="text-align:right;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;">처리</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{ attention }}" as="r" hint-placeholder-count="3">
            <tr style="border-bottom:1px solid #F3F4F6;">
              <td style="padding:11px 20px;font-size:15px;font-weight:700;">{{ r.name }}</td>
              <td style="padding:11px 14px;font-size:15px;color:#6B7280;">{{ r.dept }}</td>
              <td style="padding:11px 14px;font-size:15px;font-variant-numeric:tabular-nums;color:{{ r.inColor }};">{{ r.in }}</td>
              <td style="padding:11px 14px;">
                <span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:#F3F4F6;">
                  <span style="width:6px;height:6px;border-radius:50%;background:{{ r.dot }};"></span>
                  <span style="font-size:13px;font-weight:700;color:#374151;">{{ r.status }}</span>
                </span>
              </td>
              <td style="padding:11px 14px;font-size:15px;color:#6B7280;">{{ r.reason }}</td>
              <td style="padding:11px 20px;text-align:right;">
                <button style="height:34px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;background:#fff;color:#374151;font-family:inherit;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#F9FAFB;">확인</button>
              </td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ic = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', true,  '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', false, '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', false, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', false, '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', false,   '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['설정', false,     '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: ic(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    return {
      menu,
      summary: [
        { label: '출근',        value: '18명',   sub: '전체 20명 중',   dot: '#16A34A', valueColor: '#111827' },
        { label: '미출근',      value: '2명',    sub: '확인 필요',      dot: '#F59E0B', valueColor: '#B45309' },
        { label: '지각',        value: '1명',    sub: '09:20 출근',    dot: '#F59E0B', valueColor: '#B45309' },
        { label: '실근무 평균', value: '8.4시간', sub: '어제보다 +0.2h', dot: '#2563EB', valueColor: '#111827' },
      ],
      attention: [
        { name: '김민준', dept: '개발팀',     in: '09:20', inColor: '#B45309', status: '지각',   dot: '#F59E0B', reason: '20분 지각' },
        { name: '이서윤', dept: '디자인팀',   in: '—',     inColor: '#B91C1C', status: '미출근', dot: '#DC2626', reason: '연락 없음' },
        { name: '박도현', dept: '경영지원팀', in: '—',     inColor: '#B91C1C', status: '미출근', dot: '#DC2626', reason: '연락 없음' },
      ],
    };
  }
}
</script>
</body>
</html>
