<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background:#E5E7EB; }
</style>
</helmet>
<div style="min-height:100vh;background:#E5E7EB;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Pretendard,-apple-system,sans-serif;color:#111827;">

  <div style="width:390px;height:844px;background:#F9FAFB;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(17,24,39,0.18);display:flex;flex-direction:column;position:relative;">

    <div style="height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;"><span>9:41</span><span style="color:#6B7280;">근태관리</span></div>

    <header style="height:52px;flex-shrink:0;display:flex;align-items:center;padding:0 12px;">
      <button style="width:40px;height:40px;border:none;background:transparent;color:#374151;cursor:pointer;display:flex;align-items:center;justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span style="font-size:16px;font-weight:700;margin-left:4px;">재택근무 신청</span>
    </header>

    <div style="flex:1;overflow-y:auto;padding:8px 24px 8px;">
      <!-- Remaining -->
      <div style="display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:16px 18px;margin-bottom:20px;">
        <div><div style="font-size:13px;color:#6B7280;margin-bottom:4px;">이번 달 재택 가능</div><div style="font-size:15px;font-weight:700;">주 2회 · <span style="color:#2563EB;">3회 남음</span></div></div>
        <span style="width:38px;height:38px;border-radius:10px;background:#EFF6FF;color:#2563EB;display:flex;align-items:center;justify-content:center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11h14V9"/></svg></span>
      </div>

      <!-- Date -->
      <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">재택 근무일</label>
      <div style="display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border:1px solid #D1D5DB;border-radius:9px;background:#fff;margin-bottom:20px;">
        <span style="width:18px;height:18px;color:#6B7280;display:flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
        <span style="font-size:15px;font-weight:700;">2026년 7월 8일 (화)</span>
      </div>

      <!-- Work location -->
      <label style="display:block;font-size:13px;font-weight:700;margin-bottom:10px;">근무 장소</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;">
        <sc-for list="{{ places }}" as="p" hint-placeholder-count="2">
          <button onClick="{{ p.select }}" style="height:48px;border:1px solid {{ p.border }};border-radius:9px;background:{{ p.bg }};color:{{ p.fg }};font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;" style-hover="border-color:#2563EB;">{{ p.label }}</button>
        </sc-for>
      </div>

      <!-- Check-in method note -->
      <div style="display:flex;align-items:flex-start;gap:8px;background:#EFF6FF;border-radius:9px;padding:12px 14px;margin-bottom:20px;">
        <span style="width:16px;height:16px;flex-shrink:0;margin-top:1px;color:#2563EB;display:flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></span>
        <span style="font-size:13px;color:#1D4ED8;font-weight:700;line-height:1.5;">재택 근무일에는 GPS 없이 얼굴인증으로만 출퇴근이 기록됩니다.</span>
      </div>

      <!-- Task plan -->
      <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">업무 계획 <span style="color:#9CA3AF;font-weight:400;">(간단히)</span></label>
      <textarea placeholder="예: 신규 기능 기획서 작성, 오후 화상 회의 2건" style="width:100%;height:88px;padding:12px 14px;border:1px solid #D1D5DB;border-radius:9px;font-family:inherit;font-size:15px;color:#111827;outline:none;resize:none;line-height:1.5;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);"></textarea>

      <!-- Approver -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding:14px 18px;background:#fff;border:1px solid #E5E7EB;border-radius:10px;">
        <span style="font-size:15px;color:#6B7280;">승인자</span>
        <div style="display:flex;align-items:center;gap:9px;">
          <span style="width:28px;height:28px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">정</span>
          <span style="font-size:15px;font-weight:700;">정우성 팀장</span>
        </div>
      </div>
    </div>

    <div style="flex-shrink:0;border-top:1px solid #E5E7EB;background:#FFFFFF;padding:16px 24px 26px;">
      <button style="width:100%;height:52px;border:none;border-radius:10px;background:#2563EB;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#1D4ED8;">재택근무 신청하기</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { place: '자택' };
  renderVals() {
    const sel = this.state.place;
    return {
      places: ['자택','거점오피스'].map(label => {
        const a = label === sel;
        return { label, select: () => this.setState({ place: label }),
          bg: a?'#EFF6FF':'#fff', fg: a?'#1D4ED8':'#374151', border: a?'#2563EB':'#D1D5DB' };
      }),
    };
  }
}
</script>
</body>
</html>
