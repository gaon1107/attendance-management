<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background:#E5E7EB; }
</style>
</helmet>
<div style="min-height:100vh;background:#E5E7EB;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Pretendard,-apple-system,sans-serif;color:#111827;">

  <!-- Phone frame -->
  <div style="width:390px;height:844px;background:#F9FAFB;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(17,24,39,0.18);display:flex;flex-direction:column;position:relative;">

    <!-- Status bar -->
    <div style="height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;">
      <span>9:41</span>
      <span style="color:#6B7280;">근태관리</span>
    </div>

    <!-- ===== CAPTURE STATE ===== -->
    <sc-if value="{{ showCapture }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1;display:flex;flex-direction:column;">
      <header style="height:52px;flex-shrink:0;display:flex;align-items:center;padding:0 12px;">
        <button style="width:40px;height:40px;border:none;background:transparent;color:#374151;cursor:pointer;display:flex;align-items:center;justify-content:center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </header>

      <div style="padding:8px 24px 4px;text-align:center;flex-shrink:0;">
        <div style="font-size:20px;font-weight:700;margin-bottom:8px;">얼굴 등록</div>
        <div style="font-size:16px;color:#6B7280;line-height:1.5;">원 안에 얼굴을 맞춰주세요</div>
      </div>

      <!-- Camera preview -->
      <div style="flex:1;display:flex;align-items:center;justify-content:center;">
        <div style="position:relative;width:260px;height:260px;">
          <!-- circular preview -->
          <div style="position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#111827;display:flex;align-items:center;justify-content:center;">
            <div style="width:100%;height:100%;background:radial-gradient(circle at 50% 42%, #4B5563 0%, #1F2937 60%, #111827 100%);display:flex;align-items:flex-end;justify-content:center;">
              <span style="color:#6B7280;margin-bottom:36px;"><svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg></span>
            </div>
          </div>
          <!-- guide ring -->
          <div style="position:absolute;inset:-6px;border-radius:50%;border:3px dashed #2563EB;"></div>
        </div>
      </div>

      <!-- Hint -->
      <div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:0 24px 20px;flex-shrink:0;">
        <span style="width:16px;height:16px;color:#16A34A;display:flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></span>
        <span style="font-size:13px;color:#6B7280;">밝은 곳에서 정면을 바라봐 주세요</span>
      </div>

      <!-- Shutter -->
      <div style="flex-shrink:0;padding:0 24px 30px;">
        <button onClick="{{ capture }}" style="width:100%;height:56px;border:none;border-radius:12px;background:#2563EB;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;" style-hover="background:#1D4ED8;" style-active="transform:translateY(1px);">
          <span style="width:18px;height:18px;display:flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
          촬영하기
        </button>
      </div>
    </div>
    </sc-if>

    <!-- ===== SUCCESS STATE ===== -->
    <sc-if value="{{ showSuccess }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;display:flex;flex-direction:column;padding:0 24px 30px;">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
        <div style="width:96px;height:96px;border-radius:50%;background:#DCFCE7;display:flex;align-items:center;justify-content:center;margin-bottom:28px;">
          <span style="color:#16A34A;"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
        </div>
        <div style="font-size:20px;font-weight:700;margin-bottom:10px;">등록 완료!</div>
        <div style="font-size:16px;color:#6B7280;line-height:1.55;max-width:260px;">이제 얼굴로 출퇴근할 수 있어요.<br/>다음부터 카메라로 바로 인증됩니다.</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <button style="width:100%;height:52px;border:none;border-radius:10px;background:#2563EB;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#1D4ED8;">출퇴근 화면으로</button>
        <button onClick="{{ retake }}" style="width:100%;height:48px;border:1px solid #D1D5DB;border-radius:10px;background:#fff;color:#111827;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#F9FAFB;">다시 촬영</button>
      </div>
    </div>
    </sc-if>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { done: false };
  renderVals() {
    return {
      showCapture: !this.state.done,
      showSuccess: this.state.done,
      capture: () => this.setState({ done: true }),
      retake: () => this.setState({ done: false }),
    };
  }
}
</script>
</body>
</html>
