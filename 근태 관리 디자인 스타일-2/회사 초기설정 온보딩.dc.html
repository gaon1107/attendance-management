<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;flex-direction:column;align-items:center;padding:40px 24px 64px;">

  <!-- Brand -->
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:32px;">
    <div style="width:32px;height:32px;border-radius:8px;background:#2563EB;display:flex;align-items:center;justify-content:center;"><span style="color:#fff;font-size:18px;font-weight:700;">근</span></div>
    <span style="font-size:18px;font-weight:700;letter-spacing:-0.01em;">근태관리</span>
  </div>

  <div style="width:100%;max-width:720px;">

    <!-- Progress -->
    <div style="display:flex;align-items:center;margin-bottom:36px;">
      <sc-for list="{{ steps }}" as="s" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;{{ s.grow }}">
          <div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;">
            <div style="width:36px;height:36px;border-radius:50%;background:{{ s.circleBg }};border:2px solid {{ s.circleBorder }};color:{{ s.circleFg }};display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;" dangerouslySetInnerHTML="{{ s.mark }}"></div>
            <span style="font-size:13px;font-weight:700;color:{{ s.labelColor }};white-space:nowrap;">{{ s.label }}</span>
          </div>
          <sc-if value="{{ s.hasLine }}" hint-placeholder-val="{{ true }}">
            <div style="flex:1;height:2px;background:{{ s.lineColor }};margin:0 12px;margin-bottom:26px;"></div>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <!-- Card -->
    <div style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:36px 40px;">

      <!-- STEP 1 -->
      <sc-if value="{{ isStep1 }}" hint-placeholder-val="{{ true }}">
        <div style="font-size:20px;font-weight:700;margin-bottom:6px;">표준 근무시간</div>
        <div style="font-size:13px;color:#6B7280;margin-bottom:28px;">회사 전체에 적용되는 기본 출퇴근 시간을 설정합니다. 나중에 변경할 수 있어요.</div>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:20px;max-width:440px;">
          <div><label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">출근 시간</label><input value="09:00" style="width:100%;height:44px;padding:0 14px;border:1px solid #D1D5DB;border-radius:8px;font-family:inherit;font-size:16px;font-variant-numeric:tabular-nums;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" /></div>
          <div><label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">퇴근 시간</label><input value="18:00" style="width:100%;height:44px;padding:0 14px;border:1px solid #D1D5DB;border-radius:8px;font-family:inherit;font-size:16px;font-variant-numeric:tabular-nums;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" /></div>
        </div>
        <label style="display:block;font-size:13px;font-weight:700;margin:20px 0 12px;">근무 요일</label>
        <div style="display:flex;gap:8px;">
          <sc-for list="{{ weekdays }}" as="w" hint-placeholder-count="7">
            <div style="width:44px;height:44px;border-radius:8px;border:1px solid {{ w.border }};background:{{ w.bg }};color:{{ w.fg }};display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;">{{ w.label }}</div>
          </sc-for>
        </div>
      </sc-if>

      <!-- STEP 2 -->
      <sc-if value="{{ isStep2 }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:20px;font-weight:700;margin-bottom:6px;">사업장 위치</div>
        <div style="font-size:13px;color:#6B7280;margin-bottom:28px;">GPS 출퇴근이 허용되는 사업장 위치와 반경을 설정합니다.</div>
        <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">사업장 주소</label>
        <div style="display:flex;gap:10px;margin-bottom:20px;">
          <div style="position:relative;flex:1;">
            <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#9CA3AF;display:flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
            <input value="서울 강남구 테헤란로 123, 하늘빌딩 8층" style="width:100%;height:44px;padding:0 14px 0 40px;border:1px solid #D1D5DB;border-radius:8px;font-family:inherit;font-size:16px;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
          </div>
          <button style="height:44px;padding:0 18px;border:1px solid #D1D5DB;border-radius:8px;background:#fff;color:#111827;font-family:inherit;font-size:16px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#F9FAFB;">주소 검색</button>
        </div>
        <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:end;">
          <!-- Map preview -->
          <div style="position:relative;height:200px;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;background:#F3F4F6;">
            <div style="position:absolute;inset:0;background-image:linear-gradient(#E5E7EB 1px,transparent 1px),linear-gradient(90deg,#E5E7EB 1px,transparent 1px);background-size:28px 28px;opacity:0.7;"></div>
            <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:50%;background:rgba(37,99,235,0.10);border:2px dashed #93C5FD;"></div>
            <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-100%);color:#2563EB;"><svg width="34" height="34" viewBox="0 0 24 24" fill="#2563EB" stroke="#fff" stroke-width="1.5"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3" fill="#fff" stroke="none"/></svg></div>
          </div>
          <div>
            <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">허용 반경 (m)</label>
            <input value="150" style="width:100%;height:44px;padding:0 14px;border:1px solid #D1D5DB;border-radius:8px;font-family:inherit;font-size:16px;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
            <div style="font-size:13px;color:#6B7280;margin-top:8px;line-height:1.5;">반경 안에서만 GPS 출퇴근이 인정됩니다. (권장 50~200m)</div>
          </div>
        </div>
      </sc-if>

      <!-- STEP 3 -->
      <sc-if value="{{ isStep3 }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:20px;font-weight:700;margin-bottom:6px;">사업장 규모</div>
        <div style="font-size:13px;color:#6B7280;margin-bottom:28px;">근로기준법 적용 범위가 달라지므로 정확히 선택해 주세요.</div>
        <label style="display:block;font-size:16px;font-weight:700;margin-bottom:14px;">상시 근로자 5인 이상 사업장인가요?</label>
        <div style="display:flex;flex-direction:column;gap:12px;max-width:520px;">
          <sc-for list="{{ sizeOptions }}" as="o" hint-placeholder-count="2">
            <button onClick="{{ o.select }}" style="text-align:left;display:flex;align-items:center;gap:14px;height:64px;padding:0 20px;border:1px solid {{ o.border }};border-radius:10px;background:{{ o.bg }};font-family:inherit;cursor:pointer;" style-hover="border-color:#2563EB;">
              <span style="width:22px;height:22px;flex-shrink:0;border-radius:50%;border:2px solid {{ o.radioBorder }};display:flex;align-items:center;justify-content:center;"><span style="width:10px;height:10px;border-radius:50%;background:{{ o.radioDot }};"></span></span>
              <span style="flex:1;">
                <span style="display:block;font-size:16px;font-weight:700;color:#111827;">{{ o.title }}</span>
                <span style="display:block;font-size:13px;color:#6B7280;margin-top:2px;">{{ o.desc }}</span>
              </span>
            </button>
          </sc-for>
        </div>
      </sc-if>

      <!-- Nav buttons -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:36px;padding-top:24px;border-top:1px solid #F3F4F6;">
        <button onClick="{{ prev }}" disabled="{{ atFirst }}" style="height:48px;padding:0 22px;border:1px solid #D1D5DB;border-radius:8px;background:#fff;color:{{ prevColor }};font-family:inherit;font-size:16px;font-weight:700;cursor:{{ prevCursor }};">이전</button>
        <sc-if value="{{ notLast }}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ next }}" style="height:48px;padding:0 28px;border:none;border-radius:8px;background:#2563EB;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#1D4ED8;">다음</button>
        </sc-if>
        <sc-if value="{{ isLast }}" hint-placeholder-val="{{ false }}">
          <button style="height:48px;padding:0 28px;border:none;border-radius:8px;background:#16A34A;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#15803D;">설정 완료</button>
        </sc-if>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { step: 1, size: '5plus' };
  renderVals() {
    const step = this.state.step;
    const check = { __html: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' };
    const defs = [ [1,'근무시간'], [2,'사업장 위치'], [3,'사업장 규모'] ];
    const steps = defs.map(([n, label], i) => {
      const done = step > n;
      const active = step === n;
      return {
        label,
        mark: done ? check : { __html: String(n) },
        circleBg: done ? '#2563EB' : (active ? '#EFF6FF' : '#FFFFFF'),
        circleBorder: (done || active) ? '#2563EB' : '#D1D5DB',
        circleFg: done ? '#FFFFFF' : (active ? '#2563EB' : '#9CA3AF'),
        labelColor: (done || active) ? '#2563EB' : '#9CA3AF',
        hasLine: i < defs.length - 1,
        lineColor: step > n ? '#2563EB' : '#E5E7EB',
        grow: i < defs.length - 1 ? 'flex:1;' : '',
      };
    });
    const weekdays = ['월','화','수','목','금','토','일'].map((label, i) => {
      const on = i < 5;
      return { label, bg: on?'#EFF6FF':'#fff', fg: on?'#1D4ED8':'#9CA3AF', border: on?'#2563EB':'#D1D5DB' };
    });
    const size = this.state.size;
    const sizeOptions = [
      { id:'5plus', title:'예, 5인 이상입니다', desc:'연장·야간·휴일 가산수당, 연차 등이 적용됩니다.' },
      { id:'under5', title:'아니요, 5인 미만입니다', desc:'일부 근로기준 조항이 적용되지 않습니다.' },
    ].map(o => {
      const a = o.id === size;
      return { ...o, select: () => this.setState({ size: o.id }),
        bg: a?'#EFF6FF':'#fff', border: a?'#2563EB':'#D1D5DB',
        radioBorder: a?'#2563EB':'#D1D5DB', radioDot: a?'#2563EB':'transparent' };
    });
    return {
      steps, weekdays, sizeOptions,
      isStep1: step===1, isStep2: step===2, isStep3: step===3,
      atFirst: step===1,
      prevColor: step===1 ? '#D1D5DB' : '#111827',
      prevCursor: step===1 ? 'not-allowed' : 'pointer',
      notLast: step < 3, isLast: step === 3,
      prev: () => this.setState(s => ({ step: Math.max(1, s.step-1) })),
      next: () => this.setState(s => ({ step: Math.min(3, s.step+1) })),
    };
  }
}
</script>
</body>
</html>
