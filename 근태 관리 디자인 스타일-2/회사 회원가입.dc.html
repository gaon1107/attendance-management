<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;">

  <!-- Brand -->
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:28px;">
    <div style="width:32px;height:32px;border-radius:8px;background:#2563EB;display:flex;align-items:center;justify-content:center;">
      <span style="color:#fff;font-size:18px;font-weight:700;">근</span>
    </div>
    <span style="font-size:18px;font-weight:700;letter-spacing:-0.01em;">근태관리</span>
  </div>

  <!-- Card -->
  <div style="width:100%;max-width:440px;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:36px 36px 32px;">
    <div style="font-size:20px;font-weight:700;margin-bottom:6px;">회사 회원가입</div>
    <div style="font-size:13px;color:#6B7280;margin-bottom:28px;line-height:1.5;">회사 관리자 계정을 만들어 근태관리를 시작하세요.</div>

    <form onSubmit="{{ onSubmit }}" style="display:flex;flex-direction:column;gap:20px;">
      <div>
        <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">회사명</label>
        <input value="㈜하늘테크" style="width:100%;height:44px;padding:0 14px;border:1px solid #D1D5DB;border-radius:8px;font-family:inherit;font-size:16px;color:#111827;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
      </div>
      <div>
        <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">이메일</label>
        <input type="email" value="admin@skytech.co.kr" style="width:100%;height:44px;padding:0 14px;border:1px solid #D1D5DB;border-radius:8px;font-family:inherit;font-size:16px;color:#111827;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
      </div>
      <div>
        <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">비밀번호</label>
        <input type="password" value="password1234" style="width:100%;height:44px;padding:0 14px;border:1px solid #D1D5DB;border-radius:8px;font-family:inherit;font-size:16px;color:#111827;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
        <div style="font-size:13px;color:#6B7280;margin-top:8px;">영문·숫자 포함 8자 이상</div>
      </div>

      <button type="submit" style="height:52px;margin-top:4px;border:none;border-radius:10px;background:#2563EB;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#1D4ED8;">가입하기</button>
    </form>

    <!-- Divider -->
    <div style="display:flex;align-items:center;gap:14px;margin:28px 0 24px;">
      <div style="flex:1;height:1px;background:#E5E7EB;"></div>
      <div style="font-size:13px;color:#6B7280;">또는 간편 가입</div>
      <div style="flex:1;height:1px;background:#E5E7EB;"></div>
    </div>

    <!-- Social buttons -->
    <div style="display:flex;flex-direction:column;gap:12px;">
      <button style="position:relative;width:100%;height:48px;border:none;border-radius:8px;background:#FEE500;color:#191600;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;" style-hover="filter:brightness(0.97);">
        <span style="position:absolute;left:16px;display:flex;">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#191600" d="M12 3C6.48 3 2 6.58 2 11c0 2.86 1.9 5.36 4.76 6.76-.16.55-.86 2.98-.88 3.17 0 0-.02.15.08.21.1.06.22.01.22.01.28-.04 3.27-2.14 3.78-2.5.66.09 1.34.14 2.04.14 5.52 0 10-3.58 10-8S17.52 3 12 3z"/></svg>
        </span>
        카카오로 시작하기
      </button>

      <button style="position:relative;width:100%;height:48px;border:none;border-radius:8px;background:#03C75A;color:#FFFFFF;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;" style-hover="filter:brightness(0.96);">
        <span style="position:absolute;left:16px;display:flex;">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFFFFF" d="M16.27 12.84 7.35 0H0v24h7.73V11.16L16.65 24H24V0h-7.73z"/></svg>
        </span>
        네이버로 시작하기
      </button>

      <button style="position:relative;width:100%;height:48px;border:1px solid #D1D5DB;border-radius:8px;background:#FFFFFF;color:#111827;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;" style-hover="background:#F9FAFB;">
        <span style="position:absolute;left:16px;display:flex;">
          <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        </span>
        Google로 시작하기
      </button>
    </div>

    <div style="text-align:center;font-size:13px;color:#6B7280;margin-top:28px;">
      이미 계정이 있으세요? <a href="#" style="color:#2563EB;font-weight:700;text-decoration:none;">로그인</a>
    </div>
  </div>

  <div style="font-size:13px;color:#9CA3AF;margin-top:24px;">가입 시 이용약관 및 개인정보처리방침에 동의하게 됩니다.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      onSubmit: (e) => { e.preventDefault(); },
    };
  }
}
</script>
</body>
</html>
