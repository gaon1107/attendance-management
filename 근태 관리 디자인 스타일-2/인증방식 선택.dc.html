<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background:#E5E7EB; }
</style>
</helmet>
<div style="min-height:100vh;background:#E5E7EB;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Pretendard,-apple-system,sans-serif;color:#111827;">

  <!-- Phone frame -->
  <div style="width:390px;height:844px;background:#F9FAFB;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(17,24,39,0.18);display:flex;flex-direction:column;position:relative;">

    <!-- Status bar -->
    <div style="height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;">
      <span>9:41</span>
      <span style="color:#6B7280;">근태관리</span>
    </div>

    <!-- Top bar -->
    <header style="height:52px;flex-shrink:0;display:flex;align-items:center;padding:0 12px;">
      <button style="width:40px;height:40px;border:none;background:transparent;color:#374151;cursor:pointer;display:flex;align-items:center;justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </header>

    <!-- Body -->
    <div style="flex:1;display:flex;flex-direction:column;padding:8px 24px 0;overflow-y:auto;">

      <!-- Heading -->
      <div style="margin-bottom:24px;">
        <div style="font-size:20px;font-weight:700;line-height:1.35;margin-bottom:12px;">출퇴근 방법을 선택하세요</div>
        <div style="font-size:16px;color:#6B7280;line-height:1.55;">둘 중 하나를 꼭 골라야 하는 건 아니며, 나중에 언제든 바꿀 수 있습니다.</div>
      </div>

      <!-- Option cards (equal weight) -->
      <div style="display:flex;flex-direction:column;gap:16px;">

        <!-- Face -->
        <button style="text-align:left;width:100%;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:14px;padding:22px;cursor:pointer;display:flex;align-items:center;gap:16px;font-family:inherit;" style-hover="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.10);">
          <span style="width:52px;height:52px;flex-shrink:0;border-radius:12px;background:#EFF6FF;display:flex;align-items:center;justify-content:center;color:#2563EB;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 10h.01M15 10h.01M9.5 15a3.5 3.5 0 0 0 5 0"/></svg>
          </span>
          <span style="flex:1;min-width:0;">
            <span style="display:block;font-size:16px;font-weight:700;margin-bottom:4px;">얼굴인증 사용하기</span>
            <span style="display:block;font-size:13px;color:#6B7280;">카메라로 본인 확인</span>
          </span>
          <span style="width:20px;height:20px;flex-shrink:0;color:#9CA3AF;display:flex;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
        </button>

        <!-- GPS -->
        <button style="text-align:left;width:100%;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:14px;padding:22px;cursor:pointer;display:flex;align-items:center;gap:16px;font-family:inherit;" style-hover="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.10);">
          <span style="width:52px;height:52px;flex-shrink:0;border-radius:12px;background:#EFF6FF;display:flex;align-items:center;justify-content:center;color:#2563EB;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
          </span>
          <span style="flex:1;min-width:0;">
            <span style="display:block;font-size:16px;font-weight:700;margin-bottom:4px;">GPS만 사용하기</span>
            <span style="display:block;font-size:13px;color:#6B7280;">위치로 출퇴근 확인</span>
          </span>
          <span style="width:20px;height:20px;flex-shrink:0;color:#9CA3AF;display:flex;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
        </button>

      </div>

      <div style="flex:1;"></div>

      <!-- Reassurance footer -->
      <div style="display:flex;align-items:flex-start;gap:8px;padding:16px 0 24px;">
        <span style="width:16px;height:16px;flex-shrink:0;margin-top:1px;color:#6B7280;display:flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></span>
        <span style="font-size:13px;color:#6B7280;line-height:1.5;">선택은 강제가 아니며, [내 정보 &gt; 인증방식]에서 언제든 변경할 수 있습니다.</span>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
