<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background:#E5E7EB; }
</style>
</helmet>
<div style="min-height:100vh;background:#E5E7EB;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Pretendard,-apple-system,sans-serif;color:#111827;">

  <!-- Phone frame -->
  <div style="width:390px;height:844px;background:#F9FAFB;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(17,24,39,0.18);display:flex;flex-direction:column;position:relative;">

    <!-- Status bar -->
    <div style="height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;">
      <span>9:41</span>
      <span style="color:#6B7280;">근태관리</span>
    </div>

    <!-- Top bar -->
    <header style="height:52px;flex-shrink:0;display:flex;align-items:center;padding:0 12px;">
      <button style="width:40px;height:40px;border:none;background:transparent;color:#374151;cursor:pointer;display:flex;align-items:center;justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span style="font-size:16px;font-weight:700;margin-left:4px;">휴가 신청</span>
    </header>

    <!-- Body -->
    <div style="flex:1;overflow-y:auto;padding:8px 24px 8px;">

      <!-- Balance card -->
      <div style="background:#2563EB;border-radius:12px;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
        <div>
          <div style="font-size:13px;font-weight:700;color:rgba(255,255,255,0.8);margin-bottom:8px;">잔여 연차</div>
          <div style="font-size:28px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;line-height:1;">15.5<span style="font-size:16px;font-weight:400;margin-left:2px;">일</span></div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:13px;color:rgba(255,255,255,0.8);">총 20일 중</div>
          <div style="font-size:13px;color:rgba(255,255,255,0.8);margin-top:4px;">사용 4.5일</div>
        </div>
      </div>

      <!-- Type -->
      <label style="display:block;font-size:13px;font-weight:700;margin-bottom:10px;">휴가 종류</label>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px;">
        <sc-for list="{{ types }}" as="t" hint-placeholder-count="4">
          <button onClick="{{ t.select }}" style="height:48px;border:1px solid {{ t.border }};border-radius:10px;background:{{ t.bg }};color:{{ t.fg }};font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="border-color:#2563EB;">{{ t.label }}</button>
        </sc-for>
      </div>

      <!-- Dates -->
      <label style="display:block;font-size:13px;font-weight:700;margin-bottom:10px;">기간</label>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        <div style="flex:1;display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border:1px solid #D1D5DB;border-radius:10px;background:#fff;">
          <span style="width:18px;height:18px;color:#6B7280;display:flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
          <span style="font-size:16px;font-weight:700;">7월 8일 (화)</span>
        </div>
        <span style="color:#9CA3AF;font-size:16px;">~</span>
        <div style="flex:1;display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border:1px solid #D1D5DB;border-radius:10px;background:#fff;">
          <span style="width:18px;height:18px;color:#6B7280;display:flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
          <span style="font-size:16px;font-weight:700;">7월 9일 (수)</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;background:#EFF6FF;border-radius:10px;padding:12px 14px;margin-bottom:24px;">
        <span style="width:16px;height:16px;color:#2563EB;display:flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></span>
        <span style="font-size:13px;color:#1D4ED8;font-weight:700;">사용 연차 {{ days }}</span>
      </div>

      <!-- Reason -->
      <label style="display:block;font-size:13px;font-weight:700;margin-bottom:10px;">사유 <span style="color:#9CA3AF;font-weight:400;">(선택)</span></label>
      <textarea placeholder="예: 개인 사정으로 휴가를 신청합니다." style="width:100%;height:88px;padding:12px 14px;border:1px solid #D1D5DB;border-radius:10px;font-family:inherit;font-size:16px;color:#111827;outline:none;resize:none;line-height:1.5;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);"></textarea>

      <!-- Approver -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding:16px 18px;background:#fff;border:1px solid #E5E7EB;border-radius:12px;">
        <span style="font-size:15px;color:#6B7280;">승인자</span>
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="width:30px;height:30px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">박</span>
          <span style="font-size:15px;font-weight:700;">박팀장</span>
        </div>
      </div>

    </div>

    <!-- Footer action -->
    <div style="flex-shrink:0;border-top:1px solid #E5E7EB;background:#FFFFFF;padding:16px 24px 26px;">
      <button style="width:100%;height:52px;border:none;border-radius:10px;background:#2563EB;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#1D4ED8;">신청하기</button>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { type: '연차' };
  renderVals() {
    const sel = this.state.type;
    const defs = ['연차', '오전 반차', '오후 반차', '병가'];
    const half = sel.indexOf('반차') !== -1;
    return {
      types: defs.map(label => {
        const active = label === sel;
        return {
          label,
          select: () => this.setState({ type: label }),
          bg: active ? '#EFF6FF' : '#FFFFFF',
          fg: active ? '#1D4ED8' : '#374151',
          border: active ? '#2563EB' : '#D1D5DB',
        };
      }),
      days: half ? '0.5일' : '2일',
    };
  }
}
</script>
</body>
</html>
