<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:220px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;padding:20px 12px;">
    <div style="display:flex;align-items:center;gap:9px;padding:0 8px;margin-bottom:22px;">
      <div style="width:28px;height:28px;border-radius:7px;background:#2563EB;display:flex;align-items:center;justify-content:center;"><span style="color:#fff;font-size:15px;font-weight:700;">근</span></div>
      <span style="font-size:16px;font-weight:700;letter-spacing:-0.01em;">근태관리</span>
    </div>
    <nav style="display:flex;flex-direction:column;gap:1px;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="8">
        <a href="#" style="display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:7px;text-decoration:none;font-size:15px;font-weight:{{ m.weight }};color:{{ m.color }};background:{{ m.bg }};" style-hover="background:#F3F4F6;">
          <span style="width:17px;height:17px;display:flex;color:{{ m.iconColor }};" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          {{ m.label }}
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px;border-top:1px solid #F3F4F6;">
      <div style="width:30px;height:30px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
      <div style="min-width:0;"><div style="font-size:13px;font-weight:700;">관리자</div><div style="font-size:13px;color:#9CA3AF;">admin@skytech.co.kr</div></div>
    </div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div>
        <div style="font-size:22px;font-weight:700;line-height:1.2;">차단 IP 관리</div>
        <div style="font-size:13px;color:#6B7280;margin-top:3px;">차단할 IP·대역을 등록하면 해당 위치의 접속이 거부됩니다.</div>
      </div>
    </div>

    <!-- Add form -->
    <div style="display:flex;align-items:flex-end;gap:10px;background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:16px 18px;margin-bottom:16px;">
      <div style="flex:1;max-width:260px;">
        <label style="display:block;font-size:13px;color:#6B7280;margin-bottom:6px;">IP 또는 대역</label>
        <input value="{{ draft }}" onInput="{{ onDraft }}" placeholder="예: 45.132.88.6 또는 45.132.0.0/16" style="width:100%;height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;font-variant-numeric:tabular-nums;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
      </div>
      <div style="flex:1;max-width:200px;">
        <label style="display:block;font-size:13px;color:#6B7280;margin-bottom:6px;">사유</label>
        <input value="{{ reason }}" onInput="{{ onReason }}" placeholder="예: 해외 비인가 접속" style="width:100%;height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
      </div>
      <button onClick="{{ add }}" style="height:40px;padding:0 18px;border:none;border-radius:7px;background:#2563EB;color:#fff;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#1D4ED8;">차단 추가</button>
    </div>

    <!-- Table -->
    <section style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #E5E7EB;">
        <div style="display:flex;align-items:center;gap:9px;"><span style="font-size:15px;font-weight:700;">차단 목록</span><span style="min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#F3F4F6;color:#6B7280;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;">{{ count }}</span></div>
      </div>
      <table style="width:100%;border-collapse:collapse;">
        <thead>
          <tr style="background:#F9FAFB;border-bottom:1px solid #E5E7EB;">
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;white-space:nowrap;">IP · 대역</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;white-space:nowrap;">사유</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;white-space:nowrap;">등록</th>
            <th style="text-align:right;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;white-space:nowrap;">차단 횟수</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;white-space:nowrap;">상태</th>
            <th style="text-align:right;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;white-space:nowrap;">관리</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
            <tr style="border-bottom:1px solid #F3F4F6;">
              <td style="padding:11px 20px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;">{{ r.ip }}</td>
              <td style="padding:11px 14px;font-size:15px;color:#6B7280;white-space:nowrap;">{{ r.reason }}</td>
              <td style="padding:11px 14px;font-size:15px;color:#6B7280;white-space:nowrap;">{{ r.at }}</td>
              <td style="padding:11px 14px;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:{{ r.hitColor }};white-space:nowrap;">{{ r.hits }}</td>
              <td style="padding:11px 14px;white-space:nowrap;">
                <span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:#F3F4F6;">
                  <span style="width:6px;height:6px;border-radius:50%;background:{{ r.dot }};"></span>
                  <span style="font-size:13px;font-weight:700;color:#374151;white-space:nowrap;">{{ r.status }}</span>
                </span>
              </td>
              <td style="padding:11px 20px;text-align:right;white-space:nowrap;">
                <button onClick="{{ r.remove }}" style="height:34px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;background:#fff;color:#374151;font-family:inherit;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#F9FAFB;">해제</button>
              </td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    draft: '', reason: '',
    rows: [
      { ip:'45.132.88.6', reason:'해외 비인가 접속', at:'07-04', hits:12, status:'차단 중', dot:'#DC2626' },
      { ip:'45.132.0.0/16', reason:'악성 대역 (네덜란드)', at:'07-04', hits:47, status:'차단 중', dot:'#DC2626' },
      { ip:'103.21.55.90', reason:'반복 로그인 실패', at:'07-02', hits:8, status:'차단 중', dot:'#DC2626' },
      { ip:'58.140.77.9', reason:'관리자 검토 대기', at:'07-01', hits:1, status:'감시', dot:'#F59E0B' },
      { ip:'202.9.44.12', reason:'과거 유출 IP', at:'06-20', hits:0, status:'차단 중', dot:'#DC2626' },
    ],
  };
  renderVals() {
    const ic = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', false, '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', false, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', false, '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', false,   '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['보안로그', true,  '<path d="M12 2 4 5v6c0 5 3.5 8 8 11 4.5-3 8-6 8-11V5z"/>'],
      ['설정', false,     '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: ic(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    const rows = this.state.rows.map((r, i) => ({
      ...r,
      hitColor: r.hits > 0 ? '#B91C1C' : '#9CA3AF',
      remove: () => this.setState(s => ({ rows: s.rows.filter((_, j) => j !== i) })),
    }));
    return {
      menu, rows, count: rows.length,
      draft: this.state.draft, reason: this.state.reason,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onReason: (e) => this.setState({ reason: e.target.value }),
      add: () => {
        const ip = this.state.draft.trim(); if (!ip) return;
        this.setState(s => ({
          rows: [{ ip, reason: s.reason.trim() || '수동 등록', at: '07-05', hits: 0, status: '차단 중', dot: '#DC2626' }, ...s.rows],
          draft: '', reason: '',
        }));
      },
    };
  }
}
</script>
</body>
</html>
