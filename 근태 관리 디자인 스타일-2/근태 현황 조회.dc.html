<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:220px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;padding:20px 12px;">
    <div style="display:flex;align-items:center;gap:9px;padding:0 8px;margin-bottom:22px;">
      <div style="width:28px;height:28px;border-radius:7px;background:#2563EB;display:flex;align-items:center;justify-content:center;"><span style="color:#fff;font-size:15px;font-weight:700;">근</span></div>
      <span style="font-size:16px;font-weight:700;letter-spacing:-0.01em;">근태관리</span>
    </div>
    <nav style="display:flex;flex-direction:column;gap:1px;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="7">
        <a href="#" style="display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:7px;text-decoration:none;font-size:15px;font-weight:{{ m.weight }};color:{{ m.color }};background:{{ m.bg }};" style-hover="background:#F3F4F6;">
          <span style="width:17px;height:17px;display:flex;color:{{ m.iconColor }};" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          {{ m.label }}
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px;border-top:1px solid #F3F4F6;">
      <div style="width:30px;height:30px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
      <div style="min-width:0;"><div style="font-size:13px;font-weight:700;">관리자</div><div style="font-size:13px;color:#9CA3AF;">admin@skytech.co.kr</div></div>
    </div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="margin-bottom:18px;">
      <div style="font-size:22px;font-weight:700;line-height:1.2;">근태 현황 조회</div>
      <div style="font-size:13px;color:#6B7280;margin-top:3px;">기간과 부서를 지정해 조회하세요.</div>
    </div>

    <!-- Filter -->
    <div style="display:flex;align-items:flex-end;gap:12px;background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:16px 18px;margin-bottom:16px;">
      <div>
        <label style="display:block;font-size:13px;color:#6B7280;margin-bottom:6px;">기간</label>
        <div style="display:flex;align-items:center;gap:8px;">
          <input value="2026-07-01" style="height:40px;width:150px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;font-variant-numeric:tabular-nums;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
          <span style="color:#9CA3AF;">~</span>
          <input value="2026-07-04" style="height:40px;width:150px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;font-variant-numeric:tabular-nums;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
        </div>
      </div>
      <div>
        <label style="display:block;font-size:13px;color:#6B7280;margin-bottom:6px;">부서</label>
        <select style="height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;outline:none;background:#fff;min-width:140px;"><option>전체 부서</option><option>개발팀</option><option>영업팀</option><option>디자인팀</option></select>
      </div>
      <button style="height:40px;padding:0 22px;border:none;border-radius:7px;background:#2563EB;color:#fff;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;flex-shrink:0;cursor:pointer;" style-hover="background:#1D4ED8;">조회</button>
      <div style="flex:1;"></div>
      <button style="height:40px;padding:0 16px;border:1px solid #D1D5DB;border-radius:7px;background:#fff;color:#374151;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;flex-shrink:0;cursor:pointer;" style-hover="background:#F9FAFB;">내보내기</button>
    </div>

    <!-- Result summary -->
    <div style="font-size:13px;color:#6B7280;margin-bottom:10px;">2026-07-01 ~ 07-04 · 전체 부서 · <strong style="color:#111827;">총 24건</strong> · 행을 클릭하면 직원별 상세로 이동합니다.</div>

    <!-- Table -->
    <section style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;">
      <table style="width:100%;border-collapse:collapse;">
        <thead>
          <tr style="background:#F9FAFB;border-bottom:1px solid #E5E7EB;">
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;">이름</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">부서</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">날짜</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">출근</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">퇴근</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">실근무</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">상태</th>
            <th style="width:36px;padding:10px 20px 10px 0;"></th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="9">
            <tr style="border-bottom:1px solid #F3F4F6;cursor:pointer;" style-hover="background:#F9FAFB;">
              <td style="padding:11px 20px;font-size:15px;font-weight:700;">{{ r.name }}</td>
              <td style="padding:11px 14px;font-size:15px;color:#6B7280;">{{ r.dept }}</td>
              <td style="padding:11px 14px;font-size:15px;color:#6B7280;font-variant-numeric:tabular-nums;">{{ r.date }}</td>
              <td style="padding:11px 14px;font-size:15px;font-variant-numeric:tabular-nums;color:{{ r.inColor }};">{{ r.in }}</td>
              <td style="padding:11px 14px;font-size:15px;font-variant-numeric:tabular-nums;color:#6B7280;">{{ r.out }}</td>
              <td style="padding:11px 14px;font-size:15px;font-variant-numeric:tabular-nums;font-weight:700;">{{ r.hours }}</td>
              <td style="padding:11px 14px;">
                <span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:#F3F4F6;">
                  <span style="width:6px;height:6px;border-radius:50%;background:{{ r.dot }};"></span>
                  <span style="font-size:13px;font-weight:700;color:#374151;">{{ r.status }}</span>
                </span>
              </td>
              <td style="padding:11px 20px 11px 0;text-align:right;color:#C7CDD4;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ic = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', false, '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', true,  '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', false, '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', false,   '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['설정', false,     '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: ic(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    const rows = [
      { name:'홍길동', dept:'영업팀', date:'07-04', in:'09:02', out:'18:05', hours:'8:48', status:'정상', dot:'#16A34A' },
      { name:'김민준', dept:'개발팀', date:'07-04', in:'09:20', out:'—', hours:'근무중', status:'근무중', dot:'#2563EB', inColor:'#B45309' },
      { name:'이서윤', dept:'디자인팀', date:'07-04', in:'08:47', out:'18:02', hours:'8:45', status:'정상', dot:'#16A34A' },
      { name:'박도현', dept:'경영지원팀', date:'07-04', in:'08:58', out:'—', hours:'근무중', status:'근무중', dot:'#2563EB' },
      { name:'최유진', dept:'영업팀', date:'07-04', in:'09:05', out:'18:00', hours:'8:25', status:'지각', dot:'#F59E0B', inColor:'#B45309' },
      { name:'정우성', dept:'개발팀', date:'07-04', in:'—', out:'—', hours:'—', status:'결근', dot:'#DC2626' },
      { name:'홍길동', dept:'영업팀', date:'07-03', in:'08:55', out:'18:10', hours:'8:52', status:'정상', dot:'#16A34A' },
      { name:'김민준', dept:'개발팀', date:'07-03', in:'연차', out:'—', hours:'—', status:'연차', dot:'#2563EB', inColor:'#1D4ED8' },
      { name:'이서윤', dept:'디자인팀', date:'07-03', in:'08:49', out:'18:20', hours:'9:01', status:'정상', dot:'#16A34A' },
    ].map(r => ({ ...r, inColor: r.inColor || '#111827' }));
    return { menu, rows };
  }
}
</script>
</body>
</html>
