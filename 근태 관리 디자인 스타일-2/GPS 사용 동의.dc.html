<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background:#E5E7EB; }
</style>
</helmet>
<div style="min-height:100vh;background:#E5E7EB;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Pretendard,-apple-system,sans-serif;color:#111827;">

  <!-- Phone frame -->
  <div style="width:390px;height:844px;background:#F9FAFB;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(17,24,39,0.18);display:flex;flex-direction:column;position:relative;">

    <!-- Status bar -->
    <div style="height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;">
      <span>9:41</span>
      <span style="color:#6B7280;">근태관리</span>
    </div>

    <!-- Top bar -->
    <header style="height:52px;flex-shrink:0;display:flex;align-items:center;padding:0 12px;">
      <button style="width:40px;height:40px;border:none;background:transparent;color:#374151;cursor:pointer;display:flex;align-items:center;justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </header>

    <!-- Body -->
    <div style="flex:1;display:flex;flex-direction:column;padding:8px 24px 30px;">

      <!-- Illustration: radius icon -->
      <div style="display:flex;justify-content:center;margin:20px 0 28px;">
        <div style="position:relative;width:180px;height:180px;display:flex;align-items:center;justify-content:center;">
          <div style="position:absolute;inset:0;border-radius:50%;background:#EFF6FF;"></div>
          <div style="position:absolute;inset:36px;border-radius:50%;border:2px dashed #93C5FD;"></div>
          <span style="position:relative;color:#2563EB;"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
        </div>
      </div>

      <!-- Heading -->
      <div style="text-align:center;margin-bottom:24px;">
        <div style="font-size:20px;font-weight:700;margin-bottom:12px;">위치(GPS) 이용 동의</div>
        <div style="font-size:16px;color:#374151;line-height:1.6;">사업장 반경 이내인지만 확인하며,<br/>이동경로는 추적하지 않습니다.</div>
      </div>

      <!-- Reassurance boxes -->
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;align-items:flex-start;gap:12px;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:16px 18px;">
          <span style="width:22px;height:22px;flex-shrink:0;margin-top:1px;color:#16A34A;display:flex;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></span>
          <div>
            <div style="font-size:16px;font-weight:700;margin-bottom:3px;">출퇴근 순간에만 확인</div>
            <div style="font-size:13px;color:#6B7280;line-height:1.5;">출근·퇴근 버튼을 누른 그 순간의 위치만 사용합니다.</div>
          </div>
        </div>
        <div style="display:flex;align-items:flex-start;gap:12px;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:16px 18px;">
          <span style="width:22px;height:22px;flex-shrink:0;margin-top:1px;color:#16A34A;display:flex;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></span>
          <div>
            <div style="font-size:16px;font-weight:700;margin-bottom:3px;">경로 추적 없음</div>
            <div style="font-size:13px;color:#6B7280;line-height:1.5;">근무 중 이동경로나 상시 위치는 수집하지 않습니다.</div>
          </div>
        </div>
      </div>

      <div style="flex:1;"></div>

      <!-- Action -->
      <button style="width:100%;height:52px;border:none;border-radius:10px;background:#2563EB;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:12px;" style-hover="background:#1D4ED8;">위치 권한 허용하기</button>
      <div style="text-align:center;font-size:13px;color:#9CA3AF;line-height:1.5;">권한은 휴대폰 설정에서 언제든 해제할 수 있습니다.</div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
