<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:220px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;padding:20px 12px;">
    <div style="display:flex;align-items:center;gap:9px;padding:0 8px;margin-bottom:22px;">
      <div style="width:28px;height:28px;border-radius:7px;background:#2563EB;display:flex;align-items:center;justify-content:center;"><span style="color:#fff;font-size:15px;font-weight:700;">근</span></div>
      <span style="font-size:16px;font-weight:700;letter-spacing:-0.01em;">근태관리</span>
    </div>
    <nav style="display:flex;flex-direction:column;gap:1px;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="7">
        <a href="#" style="display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:7px;text-decoration:none;font-size:15px;font-weight:{{ m.weight }};color:{{ m.color }};background:{{ m.bg }};" style-hover="background:#F3F4F6;">
          <span style="width:17px;height:17px;display:flex;color:{{ m.iconColor }};" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          {{ m.label }}
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px;border-top:1px solid #F3F4F6;">
      <div style="width:30px;height:30px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
      <div style="min-width:0;"><div style="font-size:13px;font-weight:700;">관리자</div><div style="font-size:13px;color:#9CA3AF;">admin@skytech.co.kr</div></div>
    </div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
      <div>
        <div style="font-size:22px;font-weight:700;line-height:1.2;">리포트</div>
        <div style="font-size:13px;color:#6B7280;margin-top:3px;">2026년 6월 · 근무 통계 요약</div>
      </div>
      <div style="display:flex;gap:10px;">
        <select style="height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;color:#111827;outline:none;background:#fff;"><option>2026년 6월</option><option>2026년 5월</option></select>
        <button style="height:40px;padding:0 16px;border:none;border-radius:7px;background:#2563EB;color:#fff;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#1D4ED8;">PDF 내보내기</button>
      </div>
    </div>

    <!-- KPIs -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;">
      <sc-for list="{{ kpis }}" as="k" hint-placeholder-count="4">
        <div style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;padding:16px 18px;">
          <div style="font-size:13px;color:#6B7280;font-weight:700;margin-bottom:10px;">{{ k.label }}</div>
          <div style="font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;">{{ k.value }}</div>
          <div style="font-size:13px;font-weight:700;color:{{ k.deltaColor }};margin-top:5px;">{{ k.delta }}</div>
        </div>
      </sc-for>
    </div>

    <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:12px;">
      <!-- Bar chart -->
      <section style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;padding:20px 22px;">
        <div style="font-size:16px;font-weight:700;margin-bottom:2px;">주별 평균 실근무시간</div>
        <div style="font-size:13px;color:#6B7280;margin-bottom:24px;">기준 근무 40시간/주</div>
        <div style="display:flex;align-items:flex-end;gap:18px;height:184px;padding-bottom:24px;border-bottom:1px solid #F3F4F6;position:relative;">
          <div style="position:absolute;left:0;right:0;bottom:52px;border-top:1px dashed #E5E7EB;"></div>
          <sc-for list="{{ bars }}" as="b" hint-placeholder-count="4">
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">
              <div style="font-size:13px;font-weight:700;color:#374151;margin-bottom:8px;">{{ b.value }}</div>
              <div style="width:100%;max-width:48px;height:{{ b.h }};background:{{ b.color }};border-radius:6px 6px 0 0;"></div>
            </div>
          </sc-for>
        </div>
        <div style="display:flex;gap:18px;margin-top:12px;">
          <sc-for list="{{ bars }}" as="b" hint-placeholder-count="4">
            <div style="flex:1;text-align:center;font-size:13px;color:#6B7280;">{{ b.label }}</div>
          </sc-for>
        </div>
      </section>

      <!-- Department -->
      <section style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;padding:20px 22px;">
        <div style="font-size:16px;font-weight:700;margin-bottom:18px;">부서별 지표</div>
        <div style="display:flex;flex-direction:column;gap:16px;">
          <sc-for list="{{ depts }}" as="d" hint-placeholder-count="4">
            <div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;">
                <span style="font-size:15px;font-weight:700;">{{ d.name }}</span>
                <span style="font-size:13px;color:#6B7280;font-variant-numeric:tabular-nums;">평균 {{ d.avg }}</span>
              </div>
              <div style="height:7px;border-radius:5px;background:#F3F4F6;overflow:hidden;"><div style="height:100%;width:{{ d.pct }};background:#2563EB;border-radius:5px;"></div></div>
            </div>
          </sc-for>
        </div>
        <div style="height:1px;background:#F3F4F6;margin:20px 0;"></div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div style="display:flex;align-items:center;justify-content:space-between;"><span style="font-size:15px;color:#6B7280;">초과근무 총합</span><span style="font-size:15px;font-weight:700;">42.5시간</span></div>
          <div style="display:flex;align-items:center;justify-content:space-between;"><span style="font-size:15px;color:#6B7280;">지각 건수</span><span style="font-size:15px;font-weight:700;color:#B45309;">18건</span></div>
          <div style="display:flex;align-items:center;justify-content:space-between;"><span style="font-size:15px;color:#6B7280;">연차 사용</span><span style="font-size:15px;font-weight:700;">36일</span></div>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ic = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', false, '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', false, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', false, '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', true,    '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['설정', false,     '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: ic(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    return {
      menu,
      kpis: [
        { label: '평균 실근무', value: '41.2h', delta: '▲ 0.6h', deltaColor: '#15803D' },
        { label: '정시 출근율', value: '94%',   delta: '▲ 2%p',  deltaColor: '#15803D' },
        { label: '초과근무',    value: '42.5h', delta: '▼ 5.1h', deltaColor: '#15803D' },
        { label: '결근',        value: '3건',   delta: '▲ 1건',  deltaColor: '#B45309' },
      ],
      bars: [
        { label: '1주', value: '40.1h', h: '58%', color: '#BFDBFE' },
        { label: '2주', value: '42.3h', h: '74%', color: '#93C5FD' },
        { label: '3주', value: '41.0h', h: '65%', color: '#60A5FA' },
        { label: '4주', value: '41.5h', h: '69%', color: '#2563EB' },
      ],
      depts: [
        { name: '개발팀',     avg: '43.1h', pct: '92%' },
        { name: '영업팀',     avg: '40.2h', pct: '78%' },
        { name: '디자인팀',   avg: '39.8h', pct: '72%' },
        { name: '경영지원팀', avg: '38.5h', pct: '64%' },
      ],
    };
  }
}
</script>
</body>
</html>
