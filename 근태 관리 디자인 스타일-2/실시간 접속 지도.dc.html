<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  @keyframes ping { 0% { transform: scale(0.9); opacity: 0.6; } 70% { transform: scale(2.4); opacity: 0; } 100% { opacity: 0; } }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:220px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;padding:20px 12px;">
    <div style="display:flex;align-items:center;gap:9px;padding:0 8px;margin-bottom:22px;">
      <div style="width:28px;height:28px;border-radius:7px;background:#2563EB;display:flex;align-items:center;justify-content:center;"><span style="color:#fff;font-size:15px;font-weight:700;">근</span></div>
      <span style="font-size:16px;font-weight:700;letter-spacing:-0.01em;">근태관리</span>
    </div>
    <nav style="display:flex;flex-direction:column;gap:1px;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="8">
        <a href="#" style="display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:7px;text-decoration:none;font-size:15px;font-weight:{{ m.weight }};color:{{ m.color }};background:{{ m.bg }};" style-hover="background:#F3F4F6;">
          <span style="width:17px;height:17px;display:flex;color:{{ m.iconColor }};" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          {{ m.label }}
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px;border-top:1px solid #F3F4F6;">
      <div style="width:30px;height:30px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
      <div style="min-width:0;"><div style="font-size:13px;font-weight:700;">관리자</div><div style="font-size:13px;color:#9CA3AF;">admin@skytech.co.kr</div></div>
    </div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div>
        <div style="display:flex;align-items:center;gap:9px;">
          <div style="font-size:22px;font-weight:700;line-height:1.2;">실시간 접속 지도</div>
          <span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:#F3F4F6;"><span style="width:6px;height:6px;border-radius:50%;background:#16A34A;"></span><span style="font-size:13px;font-weight:700;color:#374151;">LIVE</span></span>
        </div>
        <div style="font-size:13px;color:#6B7280;margin-top:3px;">최근 10분 접속 위치 · 자동 갱신</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 280px;gap:12px;align-items:start;">
      <!-- Map -->
      <section style="background:#0F172A;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;position:relative;height:460px;">
        <!-- grid -->
        <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(148,163,184,0.10) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,0.10) 1px,transparent 1px);background-size:40px 40px;"></div>
        <div style="position:absolute;top:14px;left:16px;font-size:13px;font-weight:700;color:rgba(255,255,255,0.5);">세계 접속 분포</div>
        <!-- points -->
        <sc-for list="{{ points }}" as="p" hint-placeholder-count="5">
          <div style="position:absolute;left:{{ p.x }};top:{{ p.y }};transform:translate(-50%,-50%);">
            <sc-if value="{{ p.pulse }}" hint-placeholder-val="{{ false }}">
              <span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:{{ p.color }};animation:ping 1.8s ease-out infinite;"></span>
            </sc-if>
            <span style="position:relative;display:block;width:{{ p.size }};height:{{ p.size }};border-radius:50%;background:{{ p.color }};border:2px solid rgba(255,255,255,0.85);box-shadow:0 0 12px {{ p.glow }};"></span>
            <span style="position:absolute;top:calc(50% + {{ p.size }});left:50%;transform:translateX(-50%);margin-top:4px;font-size:13px;font-weight:700;color:rgba(255,255,255,0.85);white-space:nowrap;">{{ p.label }}</span>
          </div>
        </sc-for>
        <!-- legend -->
        <div style="position:absolute;bottom:14px;left:16px;display:flex;gap:14px;">
          <div style="display:flex;align-items:center;gap:6px;"><span style="width:9px;height:9px;border-radius:50%;background:#22C55E;"></span><span style="font-size:13px;color:rgba(255,255,255,0.7);">정상</span></div>
          <div style="display:flex;align-items:center;gap:6px;"><span style="width:9px;height:9px;border-radius:50%;background:#F59E0B;"></span><span style="font-size:13px;color:rgba(255,255,255,0.7);">주의</span></div>
          <div style="display:flex;align-items:center;gap:6px;"><span style="width:9px;height:9px;border-radius:50%;background:#EF4444;"></span><span style="font-size:13px;color:rgba(255,255,255,0.7);">차단</span></div>
        </div>
      </section>

      <!-- Side list -->
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div style="background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:14px 16px;"><div style="font-size:13px;color:#6B7280;margin-bottom:6px;">접속 중</div><div style="font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;">17</div></div>
          <div style="background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:14px 16px;"><div style="font-size:13px;color:#6B7280;margin-bottom:6px;">해외</div><div style="font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:#B45309;">2</div></div>
        </div>
        <section style="background:#fff;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;">
          <div style="padding:12px 16px;border-bottom:1px solid #E5E7EB;font-size:15px;font-weight:700;">지역별 접속</div>
          <sc-for list="{{ regions }}" as="r" hint-placeholder-count="5">
            <div style="display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid #F3F4F6;">
              <span style="width:8px;height:8px;border-radius:50%;background:{{ r.color }};flex-shrink:0;"></span>
              <div style="flex:1;min-width:0;"><div style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ r.name }}</div><div style="font-size:13px;color:#9CA3AF;">{{ r.sub }}</div></div>
              <span style="font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:{{ r.countColor }};">{{ r.count }}</span>
            </div>
          </sc-for>
        </section>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ic = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', false, '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', false, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', false, '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', false,   '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['보안로그', true,  '<path d="M12 2 4 5v6c0 5 3.5 8 8 11 4.5-3 8-6 8-11V5z"/>'],
      ['설정', false,     '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: ic(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    return {
      menu,
      points: [
        { x:'72%', y:'46%', size:'16px', color:'#22C55E', glow:'rgba(34,197,94,0.6)', label:'서울 14', pulse:true },
        { x:'68%', y:'52%', size:'11px', color:'#22C55E', glow:'rgba(34,197,94,0.5)', label:'부산 1', pulse:false },
        { x:'78%', y:'42%', size:'10px', color:'#F59E0B', glow:'rgba(245,158,11,0.5)', label:'도쿄 1', pulse:false },
        { x:'50%', y:'34%', size:'12px', color:'#EF4444', glow:'rgba(239,68,68,0.7)', label:'암스테르담 1', pulse:true },
        { x:'20%', y:'40%', size:'9px', color:'#F59E0B', glow:'rgba(245,158,11,0.5)', label:'뉴욕', pulse:false },
      ],
      regions: [
        { color:'#22C55E', name:'서울 · 본사', sub:'사내망 · 정상', count:'14', countColor:'#111827' },
        { color:'#22C55E', name:'부산', sub:'GPS · 정상', count:'1', countColor:'#111827' },
        { color:'#F59E0B', name:'도쿄, 일본', sub:'출장 등록 확인 필요', count:'1', countColor:'#B45309' },
        { color:'#EF4444', name:'암스테르담, NL', sub:'차단됨 · 비인가', count:'1', countColor:'#B91C1C' },
        { color:'#F59E0B', name:'뉴욕, US', sub:'로그인 실패', count:'0', countColor:'#9CA3AF' },
      ],
    };
  }
}
</script>
</body>
</html>
