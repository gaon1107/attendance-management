<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:220px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;padding:20px 12px;">
    <div style="display:flex;align-items:center;gap:9px;padding:0 8px;margin-bottom:22px;">
      <div style="width:28px;height:28px;border-radius:7px;background:#2563EB;display:flex;align-items:center;justify-content:center;"><span style="color:#fff;font-size:15px;font-weight:700;">근</span></div>
      <span style="font-size:16px;font-weight:700;letter-spacing:-0.01em;">근태관리</span>
    </div>
    <nav style="display:flex;flex-direction:column;gap:1px;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="7">
        <a href="#" style="display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:7px;text-decoration:none;font-size:15px;font-weight:{{ m.weight }};color:{{ m.color }};background:{{ m.bg }};" style-hover="background:#F3F4F6;">
          <span style="width:17px;height:17px;display:flex;color:{{ m.iconColor }};" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          {{ m.label }}
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px;border-top:1px solid #F3F4F6;">
      <div style="width:30px;height:30px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
      <div style="min-width:0;"><div style="font-size:13px;font-weight:700;">관리자</div><div style="font-size:13px;color:#9CA3AF;">admin@skytech.co.kr</div></div>
    </div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
      <div>
        <div style="font-size:22px;font-weight:700;line-height:1.2;">근태현황</div>
        <div style="font-size:13px;color:#6B7280;margin-top:3px;">2026년 7월 · 개인별 출퇴근 기록</div>
      </div>
      <button style="height:40px;padding:0 16px;border:1px solid #D1D5DB;border-radius:7px;background:#fff;color:#374151;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#F9FAFB;">내보내기</button>
    </div>

    <!-- Filter bar -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <div style="display:flex;align-items:center;background:#fff;border:1px solid #D1D5DB;border-radius:7px;height:40px;overflow:hidden;">
        <button style="width:40px;height:40px;border:none;background:transparent;color:#6B7280;cursor:pointer;display:flex;align-items:center;justify-content:center;" style-hover="background:#F3F4F6;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <span style="padding:0 8px;font-size:15px;font-weight:700;min-width:110px;text-align:center;">2026년 7월</span>
        <button style="width:40px;height:40px;border:none;background:transparent;color:#6B7280;cursor:pointer;display:flex;align-items:center;justify-content:center;" style-hover="background:#F3F4F6;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
      <select style="height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;color:#111827;outline:none;background:#fff;"><option>전체 부서</option><option>개발팀</option><option>영업팀</option></select>
      <select style="height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;color:#111827;outline:none;background:#fff;"><option>전체 상태</option><option>정상</option><option>지각</option><option>결근</option></select>
      <div style="position:relative;flex:1;max-width:260px;">
        <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#9CA3AF;display:flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
        <input placeholder="이름 검색" style="width:100%;height:40px;padding:0 12px 0 36px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
      </div>
    </div>

    <!-- Table -->
    <section style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;">
      <table style="width:100%;border-collapse:collapse;">
        <thead>
          <tr style="background:#F9FAFB;border-bottom:1px solid #E5E7EB;">
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;">이름</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">날짜</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">출근</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">퇴근</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">실근무</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">인증</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;">상태</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
            <tr style="border-bottom:1px solid #F3F4F6;">
              <td style="padding:11px 20px;font-size:15px;font-weight:700;">{{ r.name }}</td>
              <td style="padding:11px 14px;font-size:15px;color:#6B7280;font-variant-numeric:tabular-nums;">{{ r.date }}</td>
              <td style="padding:11px 14px;font-size:15px;font-variant-numeric:tabular-nums;color:{{ r.inColor }};">{{ r.in }}</td>
              <td style="padding:11px 14px;font-size:15px;font-variant-numeric:tabular-nums;color:#6B7280;">{{ r.out }}</td>
              <td style="padding:11px 14px;font-size:15px;font-variant-numeric:tabular-nums;font-weight:700;">{{ r.hours }}</td>
              <td style="padding:11px 14px;font-size:13px;color:#6B7280;">{{ r.auth }}</td>
              <td style="padding:11px 20px;">
                <span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:#F3F4F6;">
                  <span style="width:6px;height:6px;border-radius:50%;background:{{ r.dot }};"></span>
                  <span style="font-size:13px;font-weight:700;color:#374151;">{{ r.status }}</span>
                </span>
              </td>
            </tr>
          </sc-for>
        </tbody>
      </table>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid #F3F4F6;">
        <span style="font-size:13px;color:#6B7280;">총 128건 중 1–8</span>
        <div style="display:flex;gap:6px;">
          <sc-for list="{{ pages }}" as="p" hint-placeholder-count="4">
            <button style="min-width:32px;height:32px;padding:0 9px;border:1px solid {{ p.border }};border-radius:7px;background:{{ p.bg }};color:{{ p.fg }};font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;">{{ p.label }}</button>
          </sc-for>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ic = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', false, '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', true,  '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', false, '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', false,   '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['설정', false,     '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: ic(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    const B = {
      ok:   { status: '정상', dot: '#16A34A' },
      late: { status: '지각', dot: '#F59E0B' },
      off:  { status: '연차', dot: '#2563EB' },
      absent:{status: '결근', dot: '#DC2626' },
    };
    const rows = [
      { name:'김민준', date:'07-04', in:'08:52', out:'18:10', hours:'8:48', auth:'얼굴', ...B.ok },
      { name:'김민준', date:'07-03', in:'09:20', out:'18:05', hours:'8:15', auth:'얼굴', ...B.late, inColor:'#B45309' },
      { name:'이서윤', date:'07-04', in:'08:47', out:'18:02', hours:'8:45', auth:'GPS',  ...B.ok },
      { name:'이서윤', date:'07-03', in:'—',     out:'—',     hours:'—',    auth:'—',    ...B.off },
      { name:'박도현', date:'07-04', in:'08:58', out:'19:30', hours:'9:52', auth:'얼굴', ...B.ok },
      { name:'최유진', date:'07-04', in:'09:05', out:'18:00', hours:'8:25', auth:'GPS',  ...B.late, inColor:'#B45309' },
      { name:'정우성', date:'07-04', in:'—',     out:'—',     hours:'—',    auth:'—',    ...B.absent },
      { name:'한도윤', date:'07-04', in:'08:49', out:'18:08', hours:'8:49', auth:'얼굴', ...B.ok },
    ].map(r => ({ ...r, inColor: r.inColor || '#111827' }));
    const pages = [['1',true],['2',false],['3',false],['›',false]].map(([label,a]) => ({
      label, bg: a?'#2563EB':'#fff', fg: a?'#fff':'#374151', border: a?'#2563EB':'#D1D5DB',
    }));
    return { menu, rows, pages };
  }
}
</script>
</body>
</html>
