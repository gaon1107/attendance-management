<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background:#E5E7EB; }
</style>
</helmet>
<div style="min-height:100vh;background:#E5E7EB;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Pretendard,-apple-system,sans-serif;color:#111827;">

  <div style="width:390px;height:844px;background:#F9FAFB;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(17,24,39,0.18);display:flex;flex-direction:column;position:relative;">

    <div style="height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;"><span>9:41</span><span style="color:#6B7280;">근태관리</span></div>

    <header style="height:52px;flex-shrink:0;display:flex;align-items:center;padding:0 12px;">
      <button style="width:40px;height:40px;border:none;background:transparent;color:#374151;cursor:pointer;display:flex;align-items:center;justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span style="font-size:16px;font-weight:700;margin-left:4px;">출장 신청</span>
    </header>

    <div style="flex:1;overflow-y:auto;padding:8px 24px 8px;">

      <!-- Type -->
      <label style="display:block;font-size:13px;font-weight:700;margin-bottom:10px;">출장 구분</label>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px;">
        <sc-for list="{{ types }}" as="t" hint-placeholder-count="3">
          <button onClick="{{ t.select }}" style="height:44px;border:1px solid {{ t.border }};border-radius:9px;background:{{ t.bg }};color:{{ t.fg }};font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;" style-hover="border-color:#2563EB;">{{ t.label }}</button>
        </sc-for>
      </div>

      <!-- Destination -->
      <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">출장지</label>
      <div style="position:relative;margin-bottom:20px;">
        <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#9CA3AF;display:flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
        <input value="부산 해운대 · 고객사 미팅" style="width:100%;height:48px;padding:0 14px 0 42px;border:1px solid #D1D5DB;border-radius:9px;font-family:inherit;font-size:15px;color:#111827;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
      </div>

      <!-- Period -->
      <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">기간</label>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        <div style="flex:1;display:flex;align-items:center;gap:9px;height:48px;padding:0 14px;border:1px solid #D1D5DB;border-radius:9px;background:#fff;">
          <span style="width:17px;height:17px;color:#6B7280;display:flex;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
          <span style="font-size:15px;font-weight:700;">7월 10일 (목)</span>
        </div>
        <span style="color:#9CA3AF;">~</span>
        <div style="flex:1;display:flex;align-items:center;gap:9px;height:48px;padding:0 14px;border:1px solid #D1D5DB;border-radius:9px;background:#fff;">
          <span style="width:17px;height:17px;color:#6B7280;display:flex;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
          <span style="font-size:15px;font-weight:700;">7월 11일 (금)</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;background:#EFF6FF;border-radius:9px;padding:11px 14px;margin-bottom:20px;">
        <span style="width:16px;height:16px;color:#2563EB;display:flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></span>
        <span style="font-size:13px;color:#1D4ED8;font-weight:700;">출장 기간 1박 2일 · 이 기간은 근무로 인정됩니다</span>
      </div>

      <!-- Transport + cost -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;">
        <div>
          <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">이동수단</label>
          <select style="width:100%;height:48px;padding:0 12px;border:1px solid #D1D5DB;border-radius:9px;font-family:inherit;font-size:15px;color:#111827;outline:none;background:#fff;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);"><option>KTX</option><option>자가용</option><option>항공</option><option>버스</option></select>
        </div>
        <div>
          <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">예상 경비</label>
          <input value="180,000원" style="width:100%;height:48px;padding:0 14px;border:1px solid #D1D5DB;border-radius:9px;font-family:inherit;font-size:15px;color:#111827;outline:none;font-variant-numeric:tabular-nums;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
        </div>
      </div>

      <!-- Reason -->
      <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">출장 목적</label>
      <textarea placeholder="예: 고객사 정기 미팅 및 계약 논의" style="width:100%;height:80px;padding:12px 14px;border:1px solid #D1D5DB;border-radius:9px;font-family:inherit;font-size:15px;color:#111827;outline:none;resize:none;line-height:1.5;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);"></textarea>

      <!-- Approval line -->
      <div style="margin-top:20px;padding:14px 16px;background:#fff;border:1px solid #E5E7EB;border-radius:10px;">
        <div style="font-size:13px;color:#6B7280;font-weight:700;margin-bottom:10px;">결재선</div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <sc-for list="{{ approvers }}" as="a" hint-placeholder-count="3">
            <span style="display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 6px;background:#F3F4F6;border-radius:15px;">
              <span style="width:20px;height:20px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">{{ a.initial }}</span>
              <span style="font-size:13px;font-weight:700;">{{ a.name }}</span>
            </span>
            <sc-if value="{{ a.arrow }}" hint-placeholder-val="{{ true }}"><span style="color:#C7CDD4;display:flex;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span></sc-if>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="flex-shrink:0;border-top:1px solid #E5E7EB;background:#FFFFFF;padding:16px 24px 26px;">
      <button style="width:100%;height:52px;border:none;border-radius:10px;background:#2563EB;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#1D4ED8;">출장 신청하기</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { type: '국내' };
  renderVals() {
    const sel = this.state.type;
    return {
      types: ['국내','해외','당일'].map(label => {
        const a = label === sel;
        return { label, select: () => this.setState({ type: label }),
          bg: a?'#EFF6FF':'#fff', fg: a?'#1D4ED8':'#374151', border: a?'#2563EB':'#D1D5DB' };
      }),
      approvers: [
        { initial:'정', name:'정팀장', arrow:true },
        { initial:'강', name:'강본부장', arrow:true },
        { initial:'문', name:'문대표', arrow:false },
      ],
    };
  }
}
</script>
</body>
</html>
