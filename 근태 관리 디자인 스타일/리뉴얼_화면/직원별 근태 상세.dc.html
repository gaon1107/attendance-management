<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:76px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 0;">
    <div style="width:36px;height:36px;border-radius:9px;background:#2563EB;display:flex;align-items:center;justify-content:center;margin-bottom:22px;"><span style="color:#fff;font-size:17px;font-weight:700;">근</span></div>
    <nav style="display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="7">
        <a href="#" style="position:relative;width:56px;height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;background:{{ m.bg }};color:{{ m.color }};" style-hover="background:#F3F4F6;">
          <span style="width:19px;height:19px;display:flex;" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          <span style="font-size:11px;font-weight:700;">{{ m.label }}</span>
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;width:32px;height:32px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="display:flex;align-items:center;gap:7px;font-size:13px;color:#6B7280;margin-bottom:14px;">
      <a href="#" style="color:#6B7280;text-decoration:none;font-weight:700;">근태 현황</a><span>›</span><span style="color:#111827;font-weight:700;">홍길동</span>
    </div>

    <!-- Employee header -->
    <div style="background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:18px 22px;display:flex;align-items:center;gap:16px;margin-bottom:16px;">
      <div style="width:48px;height:48px;flex-shrink:0;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#374151;">홍</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:18px;font-weight:700;">홍길동 <span style="font-size:13px;font-weight:400;color:#6B7280;">영업팀 · 대리 · EMP-1024</span></div>
        <div style="font-size:13px;color:#6B7280;margin-top:2px;">2026년 7월 · 실근무 86:20 · 지각 1 · 결근 0</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
        <div style="display:flex;align-items:center;background:#fff;border:1px solid #D1D5DB;border-radius:7px;height:40px;overflow:hidden;">
          <button style="width:40px;height:40px;border:none;background:transparent;color:#6B7280;cursor:pointer;display:flex;align-items:center;justify-content:center;" style-hover="background:#F3F4F6;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <span style="padding:0 6px;font-size:15px;font-weight:700;min-width:96px;text-align:center;">2026년 7월</span>
          <button style="width:40px;height:40px;border:none;background:transparent;color:#6B7280;cursor:pointer;display:flex;align-items:center;justify-content:center;" style-hover="background:#F3F4F6;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <button style="height:40px;padding:0 16px;border:1px solid #D1D5DB;border-radius:7px;background:#fff;color:#374151;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;" style-hover="background:#F9FAFB;">내보내기</button>
      </div>
    </div>

    <!-- Table -->
    <section style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;">
      <table style="width:100%;border-collapse:collapse;">
        <thead>
          <tr style="background:#F9FAFB;border-bottom:1px solid #E5E7EB;">
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;">날짜</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">출근</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">퇴근</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">자리비움</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">외출 (사유)</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">실근무</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;">상태</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
            <tr style="border-bottom:1px solid #F3F4F6;">
              <td style="padding:11px 20px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;">{{ r.date }}</td>
              <td style="padding:11px 14px;font-size:15px;font-variant-numeric:tabular-nums;color:{{ r.inColor }};">{{ r.in }}</td>
              <td style="padding:11px 14px;font-size:15px;font-variant-numeric:tabular-nums;color:#6B7280;">{{ r.out }}</td>
              <td style="padding:11px 14px;font-size:15px;font-variant-numeric:tabular-nums;color:{{ r.awayColor }};">{{ r.away }}</td>
              <td style="padding:11px 14px;font-size:15px;color:#374151;">{{ r.out2 }}</td>
              <td style="padding:11px 14px;font-size:15px;font-variant-numeric:tabular-nums;font-weight:700;">{{ r.hours }}</td>
              <td style="padding:11px 20px;">
                <span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:#F3F4F6;">
                  <span style="width:6px;height:6px;border-radius:50%;background:{{ r.dot }};"></span>
                  <span style="font-size:13px;font-weight:700;color:#374151;">{{ r.status }}</span>
                </span>
              </td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ic = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', false, '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', true,  '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', false, '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', false,   '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['설정', false,     '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: ic(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    const rows = [
      { date:'07-04', in:'09:02', out:'18:05', away:'8분',  out2:'12:00 식사 (1:00)', hours:'8:48', status:'정상', dot:'#16A34A' },
      { date:'07-03', in:'08:55', out:'18:10', away:'—',    out2:'—', hours:'8:52', status:'정상', dot:'#16A34A' },
      { date:'07-02', in:'09:20', out:'18:00', away:'15분', out2:'14:30 외근 (0:40)', hours:'8:15', status:'지각', dot:'#F59E0B', inColor:'#B45309', awayColor:'#B45309' },
      { date:'07-01', in:'08:47', out:'18:02', away:'—',    out2:'12:10 식사 (1:00)', hours:'8:45', status:'정상', dot:'#16A34A' },
      { date:'06-30', in:'08:55', out:'19:30', away:'5분',  out2:'—', hours:'9:35', status:'정상', dot:'#16A34A' },
      { date:'06-27', in:'연차',  out:'—',     away:'—',    out2:'—', hours:'—', status:'연차', dot:'#2563EB', inColor:'#1D4ED8' },
    ].map(r => ({ ...r, inColor: r.inColor || '#111827', awayColor: r.awayColor || '#6B7280' }));
    return { menu, rows };
  }
}
</script>
</body>
</html>
