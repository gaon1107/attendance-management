<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:76px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 0;">
    <div style="width:36px;height:36px;border-radius:9px;background:#2563EB;display:flex;align-items:center;justify-content:center;margin-bottom:22px;"><span style="color:#fff;font-size:17px;font-weight:700;">근</span></div>
    <nav style="display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="7">
        <a href="#" style="position:relative;width:56px;height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;background:{{ m.bg }};color:{{ m.color }};" style-hover="background:#F3F4F6;">
          <span style="width:19px;height:19px;display:flex;" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          <span style="font-size:11px;font-weight:700;">{{ m.label }}</span>
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;width:32px;height:32px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <div style="font-size:22px;font-weight:700;line-height:1.2;">근무제·기준시간 설정</div>
        <div style="font-size:13px;color:#6B7280;margin-top:3px;">회사 전체에 적용되는 기준입니다.</div>
      </div>
      <button style="height:40px;padding:0 20px;border:none;border-radius:7px;background:#2563EB;color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;" style-hover="background:#1D4ED8;">저장</button>
    </div>

    <div style="max-width:820px;display:flex;flex-direction:column;gap:1px;background:#E5E7EB;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;">

      <!-- Work hours -->
      <div style="background:#fff;padding:20px 24px;">
        <div style="font-size:16px;font-weight:700;margin-bottom:2px;">표준 근무시간</div>
        <div style="font-size:13px;color:#6B7280;margin-bottom:16px;">기본 출퇴근 시간과 지각 기준.</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;">
          <div><label style="display:block;font-size:13px;color:#6B7280;margin-bottom:6px;">출근</label><input value="09:00" style="width:100%;height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;font-variant-numeric:tabular-nums;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" /></div>
          <div><label style="display:block;font-size:13px;color:#6B7280;margin-bottom:6px;">퇴근</label><input value="18:00" style="width:100%;height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;font-variant-numeric:tabular-nums;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" /></div>
          <div><label style="display:block;font-size:13px;color:#6B7280;margin-bottom:6px;">휴게(분)</label><input value="60" style="width:100%;height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" /></div>
          <div><label style="display:block;font-size:13px;color:#6B7280;margin-bottom:6px;">지각 허용(분)</label><input value="10" style="width:100%;height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" /></div>
        </div>
      </div>

      <!-- Location -->
      <div style="background:#fff;padding:20px 24px;">
        <div style="font-size:16px;font-weight:700;margin-bottom:2px;">사업장 위치 · GPS</div>
        <div style="font-size:13px;color:#6B7280;margin-bottom:16px;">모바일 출퇴근 시 위치 확인 범위.</div>
        <div style="display:grid;grid-template-columns:3fr 1fr;gap:14px;">
          <div><label style="display:block;font-size:13px;color:#6B7280;margin-bottom:6px;">사업장 주소</label><input value="서울 강남구 테헤란로 123, 하늘빌딩 8층" style="width:100%;height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" /></div>
          <div><label style="display:block;font-size:13px;color:#6B7280;margin-bottom:6px;">허용 반경(m)</label><input value="150" style="width:100%;height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" /></div>
        </div>
      </div>

      <!-- Company network -->
      <div style="background:#fff;padding:20px 24px;">
        <div style="font-size:16px;font-weight:700;margin-bottom:2px;">사내 네트워크 등록</div>
        <div style="font-size:13px;color:#6B7280;margin-bottom:16px;">PC 출퇴근 시 회사 WiFi·IP로 위치를 확인합니다.</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;">
          <div><label style="display:block;font-size:13px;color:#6B7280;margin-bottom:6px;">회사 WiFi 이름 (SSID)</label><input value="SKYTECH-OFFICE" style="width:100%;height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" /></div>
          <div><label style="display:block;font-size:13px;color:#6B7280;margin-bottom:6px;">회사 IP 대역</label><input value="211.45.128.0/24" style="width:100%;height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;font-variant-numeric:tabular-nums;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" /></div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
          <sc-for list="{{ networks }}" as="n" hint-placeholder-count="2">
            <span style="display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 12px;border:1px solid #E5E7EB;border-radius:7px;background:#F9FAFB;">
              <span style="width:6px;height:6px;border-radius:50%;background:#2563EB;"></span>
              <span style="font-size:13px;font-weight:700;">{{ n.label }}</span>
              <span style="font-size:13px;color:#9CA3AF;font-variant-numeric:tabular-nums;">{{ n.val }}</span>
              <button style="width:18px;height:18px;border:none;background:transparent;color:#9CA3AF;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
            </span>
          </sc-for>
          <button style="height:32px;padding:0 12px;border:1px dashed #C7CDD4;border-radius:7px;background:#fff;color:#2563EB;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;">+ 추가</button>
        </div>
      </div>

      <!-- Presence -->
      <div style="background:#fff;padding:20px 24px;">
        <div style="font-size:16px;font-weight:700;margin-bottom:2px;">실근무시간 자리 확인</div>
        <div style="font-size:13px;color:#6B7280;margin-bottom:16px;">근무 중 자리 유무를 주기적으로 확인합니다. (이미지 미저장)</div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #F3F4F6;">
          <div><div style="font-size:15px;font-weight:700;">자리 확인 사용</div></div>
          <button onClick="{{ toggle }}" style="width:48px;height:28px;border:none;border-radius:14px;background:{{ trackBg }};cursor:pointer;position:relative;">
            <span style="position:absolute;top:3px;left:{{ knobLeft }};width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.2);transition:left 0.15s;"></span>
          </button>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 0 2px;">
          <div style="font-size:15px;font-weight:700;">확인 주기</div>
          <select style="height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;outline:none;background:#fff;"><option>10~15분</option><option>20~30분</option><option>30~45분</option></select>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { presence: true };
  renderVals() {
    const ic = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', false, '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', false, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', false, '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', false,   '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['설정', true,      '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: ic(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    const on = this.state.presence;
    return {
      menu,
      networks: [
        { label:'SKYTECH-OFFICE', val:'WiFi' },
        { label:'211.45.128.0/24', val:'IP' },
      ],
      toggle: () => this.setState(s => ({ presence: !s.presence })),
      trackBg: on ? '#2563EB' : '#D1D5DB',
      knobLeft: on ? '23px' : '3px',
    };
  }
}
</script>
</body>
</html>
