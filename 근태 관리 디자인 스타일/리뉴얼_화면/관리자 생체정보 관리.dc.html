<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:76px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 0;">
    <div style="width:36px;height:36px;border-radius:9px;background:#2563EB;display:flex;align-items:center;justify-content:center;margin-bottom:22px;"><span style="color:#fff;font-size:17px;font-weight:700;">근</span></div>
    <nav style="display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="7">
        <a href="#" style="position:relative;width:56px;height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;background:{{ m.bg }};color:{{ m.color }};" style-hover="background:#F3F4F6;">
          <span style="width:19px;height:19px;display:flex;" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          <span style="font-size:11px;font-weight:700;">{{ m.label }}</span>
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;width:32px;height:32px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="margin-bottom:16px;">
      <div style="font-size:22px;font-weight:700;line-height:1.2;">생체정보 관리</div>
      <div style="font-size:13px;color:#6B7280;margin-top:3px;">얼굴 등록 및 동의 현황을 관리합니다.</div>
    </div>

    <!-- Notice -->
    <div style="display:flex;align-items:center;gap:10px;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:10px;padding:12px 16px;margin-bottom:16px;">
      <span style="width:16px;height:16px;flex-shrink:0;color:#6B7280;display:flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></span>
      <div style="font-size:13px;color:#6B7280;line-height:1.5;">생체정보는 개인정보보호법에 따라 <strong style="color:#374151;">동의한 직원만</strong> 수집·보관되며, 동의 철회 시 지체 없이 파기됩니다.</div>
    </div>

    <!-- Summary -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;">
      <sc-for list="{{ kpis }}" as="k" hint-placeholder-count="3">
        <div style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;padding:16px 18px;">
          <div style="font-size:13px;color:#6B7280;font-weight:700;margin-bottom:10px;">{{ k.label }}</div>
          <div style="font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:{{ k.color }};">{{ k.value }}</div>
        </div>
      </sc-for>
    </div>

    <!-- Table -->
    <section style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;">
      <table style="width:100%;border-collapse:collapse;">
        <thead>
          <tr style="background:#F9FAFB;border-bottom:1px solid #E5E7EB;">
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;">이름</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">부서</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">동의 상태</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">얼굴 등록</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">등록일</th>
            <th style="text-align:right;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;">관리</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
            <tr style="border-bottom:1px solid #F3F4F6;">
              <td style="padding:11px 20px;font-size:15px;font-weight:700;">{{ r.name }}</td>
              <td style="padding:11px 14px;font-size:15px;color:#6B7280;">{{ r.dept }}</td>
              <td style="padding:11px 14px;">
                <span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:#F3F4F6;">
                  <span style="width:6px;height:6px;border-radius:50%;background:{{ r.consentDot }};"></span>
                  <span style="font-size:13px;font-weight:700;color:#374151;">{{ r.consent }}</span>
                </span>
              </td>
              <td style="padding:11px 14px;font-size:15px;color:{{ r.regColor }};">{{ r.reg }}</td>
              <td style="padding:11px 14px;font-size:15px;color:#6B7280;font-variant-numeric:tabular-nums;">{{ r.date }}</td>
              <td style="padding:11px 20px;text-align:right;">
                <sc-if value="{{ r.canDelete }}" hint-placeholder-val="{{ true }}">
                  <button style="height:34px;padding:0 12px;border:1px solid #FCA5A5;border-radius:7px;background:#fff;color:#DC2626;font-family:inherit;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#FEF2F2;">삭제</button>
                </sc-if>
                <sc-if value="{{ r.dash }}" hint-placeholder-val="{{ false }}">
                  <span style="font-size:15px;color:#D1D5DB;">—</span>
                </sc-if>
              </td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ic = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', false, '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', false, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', false, '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', false,   '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', true,  '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['설정', false,     '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: ic(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    const rows = [
      { name:'홍길동', dept:'영업팀',     consent:'동의함', consentDot:'#16A34A', reg:'등록됨', regColor:'#111827', date:'2026-05-02', canDelete:true },
      { name:'김민준', dept:'개발팀',     consent:'동의함', consentDot:'#16A34A', reg:'등록됨', regColor:'#111827', date:'2026-05-10', canDelete:true },
      { name:'이서윤', dept:'디자인팀',   consent:'미동의', consentDot:'#9CA3AF', reg:'미등록', regColor:'#9CA3AF', date:'—',          dash:true },
      { name:'박도현', dept:'경영지원팀', consent:'동의함', consentDot:'#16A34A', reg:'등록됨', regColor:'#111827', date:'2026-06-01', canDelete:true },
      { name:'최유진', dept:'영업팀',     consent:'미동의', consentDot:'#9CA3AF', reg:'미등록', regColor:'#9CA3AF', date:'—',          dash:true },
    ];
    return {
      menu,
      kpis: [
        { label:'생체정보 동의', value:'12명', color:'#111827' },
        { label:'얼굴 등록 완료', value:'11명', color:'#15803D' },
        { label:'미동의 (GPS)', value:'8명', color:'#6B7280' },
      ],
      rows,
    };
  }
}
</script>
</body>
</html>
