<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:76px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 0;">
    <div style="width:36px;height:36px;border-radius:9px;background:#2563EB;display:flex;align-items:center;justify-content:center;margin-bottom:22px;"><span style="color:#fff;font-size:17px;font-weight:700;">근</span></div>
    <nav style="display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="8">
        <a href="#" style="position:relative;width:56px;height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;background:{{ m.bg }};color:{{ m.color }};" style-hover="background:#F3F4F6;">
          <span style="width:19px;height:19px;display:flex;" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          <span style="font-size:11px;font-weight:700;">{{ m.label }}</span>
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;width:32px;height:32px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
      <div>
        <div style="font-size:22px;font-weight:700;line-height:1.2;">휴게시간 관리</div>
        <div style="font-size:13px;color:#6B7280;margin-top:3px;">근로기준법상 휴게시간 부여 규칙과 준수 현황.</div>
      </div>
      <button style="height:40px;padding:0 18px;border:none;border-radius:7px;background:#2563EB;color:#fff;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#1D4ED8;">저장</button>
    </div>

    <!-- Legal note -->
    <div style="display:flex;align-items:center;gap:10px;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:10px;padding:12px 16px;margin-bottom:16px;">
      <span style="width:16px;height:16px;flex-shrink:0;color:#6B7280;display:flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></span>
      <div style="font-size:13px;color:#6B7280;">근로시간 4시간마다 30분 이상, 8시간 근무 시 <strong style="color:#374151;">1시간 이상</strong>의 휴게시간을 부여해야 합니다.</div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1.4fr;gap:12px;align-items:start;">
      <!-- Rule editor -->
      <section style="background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:20px 24px;">
        <div style="font-size:16px;font-weight:700;margin-bottom:16px;">휴게 규칙</div>
        <div style="display:flex;flex-direction:column;gap:14px;">
          <div>
            <label style="display:block;font-size:13px;color:#6B7280;margin-bottom:6px;">점심 휴게</label>
            <div style="display:flex;align-items:center;gap:8px;">
              <input value="12:00" style="flex:1;height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;font-variant-numeric:tabular-nums;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
              <span style="color:#9CA3AF;">~</span>
              <input value="13:00" style="flex:1;height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;font-variant-numeric:tabular-nums;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
            </div>
          </div>
          <div>
            <label style="display:block;font-size:13px;color:#6B7280;margin-bottom:6px;">자동 차감 방식</label>
            <select style="width:100%;height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;outline:none;background:#fff;"><option>고정 시간 차감</option><option>실제 외출 기록 반영</option></select>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;padding-top:6px;">
            <div><div style="font-size:15px;font-weight:700;">추가 휴게 허용</div><div style="font-size:13px;color:#9CA3AF;">4시간마다 15분 자율 휴게</div></div>
            <button onClick="{{ toggle }}" style="width:48px;height:28px;border:none;border-radius:14px;background:{{ trackBg }};cursor:pointer;position:relative;"><span style="position:absolute;top:3px;left:{{ knobLeft }};width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.2);transition:left 0.15s;"></span></button>
          </div>
        </div>
      </section>

      <!-- Compliance table -->
      <section style="background:#fff;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;">
        <div style="padding:14px 20px;border-bottom:1px solid #E5E7EB;font-size:16px;font-weight:700;">오늘 휴게 준수 현황</div>
        <table style="width:100%;border-collapse:collapse;">
          <thead>
            <tr style="background:#F9FAFB;border-bottom:1px solid #E5E7EB;">
              <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;">이름</th>
              <th style="text-align:right;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">근무</th>
              <th style="text-align:right;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">휴게</th>
              <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;">준수</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
              <tr style="border-bottom:1px solid #F3F4F6;">
                <td style="padding:11px 20px;font-size:15px;font-weight:700;">{{ r.name }}</td>
                <td style="padding:11px 14px;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;color:#6B7280;">{{ r.work }}</td>
                <td style="padding:11px 14px;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;">{{ r.rest }}</td>
                <td style="padding:11px 20px;">
                  <span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:#F3F4F6;">
                    <span style="width:6px;height:6px;border-radius:50%;background:{{ r.dot }};"></span>
                    <span style="font-size:13px;font-weight:700;color:#374151;">{{ r.status }}</span>
                  </span>
                </td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { extra: true };
  renderVals() {
    const ic = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', false, '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', false, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', false, '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', false,   '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['설정', true,      '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: ic(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    const on = this.state.extra;
    const rows = [
      { name:'김민준', work:'9:52', rest:'1:00', status:'준수', dot:'#16A34A' },
      { name:'홍길동', work:'8:48', rest:'1:00', status:'준수', dot:'#16A34A' },
      { name:'한도윤', work:'10:20', rest:'0:40', status:'부족', dot:'#F59E0B' },
      { name:'이서윤', work:'8:45', rest:'1:00', status:'준수', dot:'#16A34A' },
      { name:'최유진', work:'11:10', rest:'0:30', status:'미준수', dot:'#DC2626' },
    ];
    return {
      menu, rows,
      toggle: () => this.setState(s => ({ extra: !s.extra })),
      trackBg: on ? '#2563EB' : '#D1D5DB',
      knobLeft: on ? '23px' : '3px',
    };
  }
}
</script>
</body>
</html>
