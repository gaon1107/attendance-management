<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:76px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 0;">
    <div style="width:36px;height:36px;border-radius:9px;background:#2563EB;display:flex;align-items:center;justify-content:center;margin-bottom:22px;"><span style="color:#fff;font-size:17px;font-weight:700;">근</span></div>
    <nav style="display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="8">
        <a href="#" style="position:relative;width:56px;height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;background:{{ m.bg }};color:{{ m.color }};" style-hover="background:#F3F4F6;">
          <span style="width:19px;height:19px;display:flex;" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          <span style="font-size:11px;font-weight:700;">{{ m.label }}</span>
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;width:32px;height:32px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
      <div>
        <div style="font-size:22px;font-weight:700;line-height:1.2;">조직도</div>
        <div style="font-size:13px;color:#6B7280;margin-top:3px;">㈜하늘테크 · 4개 부서 · 20명</div>
      </div>
      <button style="height:40px;padding:0 16px;border:1px solid #D1D5DB;border-radius:7px;background:#fff;color:#374151;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#F9FAFB;">내보내기</button>
    </div>

    <!-- CEO node -->
    <div style="display:flex;flex-direction:column;align-items:center;">
      <div style="width:200px;background:#2563EB;border-radius:10px;padding:14px 16px;text-align:center;color:#fff;">
        <div style="font-size:13px;color:rgba(255,255,255,0.8);font-weight:700;margin-bottom:3px;">대표이사</div>
        <div style="font-size:16px;font-weight:700;">문지호</div>
      </div>
      <div style="width:1px;height:24px;background:#D1D5DB;"></div>

      <!-- Departments row -->
      <div style="width:100%;overflow-x:auto;padding-bottom:6px;">
      <div style="display:flex;align-items:flex-start;gap:16px;justify-content:center;min-width:min-content;margin:0 auto;">
        <sc-for list="{{ depts }}" as="d" hint-placeholder-count="4">
          <div style="display:flex;flex-direction:column;align-items:center;width:220px;">
            <!-- Dept head card -->
            <div style="width:100%;background:#fff;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;">
              <div style="padding:14px 16px;border-bottom:1px solid #F3F4F6;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
                  <span style="font-size:15px;font-weight:700;">{{ d.name }}</span>
                  <span style="display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;background:#F3F4F6;font-size:13px;font-weight:700;color:#6B7280;">{{ d.count }}</span>
                </div>
                <div style="display:flex;align-items:center;gap:9px;">
                  <div style="width:32px;height:32px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">{{ d.leadInitial }}</div>
                  <div><div style="font-size:15px;font-weight:700;">{{ d.lead }}</div><div style="font-size:13px;color:#9CA3AF;">팀장</div></div>
                </div>
              </div>
              <!-- Members -->
              <div style="padding:8px 10px;display:flex;flex-direction:column;gap:2px;">
                <sc-for list="{{ d.members }}" as="p" hint-placeholder-count="3">
                  <div style="display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;" style-hover="background:#F9FAFB;">
                    <div style="width:26px;height:26px;border-radius:50%;background:#F3F4F6;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#6B7280;">{{ p.initial }}</div>
                    <span style="flex:1;font-size:15px;">{{ p.name }}</span>
                    <span style="font-size:13px;color:#9CA3AF;">{{ p.rank }}</span>
                  </div>
                </sc-for>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ic = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', true,  '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', false, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', false, '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', false,   '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['설정', false,     '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: ic(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    return {
      menu,
      depts: [
        { name:'개발팀', count:'7명', lead:'정우성', leadInitial:'정', members:[
          { initial:'김', name:'김민준', rank:'과장' },
          { initial:'한', name:'한도윤', rank:'대리' },
          { initial:'이', name:'이준서', rank:'사원' },
        ]},
        { name:'영업팀', count:'6명', lead:'강한울', leadInitial:'강', members:[
          { initial:'홍', name:'홍길동', rank:'대리' },
          { initial:'최', name:'최유진', rank:'사원' },
        ]},
        { name:'디자인팀', count:'4명', lead:'오세림', leadInitial:'오', members:[
          { initial:'이', name:'이서윤', rank:'주임' },
        ]},
        { name:'경영지원팀', count:'3명', lead:'문지호', leadInitial:'문', members:[
          { initial:'박', name:'박도현', rank:'대리' },
          { initial:'김', name:'김수아', rank:'사원' },
        ]},
      ],
    };
  }
}
</script>
</body>
</html>
