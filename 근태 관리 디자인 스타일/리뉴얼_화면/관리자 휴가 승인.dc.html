<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:76px;flex-shrink:0;background:#fff;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 0;">
    <div style="width:36px;height:36px;border-radius:9px;background:#2563EB;display:flex;align-items:center;justify-content:center;margin-bottom:22px;"><span style="color:#fff;font-size:17px;font-weight:700;">근</span></div>
    <nav style="display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;">
      <sc-for list="{{ rail }}" as="r" hint-placeholder-count="7">
        <a href="#" style="position:relative;width:56px;height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;background:{{ r.bg }};color:{{ r.fg }};" style-hover="background:#F3F4F6;">
          <span style="width:19px;height:19px;display:flex;" dangerouslySetInnerHTML="{{ r.icon }}"></span>
          <span style="font-size:11px;font-weight:700;">{{ r.label }}</span>
          <sc-if value="{{ r.badge }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:6px;right:10px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#DC2626;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;">{{ r.badge }}</span></sc-if>
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;width:32px;height:32px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
  </aside>

  <main style="flex:1;min-width:0;display:flex;flex-direction:column;">
    <header style="height:60px;flex-shrink:0;background:#fff;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;justify-content:space-between;padding:0 28px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="font-size:18px;font-weight:700;">휴가 승인</span>
        <span style="font-size:13px;color:#9CA3AF;">직원 휴가 신청을 검토하고 처리하세요</span>
      </div>
    </header>

    <div style="flex:1;min-width:0;padding:20px 28px 40px;">
      <!-- KPI strip -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;">
        <sc-for list="{{ kpis }}" as="k" hint-placeholder-count="4">
          <div style="background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:16px 20px;">
            <div style="font-size:13px;color:#6B7280;font-weight:700;margin-bottom:10px;">{{ k.label }}</div>
            <div style="font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:{{ k.color }};">{{ k.value }}<span style="font-size:14px;font-weight:400;color:#6B7280;margin-left:2px;">{{ k.unit }}</span></div>
          </div>
        </sc-for>
      </div>

      <!-- Tabs -->
      <div style="display:flex;gap:4px;border-bottom:1px solid #E5E7EB;margin-bottom:16px;">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
          <button onClick="{{ t.select }}" style="height:40px;padding:0 16px;border:none;background:transparent;border-bottom:2px solid {{ t.border }};color:{{ t.fg }};font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;">
            {{ t.label }}
            <span style="min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:{{ t.countBg }};color:{{ t.countFg }};font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;">{{ t.count }}</span>
          </button>
        </sc-for>
      </div>

      <!-- Request cards -->
      <div style="display:flex;flex-direction:column;gap:10px;">
        <sc-for list="{{ requests }}" as="r" hint-placeholder-count="4">
          <div style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:16px;">
            <div style="width:40px;height:40px;flex-shrink:0;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#374151;">{{ r.initial }}</div>
            <div style="flex:1;min-width:0;">
              <div style="display:flex;align-items:center;gap:9px;margin-bottom:4px;">
                <span style="font-size:15px;font-weight:700;">{{ r.name }}</span>
                <span style="font-size:13px;color:#6B7280;">{{ r.dept }}</span>
                <span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:{{ r.tag.bg }};font-size:13px;font-weight:700;color:{{ r.tag.fg }};">{{ r.tag.label }}</span>
              </div>
              <div style="font-size:15px;color:#374151;">{{ r.period }} · <span style="color:#6B7280;">{{ r.days }}</span></div>
              <div style="font-size:13px;color:#9CA3AF;margin-top:3px;">사유: {{ r.reason }} · 신청 {{ r.at }}</div>
            </div>
            <sc-if value="{{ r.pending }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;gap:8px;flex-shrink:0;">
                <button style="height:38px;padding:0 16px;border:1px solid #FCA5A5;border-radius:7px;background:#fff;color:#DC2626;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#FEF2F2;">반려</button>
                <button style="height:38px;padding:0 16px;border:none;border-radius:7px;background:#16A34A;color:#fff;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#15803D;">승인</button>
              </div>
            </sc-if>
            <sc-if value="{{ r.done }}" hint-placeholder-val="{{ false }}">
              <span style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:6px;background:#F3F4F6;flex-shrink:0;">
                <span style="width:6px;height:6px;border-radius:50%;background:{{ r.result.dot }};"></span>
                <span style="font-size:13px;font-weight:700;color:#374151;">{{ r.result.label }}</span>
              </span>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: '대기' };
  renderVals() {
    const ic = (p, s) => ({ __html: '<svg width="' + (s||19) + '" height="' + (s||19) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const rail = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>', null],
      ['직원관리', false, '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>', null],
      ['근태현황', false, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', null],
      ['휴가관리', true,  '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/>', '2'],
      ['리포트', false, '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', null],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/>', null],
      ['설정', false, '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>', null],
    ].map(([label, active, p, badge]) => ({
      label, icon: ic(p, 19), badge,
      bg: active ? '#EFF6FF' : 'transparent',
      fg: active ? '#2563EB' : '#9CA3AF',
    }));
    const tab = this.state.tab;
    const tabDefs = [['대기', 2], ['승인', 5], ['반려', 1]];
    const tabs = tabDefs.map(([label, count]) => {
      const a = label === tab;
      return {
        label, count,
        select: () => this.setState({ tab: label }),
        border: a ? '#2563EB' : 'transparent',
        fg: a ? '#2563EB' : '#6B7280',
        countBg: a ? '#EFF6FF' : '#F3F4F6',
        countFg: a ? '#1D4ED8' : '#6B7280',
      };
    });
    const T = { 연차:{label:'연차',bg:'#DBEAFE',fg:'#1D4ED8'}, 반차:{label:'반차',bg:'#EDE9FE',fg:'#6D28D9'}, 병가:{label:'병가',bg:'#FEF3C7',fg:'#B45309'} };
    const all = {
      '대기': [
        { initial:'이', name:'이서윤', dept:'디자인팀', tag:T.연차, period:'7월 8일 ~ 7월 9일', days:'2일', reason:'개인 사정', at:'어제', pending:true },
        { initial:'최', name:'최유진', dept:'영업팀', tag:T.반차, period:'7월 7일 오후', days:'0.5일', reason:'병원 방문', at:'2시간 전', pending:true },
      ],
      '승인': [
        { initial:'김', name:'김민준', dept:'개발팀', tag:T.연차, period:'7월 3일 ~ 7월 4일', days:'2일', reason:'가족 여행', at:'6월 30일', done:true, result:{label:'승인됨',dot:'#16A34A'} },
        { initial:'박', name:'박도현', dept:'경영지원팀', tag:T.병가, period:'6월 28일', days:'1일', reason:'몸살', at:'6월 27일', done:true, result:{label:'승인됨',dot:'#16A34A'} },
      ],
      '반려': [
        { initial:'한', name:'한도윤', dept:'개발팀', tag:T.연차, period:'7월 1일 ~ 7월 5일', days:'5일', reason:'장기 여행', at:'6월 25일', done:true, result:{label:'반려됨',dot:'#DC2626'} },
      ],
    };
    return { rail, tabs, requests: all[tab], kpis: [
      { label:'대기', value:'2', unit:'건', color:'#B45309' },
      { label:'이번달 승인', value:'5', unit:'건', color:'#111827' },
      { label:'반려', value:'1', unit:'건', color:'#111827' },
      { label:'평균 처리', value:'4', unit:'시간', color:'#111827' },
    ] };
  }
}
</script>
</body>
</html>
