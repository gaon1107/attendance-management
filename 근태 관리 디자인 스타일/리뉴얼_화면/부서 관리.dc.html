<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:76px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 0;">
    <div style="width:36px;height:36px;border-radius:9px;background:#2563EB;display:flex;align-items:center;justify-content:center;margin-bottom:22px;"><span style="color:#fff;font-size:17px;font-weight:700;">근</span></div>
    <nav style="display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="8">
        <a href="#" style="position:relative;width:56px;height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;background:{{ m.bg }};color:{{ m.color }};" style-hover="background:#F3F4F6;">
          <span style="width:19px;height:19px;display:flex;" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          <span style="font-size:11px;font-weight:700;">{{ m.label }}</span>
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;width:32px;height:32px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
      <div>
        <div style="font-size:22px;font-weight:700;line-height:1.2;">부서 관리</div>
        <div style="font-size:13px;color:#6B7280;margin-top:3px;">부서 4개 · 직원 20명</div>
      </div>
      <button style="height:40px;padding:0 16px;border:none;border-radius:7px;background:#2563EB;color:#fff;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:7px;" style-hover="background:#1D4ED8;">
        <span style="width:15px;height:15px;display:flex;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
        부서 추가
      </button>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1.6fr;gap:16px;align-items:start;">

      <!-- Dept list -->
      <section style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;">
        <div style="padding:12px 18px;border-bottom:1px solid #E5E7EB;font-size:13px;font-weight:700;color:#6B7280;">부서 목록</div>
        <sc-for list="{{ depts }}" as="d" hint-placeholder-count="4">
          <div onClick="{{ d.select }}" style="display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid #F3F4F6;cursor:pointer;background:{{ d.rowBg }};border-left:3px solid {{ d.accent }};" style-hover="background:#F9FAFB;">
            <div style="flex:1;min-width:0;">
              <div style="font-size:15px;font-weight:700;color:{{ d.nameColor }};">{{ d.name }}</div>
              <div style="font-size:13px;color:#9CA3AF;margin-top:1px;">{{ d.lead }}</div>
            </div>
            <span style="font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:#6B7280;">{{ d.count }}</span>
            <span style="width:15px;height:15px;color:#C7CDD4;display:flex;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
          </div>
        </sc-for>
      </section>

      <!-- Dept detail -->
      <section style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #E5E7EB;">
          <div>
            <div style="font-size:16px;font-weight:700;">{{ selName }}</div>
            <div style="font-size:13px;color:#6B7280;margin-top:2px;">팀장 {{ selLead }} · 직원 {{ selCount }}</div>
          </div>
          <div style="display:flex;gap:8px;">
            <button style="height:36px;padding:0 14px;border:1px solid #D1D5DB;border-radius:7px;background:#fff;color:#374151;font-family:inherit;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#F9FAFB;">이름 변경</button>
            <button style="height:36px;padding:0 14px;border:1px solid #FCA5A5;border-radius:7px;background:#fff;color:#DC2626;font-family:inherit;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#FEF2F2;">삭제</button>
          </div>
        </div>
        <table style="width:100%;border-collapse:collapse;">
          <thead>
            <tr style="background:#F9FAFB;border-bottom:1px solid #E5E7EB;">
              <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:9px 20px;">이름</th>
              <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:9px 14px;">직급</th>
              <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:9px 14px;">상태</th>
              <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:9px 20px;">인증방식</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{ members }}" as="p" hint-placeholder-count="5">
              <tr style="border-bottom:1px solid #F3F4F6;">
                <td style="padding:11px 20px;">
                  <div style="display:flex;align-items:center;gap:10px;">
                    <div style="width:28px;height:28px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">{{ p.initial }}</div>
                    <span style="font-size:15px;font-weight:700;">{{ p.name }}</span>
                  </div>
                </td>
                <td style="padding:11px 14px;font-size:15px;color:#6B7280;">{{ p.rank }}</td>
                <td style="padding:11px 14px;">
                  <span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:#F3F4F6;"><span style="width:6px;height:6px;border-radius:50%;background:{{ p.dot }};"></span><span style="font-size:13px;font-weight:700;color:#374151;">{{ p.status }}</span></span>
                </td>
                <td style="padding:11px 20px;font-size:15px;color:#6B7280;">{{ p.auth }}</td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { sel: 0 };
  renderVals() {
    const ic = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', true,  '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', false, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', false, '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', false,   '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['설정', false,     '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: ic(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    const sel = this.state.sel;
    const deptData = [
      { name:'개발팀', lead:'팀장 정우성', count:'7명', members:[
        { initial:'김', name:'김민준', rank:'과장', status:'재직중', dot:'#16A34A', auth:'얼굴인증' },
        { initial:'한', name:'한도윤', rank:'대리', status:'재직중', dot:'#16A34A', auth:'GPS' },
        { initial:'이', name:'이준서', rank:'사원', status:'재직중', dot:'#16A34A', auth:'GPS' },
      ]},
      { name:'영업팀', lead:'팀장 강هان', count:'6명', members:[
        { initial:'홍', name:'홍길동', rank:'대리', status:'재직중', dot:'#16A34A', auth:'얼굴인증' },
        { initial:'최', name:'최유진', rank:'사원', status:'재직중', dot:'#16A34A', auth:'GPS' },
      ]},
      { name:'디자인팀', lead:'팀장 오세림', count:'4명', members:[
        { initial:'이', name:'이서윤', rank:'주임', status:'재직중', dot:'#16A34A', auth:'GPS' },
      ]},
      { name:'경영지원팀', lead:'팀장 문지호', count:'3명', members:[
        { initial:'박', name:'박도현', rank:'대리', status:'재직중', dot:'#16A34A', auth:'얼굴인증' },
        { initial:'김', name:'김수아', rank:'사원', status:'초대중', dot:'#9CA3AF', auth:'—' },
      ]},
    ];
    // fix stray char
    deptData[1].lead = '팀장 강한울';
    const depts = deptData.map((d, i) => {
      const a = i === sel;
      return { name:d.name, lead:d.lead, count:d.count,
        select: () => this.setState({ sel: i }),
        rowBg: a?'#EFF6FF':'#fff', accent: a?'#2563EB':'transparent', nameColor: a?'#1D4ED8':'#111827' };
    });
    const cur = deptData[sel];
    return {
      menu, depts,
      selName: cur.name, selLead: cur.lead.replace('팀장 ',''), selCount: cur.count,
      members: cur.members,
    };
  }
}
</script>
</body>
</html>
