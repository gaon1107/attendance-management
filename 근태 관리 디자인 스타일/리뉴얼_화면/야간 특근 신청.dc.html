<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background:#E5E7EB; }
</style>
</helmet>
<div style="min-height:100vh;background:#E5E7EB;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Pretendard,-apple-system,sans-serif;color:#111827;">

  <div style="width:390px;height:844px;background:#F9FAFB;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(17,24,39,0.18);display:flex;flex-direction:column;position:relative;">

    <div style="height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;"><span>9:41</span><span style="color:#6B7280;">근태관리</span></div>

    <header style="height:52px;flex-shrink:0;display:flex;align-items:center;padding:0 12px;">
      <button style="width:40px;height:40px;border:none;background:transparent;color:#374151;cursor:pointer;display:flex;align-items:center;justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span style="font-size:16px;font-weight:700;margin-left:4px;">야간·특근 신청</span>
    </header>

    <div style="flex:1;overflow-y:auto;padding:8px 24px 8px;">
      <!-- Type -->
      <label style="display:block;font-size:13px;font-weight:700;margin-bottom:10px;">근무 구분</label>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;">
        <sc-for list="{{ types }}" as="t" hint-placeholder-count="3">
          <button onClick="{{ t.select }}" style="height:60px;border:1px solid {{ t.border }};border-radius:9px;background:{{ t.bg }};cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;" style-hover="border-color:#2563EB;">
            <span style="font-size:15px;font-weight:700;color:{{ t.fg }};">{{ t.label }}</span>
            <span style="font-size:13px;color:{{ t.rateColor }};">{{ t.rate }}</span>
          </button>
        </sc-for>
      </div>

      <!-- Date -->
      <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">근무일</label>
      <div style="display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border:1px solid #D1D5DB;border-radius:9px;background:#fff;margin-bottom:16px;">
        <span style="width:18px;height:18px;color:#6B7280;display:flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
        <span style="font-size:15px;font-weight:700;">2026년 7월 7일 (화)</span>
      </div>

      <!-- Time range -->
      <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">근무 시간</label>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        <div style="flex:1;display:flex;align-items:center;gap:9px;height:48px;padding:0 14px;border:1px solid #D1D5DB;border-radius:9px;background:#fff;cursor:pointer;" style-hover="border-color:#2563EB;">
          <span style="width:17px;height:17px;color:#6B7280;display:flex;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
          <span style="font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;">18:00</span>
        </div>
        <span style="color:#9CA3AF;">~</span>
        <div style="flex:1;display:flex;align-items:center;gap:9px;height:48px;padding:0 14px;border:1px solid #D1D5DB;border-radius:9px;background:#fff;cursor:pointer;" style-hover="border-color:#2563EB;">
          <span style="width:17px;height:17px;color:#6B7280;display:flex;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
          <span style="font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;">21:00</span>
        </div>
      </div>

      <!-- Calc summary -->
      <div style="background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:16px 18px;margin-bottom:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid #F3F4F6;margin-bottom:10px;">
          <span style="font-size:13px;color:#6B7280;">{{ calcLabel }}</span>
          <span style="font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;">{{ hoursLabel }}</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:15px;font-weight:700;">예상 수당 <span style="font-size:13px;font-weight:400;color:#9CA3AF;">({{ rate }})</span></span>
          <span style="font-size:18px;font-weight:700;color:#2563EB;font-variant-numeric:tabular-nums;">{{ pay }}</span>
        </div>
      </div>

      <!-- Weekly limit -->
      <div style="margin-bottom:20px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <span style="font-size:13px;font-weight:700;color:#6B7280;">이번 주 연장근로 한도</span>
          <span style="font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;">9 / 12시간</span>
        </div>
        <div style="height:8px;border-radius:5px;background:#F3F4F6;overflow:hidden;"><div style="height:100%;width:75%;background:#F59E0B;border-radius:5px;"></div></div>
        <div style="font-size:13px;color:#B45309;font-weight:700;margin-top:6px;">신청 후 한도까지 0시간 남습니다</div>
      </div>

      <!-- Reason -->
      <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">사유</label>
      <textarea placeholder="예: 월말 정산 마감 작업" style="width:100%;height:72px;padding:12px 14px;border:1px solid #D1D5DB;border-radius:9px;font-family:inherit;font-size:15px;color:#111827;outline:none;resize:none;line-height:1.5;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);"></textarea>
    </div>

    <div style="flex-shrink:0;border-top:1px solid #E5E7EB;background:#FFFFFF;padding:16px 24px 26px;">
      <button style="width:100%;height:52px;border:none;border-radius:10px;background:#2563EB;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;" style-hover="background:#1D4ED8;">사전 신청하기</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { type: '연장근로' };
  renderVals() {
    const HOURLY = 15000; // 통상시급
    const HOURS = 3;      // 18:00~21:00
    const defs = [
      { label:'연장근로', mult:1.5 },
      { label:'야간근로', mult:2.0 },
      { label:'휴일근로', mult:2.0 },
    ];
    const sel = this.state.type;
    const cur = defs.find(d => d.label === sel) || defs[0];
    const pay = Math.round(HOURLY * HOURS * cur.mult);
    const won = (n) => n.toLocaleString('ko-KR') + '원';
    return {
      types: defs.map(d => {
        const a = d.label === sel;
        return { label:d.label, rate:d.mult.toFixed(1)+'배', select: () => this.setState({ type: d.label }),
          bg: a?'#EFF6FF':'#fff', fg: a?'#1D4ED8':'#374151', border: a?'#2563EB':'#D1D5DB',
          rateColor: a?'#2563EB':'#9CA3AF' };
      }),
      calcLabel: '예상 ' + sel,
      hoursLabel: HOURS + '시간',
      rate: cur.mult.toFixed(1) + '배',
      pay: won(pay),
    };
  }
}
</script>
</body>
</html>
