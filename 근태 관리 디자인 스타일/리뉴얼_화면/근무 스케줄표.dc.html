<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:76px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 0;">
    <div style="width:36px;height:36px;border-radius:9px;background:#2563EB;display:flex;align-items:center;justify-content:center;margin-bottom:22px;"><span style="color:#fff;font-size:17px;font-weight:700;">근</span></div>
    <nav style="display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="8">
        <a href="#" style="position:relative;width:56px;height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;background:{{ m.bg }};color:{{ m.color }};" style-hover="background:#F3F4F6;">
          <span style="width:19px;height:19px;display:flex;" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          <span style="font-size:11px;font-weight:700;">{{ m.label }}</span>
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;width:32px;height:32px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div>
        <div style="font-size:22px;font-weight:700;line-height:1.2;">근무 스케줄표</div>
        <div style="font-size:13px;color:#6B7280;margin-top:3px;">개발팀 · 주간 교대 근무표</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <select style="height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;color:#111827;outline:none;background:#fff;"><option>개발팀</option><option>영업팀</option><option>경영지원팀</option></select>
        <div style="display:flex;align-items:center;background:#fff;border:1px solid #D1D5DB;border-radius:7px;height:40px;overflow:hidden;">
          <button style="width:40px;height:40px;border:none;background:transparent;color:#6B7280;cursor:pointer;display:flex;align-items:center;justify-content:center;" style-hover="background:#F3F4F6;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <span style="padding:0 8px;font-size:15px;font-weight:700;min-width:130px;text-align:center;">7/6 – 7/12</span>
          <button style="width:40px;height:40px;border:none;background:transparent;color:#6B7280;cursor:pointer;display:flex;align-items:center;justify-content:center;" style-hover="background:#F3F4F6;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <button style="height:40px;padding:0 16px;border:none;border-radius:7px;background:#2563EB;color:#fff;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#1D4ED8;">스케줄 발행</button>
      </div>
    </div>

    <!-- Legend -->
    <div style="display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap;">
      <sc-for list="{{ legend }}" as="l" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;border-radius:3px;background:{{ l.dot }};border:1px solid {{ l.border }};"></span><span style="font-size:13px;color:#6B7280;font-weight:700;">{{ l.label }}</span></div>
      </sc-for>
    </div>

    <!-- Schedule grid -->
    <section style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;">
      <!-- Header row -->
      <div style="display:grid;grid-template-columns:160px repeat(7,1fr);background:#F9FAFB;border-bottom:1px solid #E5E7EB;">
        <div style="padding:10px 16px;font-size:13px;font-weight:700;color:#6B7280;">직원</div>
        <sc-for list="{{ dows }}" as="d" hint-placeholder-count="7">
          <div style="padding:10px 0;text-align:center;font-size:13px;font-weight:700;color:{{ d.color }};border-left:1px solid #F3F4F6;">{{ d.label }}<span style="display:block;font-size:13px;font-weight:400;color:#9CA3AF;margin-top:1px;">{{ d.date }}</span></div>
        </sc-for>
      </div>
      <!-- Employee rows -->
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
        <div style="display:grid;grid-template-columns:160px repeat(7,1fr);border-bottom:1px solid #F3F4F6;">
          <div style="padding:12px 16px;display:flex;align-items:center;gap:10px;">
            <div style="width:30px;height:30px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">{{ r.initial }}</div>
            <div style="min-width:0;"><div style="font-size:15px;font-weight:700;">{{ r.name }}</div><div style="font-size:13px;color:#9CA3AF;">{{ r.role }}</div></div>
          </div>
          <sc-for list="{{ r.shifts }}" as="s" hint-placeholder-count="7">
            <div style="border-left:1px solid #F3F4F6;padding:8px;display:flex;align-items:center;justify-content:center;">
              <div style="width:100%;height:44px;border-radius:7px;background:{{ s.bg }};border:1px solid {{ s.border }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;">
                <span style="font-size:13px;font-weight:700;color:{{ s.fg }};">{{ s.label }}</span>
                <sc-if value="{{ s.hasTime }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;color:{{ s.timeColor }};font-variant-numeric:tabular-nums;">{{ s.time }}</span></sc-if>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ic = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', false, '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', true, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', false, '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', false,   '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['설정', false,     '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: ic(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    // shift types
    const DAY   = { label:'주간', time:'09–18', bg:'#EFF6FF', border:'#BFDBFE', fg:'#1D4ED8', timeColor:'#60A5FA', hasTime:true };
    const EVE   = { label:'오후', time:'13–22', bg:'#F5F3FF', border:'#DDD6FE', fg:'#6D28D9', timeColor:'#A78BFA', hasTime:true };
    const OFF   = { label:'휴무', bg:'#F9FAFB', border:'#E5E7EB', fg:'#9CA3AF', hasTime:false };
    const LEAVE = { label:'연차', bg:'#F3F4F6', border:'#E5E7EB', fg:'#6B7280', hasTime:false };
    const dows = ['월','화','수','목','금','토','일'].map((label, i) => ({
      label, date: (6+i) <= 12 ? ('7/'+(6+i)) : '', color: i===5 ? '#2563EB' : (i===6 ? '#DC2626' : '#6B7280'),
    }));
    const mk = (arr) => arr.map(s => ({ ...s }));
    const rows = [
      { initial:'김', name:'김민준', role:'과장', shifts: mk([DAY,DAY,DAY,DAY,DAY,OFF,OFF]) },
      { initial:'한', name:'한도윤', role:'대리', shifts: mk([EVE,EVE,EVE,DAY,DAY,OFF,OFF]) },
      { initial:'이', name:'이준서', role:'사원', shifts: mk([DAY,DAY,LEAVE,LEAVE,DAY,OFF,OFF]) },
      { initial:'정', name:'정우성', role:'팀장', shifts: mk([DAY,DAY,DAY,DAY,DAY,OFF,OFF]) },
      { initial:'유', name:'유지훈', role:'사원', shifts: mk([OFF,EVE,EVE,EVE,EVE,EVE,OFF]) },
    ];
    return {
      menu, dows, rows,
      legend: [
        { label:'주간 (09–18)', dot:'#EFF6FF', border:'#BFDBFE' },
        { label:'오후 (13–22)', dot:'#F5F3FF', border:'#DDD6FE' },
        { label:'휴무', dot:'#F9FAFB', border:'#E5E7EB' },
        { label:'연차', dot:'#F3F4F6', border:'#E5E7EB' },
      ],
    };
  }
}
</script>
</body>
</html>
