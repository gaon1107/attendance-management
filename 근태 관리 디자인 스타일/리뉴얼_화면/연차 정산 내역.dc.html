<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:76px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 0;">
    <div style="width:36px;height:36px;border-radius:9px;background:#2563EB;display:flex;align-items:center;justify-content:center;margin-bottom:22px;"><span style="color:#fff;font-size:17px;font-weight:700;">근</span></div>
    <nav style="display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="7">
        <a href="#" style="position:relative;width:56px;height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;background:{{ m.bg }};color:{{ m.color }};" style-hover="background:#F3F4F6;">
          <span style="width:19px;height:19px;display:flex;" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          <span style="font-size:11px;font-weight:700;">{{ m.label }}</span>
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;width:32px;height:32px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div>
        <div style="font-size:22px;font-weight:700;line-height:1.2;">연차 정산 내역</div>
        <div style="font-size:13px;color:#6B7280;margin-top:3px;">2026년 · 직원별 연차 발생·사용·잔여 현황</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <select style="height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;color:#111827;outline:none;background:#fff;"><option>2026년</option><option>2025년</option></select>
        <button style="height:40px;padding:0 16px;border:1px solid #D1D5DB;border-radius:7px;background:#fff;color:#374151;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#F9FAFB;">내보내기</button>
      </div>
    </div>

    <!-- KPI -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;">
      <sc-for list="{{ kpis }}" as="k" hint-placeholder-count="4">
        <div style="background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:16px 18px;">
          <div style="font-size:13px;color:#6B7280;margin-bottom:8px;">{{ k.label }}</div>
          <div style="font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:{{ k.color }};">{{ k.value }}</div>
        </div>
      </sc-for>
    </div>

    <!-- Table -->
    <section style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;">
      <div style="overflow-x:auto;">
      <table style="width:100%;min-width:820px;border-collapse:collapse;">
        <thead>
          <tr style="background:#F9FAFB;border-bottom:1px solid #E5E7EB;">
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;white-space:nowrap;">이름</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;white-space:nowrap;">입사일</th>
            <th style="text-align:right;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;white-space:nowrap;">발생</th>
            <th style="text-align:right;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;white-space:nowrap;">사용</th>
            <th style="text-align:right;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;white-space:nowrap;">잔여</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;white-space:nowrap;">소멸 예정</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;white-space:nowrap;">상태</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
            <tr style="border-bottom:1px solid #F3F4F6;">
              <td style="padding:11px 20px;font-size:15px;font-weight:700;white-space:nowrap;">{{ r.name }}</td>
              <td style="padding:11px 14px;font-size:15px;color:#6B7280;font-variant-numeric:tabular-nums;white-space:nowrap;">{{ r.joined }}</td>
              <td style="padding:11px 14px;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;">{{ r.total }}</td>
              <td style="padding:11px 14px;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;color:#6B7280;white-space:nowrap;">{{ r.used }}</td>
              <td style="padding:11px 14px;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;">{{ r.remain }}</td>
              <td style="padding:11px 20px;font-size:15px;color:{{ r.expireColor }};font-variant-numeric:tabular-nums;white-space:nowrap;">{{ r.expire }}</td>
              <td style="padding:11px 20px;white-space:nowrap;">
                <span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:#F3F4F6;">
                  <span style="width:6px;height:6px;border-radius:50%;background:{{ r.dot }};"></span>
                  <span style="font-size:13px;font-weight:700;color:#374151;white-space:nowrap;">{{ r.status }}</span>
                </span>
              </td>
            </tr>
          </sc-for>
        </tbody>
      </table>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ic = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', false, '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', false, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', true,  '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', false,   '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['설정', false,     '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: ic(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    const rows = [
      { name:'홍길동', joined:'2024-03-11', total:'20', used:'4.5', remain:'15.5', expire:'12-31 · 15.5일', expireColor:'#B45309', status:'정상', dot:'#16A34A' },
      { name:'김민준', joined:'2021-01-04', total:'17', used:'12', remain:'5', expire:'—', expireColor:'#9CA3AF', status:'정상', dot:'#16A34A' },
      { name:'이서윤', joined:'2023-07-20', total:'15', used:'2', remain:'13', expire:'12-31 · 13일', expireColor:'#B91C1C', status:'촉진 필요', dot:'#F59E0B' },
      { name:'박도현', joined:'2020-05-02', total:'16', used:'16', remain:'0', expire:'—', expireColor:'#9CA3AF', status:'소진', dot:'#9CA3AF' },
      { name:'최유진', joined:'2025-02-17', total:'11', used:'3', remain:'8', expire:'—', expireColor:'#9CA3AF', status:'정상', dot:'#16A34A' },
      { name:'한도윤', joined:'2022-09-01', total:'15', used:'5', remain:'10', expire:'12-31 · 10일', expireColor:'#B45309', status:'촉진 필요', dot:'#F59E0B' },
    ];
    return {
      menu, rows,
      kpis: [
        { label:'총 발생 연차', value:'94일', color:'#111827' },
        { label:'사용', value:'42.5일', color:'#111827' },
        { label:'잔여', value:'51.5일', color:'#111827' },
        { label:'소멸 예정', value:'38.5일', color:'#B45309' },
      ],
    };
  }
}
</script>
</body>
</html>
