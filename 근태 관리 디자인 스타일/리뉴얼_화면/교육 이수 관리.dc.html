<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:76px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 0;">
    <div style="width:36px;height:36px;border-radius:9px;background:#2563EB;display:flex;align-items:center;justify-content:center;margin-bottom:22px;"><span style="color:#fff;font-size:17px;font-weight:700;">근</span></div>
    <nav style="display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="7">
        <a href="#" style="position:relative;width:56px;height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;background:{{ m.bg }};color:{{ m.color }};" style-hover="background:#F3F4F6;">
          <span style="width:19px;height:19px;display:flex;" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          <span style="font-size:11px;font-weight:700;">{{ m.label }}</span>
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;width:32px;height:32px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div>
        <div style="font-size:22px;font-weight:700;line-height:1.2;">교육 이수 관리</div>
        <div style="font-size:13px;color:#6B7280;margin-top:3px;">법정 의무교육 이수 현황을 관리합니다.</div>
      </div>
      <button style="height:40px;padding:0 16px;border:none;border-radius:7px;background:#2563EB;color:#fff;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#1D4ED8;">이수 독려 발송</button>
    </div>

    <!-- Course cards -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;">
      <sc-for list="{{ courses }}" as="c" hint-placeholder-count="4">
        <div style="background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:16px 18px;">
          <div style="font-size:13px;color:#6B7280;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ c.name }}</div>
          <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:10px;">
            <span style="font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;">{{ c.pct }}</span>
            <span style="font-size:13px;color:#9CA3AF;">{{ c.done }}/20</span>
          </div>
          <div style="height:6px;border-radius:4px;background:#F3F4F6;overflow:hidden;"><div style="height:100%;width:{{ c.pct }};background:{{ c.bar }};border-radius:4px;"></div></div>
          <div style="font-size:13px;color:{{ c.dueColor }};font-weight:700;margin-top:8px;">{{ c.due }}</div>
        </div>
      </sc-for>
    </div>

    <!-- Filter -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <select style="height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;color:#111827;outline:none;background:#fff;"><option>직장 내 성희롱 예방</option><option>개인정보보호</option><option>산업안전보건</option><option>장애인 인식개선</option></select>
      <div style="display:inline-flex;background:#EEF2F7;border-radius:8px;padding:3px;">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
          <button onClick="{{ t.select }}" style="height:34px;padding:0 14px;border:none;border-radius:6px;background:{{ t.bg }};color:{{ t.fg }};font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;box-shadow:{{ t.shadow }};">{{ t.label }}</button>
        </sc-for>
      </div>
    </div>

    <!-- Table -->
    <section style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;">
      <table style="width:100%;border-collapse:collapse;">
        <thead>
          <tr style="background:#F9FAFB;border-bottom:1px solid #E5E7EB;">
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;">이름</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">부서</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">이수일</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">교육시간</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;">상태</th>
            <th style="text-align:right;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;">관리</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
            <tr style="border-bottom:1px solid #F3F4F6;">
              <td style="padding:11px 20px;font-size:15px;font-weight:700;">{{ r.name }}</td>
              <td style="padding:11px 14px;font-size:15px;color:#6B7280;">{{ r.dept }}</td>
              <td style="padding:11px 14px;font-size:15px;color:{{ r.dateColor }};font-variant-numeric:tabular-nums;">{{ r.date }}</td>
              <td style="padding:11px 14px;font-size:15px;color:#6B7280;">{{ r.hours }}</td>
              <td style="padding:11px 20px;">
                <span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:#F3F4F6;">
                  <span style="width:6px;height:6px;border-radius:50%;background:{{ r.dot }};"></span>
                  <span style="font-size:13px;font-weight:700;color:#374151;">{{ r.status }}</span>
                </span>
              </td>
              <td style="padding:11px 20px;text-align:right;">
                <sc-if value="{{ r.canRemind }}" hint-placeholder-val="{{ true }}">
                  <button style="height:34px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;background:#fff;color:#374151;font-family:inherit;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#F9FAFB;">독려</button>
                </sc-if>
                <sc-if value="{{ r.dash }}" hint-placeholder-val="{{ false }}"><span style="font-size:15px;color:#D1D5DB;">—</span></sc-if>
              </td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: '전체' };
  renderVals() {
    const ic = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', true,  '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', false, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', false, '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', false,   '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['설정', false,     '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: ic(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    const done = { status:'이수', dot:'#16A34A' };
    const wait = { status:'미이수', dot:'#F59E0B' };
    const over = { status:'기한초과', dot:'#DC2626' };
    const all = [
      { name:'홍길동', dept:'영업팀', date:'2026-06-12', dateColor:'#111827', hours:'1시간', ...done, dash:true },
      { name:'김민준', dept:'개발팀', date:'2026-06-20', dateColor:'#111827', hours:'1시간', ...done, dash:true },
      { name:'이서윤', dept:'디자인팀', date:'—', dateColor:'#9CA3AF', hours:'—', ...wait, canRemind:true },
      { name:'박도현', dept:'경영지원팀', date:'2026-05-30', dateColor:'#111827', hours:'1시간', ...done, dash:true },
      { name:'최유진', dept:'영업팀', date:'—', dateColor:'#9CA3AF', hours:'—', ...over, canRemind:true },
      { name:'한도윤', dept:'개발팀', date:'—', dateColor:'#9CA3AF', hours:'—', ...wait, canRemind:true },
    ];
    const tab = this.state.tab;
    const tabs = ['전체','이수','미이수'].map(label => {
      const a = label === tab;
      return { label, select: () => this.setState({ tab: label }),
        bg: a?'#fff':'transparent', fg: a?'#2563EB':'#6B7280', shadow: a?'0 1px 2px rgba(0,0,0,0.08)':'none' };
    });
    const rows = tab==='전체' ? all : all.filter(r => (tab==='이수'&&r.status==='이수')||(tab==='미이수'&&r.status!=='이수'));
    return {
      menu, tabs, rows,
      courses: [
        { name:'직장 내 성희롱 예방', pct:'90%', done:'18', bar:'#2563EB', due:'~7/31', dueColor:'#B45309' },
        { name:'개인정보보호', pct:'100%', done:'20', bar:'#16A34A', due:'완료', dueColor:'#15803D' },
        { name:'산업안전보건', pct:'75%', done:'15', bar:'#F59E0B', due:'~8/15', dueColor:'#B45309' },
        { name:'장애인 인식개선', pct:'60%', done:'12', bar:'#DC2626', due:'~7/20 임박', dueColor:'#B91C1C' },
      ],
    };
  }
}
</script>
</body>
</html>
