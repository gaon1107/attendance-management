<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:76px;flex-shrink:0;background:#fff;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 0;">
    <div style="width:36px;height:36px;border-radius:9px;background:#2563EB;display:flex;align-items:center;justify-content:center;margin-bottom:22px;"><span style="color:#fff;font-size:17px;font-weight:700;">근</span></div>
    <nav style="display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;">
      <sc-for list="{{ rail }}" as="r" hint-placeholder-count="7">
        <a href="#" style="width:56px;height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;background:{{ r.bg }};color:{{ r.fg }};" style-hover="background:#F3F4F6;">
          <span style="width:19px;height:19px;display:flex;" dangerouslySetInnerHTML="{{ r.icon }}"></span>
          <span style="font-size:11px;font-weight:700;">{{ r.label }}</span>
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;width:32px;height:32px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
  </aside>

  <main style="flex:1;min-width:0;display:flex;flex-direction:column;">
    <header style="height:60px;flex-shrink:0;background:#fff;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;justify-content:space-between;padding:0 28px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="font-size:18px;font-weight:700;">직원 관리</span>
        <span style="font-size:13px;color:#9CA3AF;">㈜하늘테크 · 총 20명</span>
      </div>
      <button style="display:flex;align-items:center;gap:7px;height:38px;padding:0 16px;border:none;border-radius:8px;background:#2563EB;color:#fff;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#1D4ED8;">
        <span style="width:15px;height:15px;display:flex;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
        직원 초대
      </button>
    </header>

    <div style="flex:1;min-width:0;padding:20px 28px 40px;">
      <!-- KPI strip -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;">
        <sc-for list="{{ kpis }}" as="k" hint-placeholder-count="4">
          <div style="background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:16px 20px;">
            <div style="font-size:13px;color:#6B7280;font-weight:700;margin-bottom:10px;">{{ k.label }}</div>
            <div style="font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:{{ k.color }};">{{ k.value }}<span style="font-size:14px;font-weight:400;color:#6B7280;margin-left:2px;">{{ k.unit }}</span></div>
          </div>
        </sc-for>
      </div>

      <!-- Toolbar -->
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        <div style="position:relative;flex:1;max-width:300px;">
          <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#9CA3AF;display:flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
          <input placeholder="이름·부서 검색" style="width:100%;height:40px;padding:0 12px 0 36px;border:1px solid #D1D5DB;border-radius:8px;font-family:inherit;font-size:15px;color:#111827;outline:none;background:#fff;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
        </div>
        <select style="height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:8px;font-family:inherit;font-size:15px;color:#111827;outline:none;background:#fff;"><option>전체 부서</option><option>영업팀</option><option>총무팀</option><option>개발팀</option></select>
        <select style="height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:8px;font-family:inherit;font-size:15px;color:#111827;outline:none;background:#fff;"><option>전체 상태</option><option>재직중</option><option>초대중</option></select>
      </div>

      <!-- Table -->
      <section style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;overflow:hidden;">
        <table style="width:100%;border-collapse:collapse;">
          <thead>
            <tr style="background:#F9FAFB;border-bottom:1px solid #E5E7EB;">
              <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:11px 20px;">이름</th>
              <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:11px 14px;">부서</th>
              <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:11px 14px;">상태</th>
              <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:11px 14px;">인증방식</th>
              <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:11px 14px;">생체동의</th>
              <th style="text-align:right;font-size:13px;font-weight:700;color:#6B7280;padding:11px 20px;">관리</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{ rows }}" as="row" hint-placeholder-count="3">
              <tr style="border-bottom:1px solid #F3F4F6;" style-hover="background:#FCFCFD;">
                <td style="padding:11px 20px;">
                  <div style="display:flex;align-items:center;gap:10px;">
                    <div style="width:30px;height:30px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">{{ row.initial }}</div>
                    <span style="font-size:15px;font-weight:700;">{{ row.name }}</span>
                  </div>
                </td>
                <td style="padding:11px 14px;font-size:15px;color:#6B7280;">{{ row.dept }}</td>
                <td style="padding:11px 14px;">
                  <span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:#F3F4F6;">
                    <span style="width:6px;height:6px;border-radius:50%;background:{{ row.statusDot }};"></span>
                    <span style="font-size:13px;font-weight:700;color:#374151;">{{ row.status }}</span>
                  </span>
                </td>
                <td style="padding:11px 14px;font-size:15px;color:{{ row.authColor }};">{{ row.auth }}</td>
                <td style="padding:11px 14px;font-size:15px;color:{{ row.consentColor }};">{{ row.consent }}</td>
                <td style="padding:11px 20px;text-align:right;">
                  <button style="height:34px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;background:#fff;color:#374151;font-family:inherit;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#F9FAFB;">상세</button>
                </td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ic = (p, s) => ({ __html: '<svg width="' + (s||19) + '" height="' + (s||19) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const rail = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', true,  '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', false, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', false, '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/>'],
      ['리포트', false, '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/>'],
      ['설정', false, '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ].map(([label, active, p]) => ({
      label, icon: ic(p, 19),
      bg: active ? '#EFF6FF' : 'transparent',
      fg: active ? '#2563EB' : '#9CA3AF',
    }));
    return {
      rail,
      kpis: [
        { label:'전체 직원', value:'20', unit:'명', color:'#111827' },
        { label:'재직중', value:'18', unit:'명', color:'#111827' },
        { label:'초대중', value:'2', unit:'명', color:'#B45309' },
        { label:'얼굴인증 사용', value:'11', unit:'명', color:'#111827' },
      ],
      rows: [
        { name: '홍길동', initial: '홍', dept: '영업팀', status: '재직중', statusDot: '#16A34A', auth: '얼굴인증', authColor: '#111827', consent: '동의함', consentColor: '#15803D' },
        { name: '김수아', initial: '김', dept: '총무팀', status: '초대중', statusDot: '#9CA3AF', auth: '—', authColor: '#9CA3AF', consent: '—', consentColor: '#9CA3AF' },
        { name: '이준서', initial: '이', dept: '개발팀', status: '재직중', statusDot: '#16A34A', auth: 'GPS', authColor: '#111827', consent: '—', consentColor: '#9CA3AF' },
      ],
    };
  }
}
</script>
</body>
</html>
