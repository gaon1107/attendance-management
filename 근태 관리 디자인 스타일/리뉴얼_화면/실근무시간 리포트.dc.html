<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:76px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 0;">
    <div style="width:36px;height:36px;border-radius:9px;background:#2563EB;display:flex;align-items:center;justify-content:center;margin-bottom:22px;"><span style="color:#fff;font-size:17px;font-weight:700;">근</span></div>
    <nav style="display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="7">
        <a href="#" style="position:relative;width:56px;height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;background:{{ m.bg }};color:{{ m.color }};" style-hover="background:#F3F4F6;">
          <span style="width:19px;height:19px;display:flex;" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          <span style="font-size:11px;font-weight:700;">{{ m.label }}</span>
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;width:32px;height:32px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="margin-bottom:16px;">
      <div style="font-size:22px;font-weight:700;line-height:1.2;">실근무시간 리포트</div>
      <div style="font-size:13px;color:#6B7280;margin-top:3px;">단위별 실근무·자리비움·외출 집계.</div>
    </div>

    <!-- Controls -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
      <div style="display:inline-flex;background:#EEF2F7;border-radius:8px;padding:3px;">
        <sc-for list="{{ units }}" as="u" hint-placeholder-count="3">
          <button onClick="{{ u.select }}" style="height:34px;padding:0 18px;border:none;border-radius:6px;background:{{ u.bg }};color:{{ u.fg }};font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;box-shadow:{{ u.shadow }};">{{ u.label }}</button>
        </sc-for>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <input value="2026-07-01" style="height:40px;width:150px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;font-variant-numeric:tabular-nums;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
        <span style="color:#9CA3AF;">~</span>
        <input value="2026-07-07" style="height:40px;width:150px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;font-variant-numeric:tabular-nums;outline:none;" style-focus="border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.12);" />
      </div>
      <select style="height:40px;padding:0 12px;border:1px solid #D1D5DB;border-radius:7px;font-family:inherit;font-size:15px;outline:none;background:#fff;"><option>전체 부서</option><option>개발팀</option><option>영업팀</option></select>
    </div>

    <!-- Table -->
    <section style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;margin-bottom:14px;">
      <table style="width:100%;border-collapse:collapse;">
        <thead>
          <tr style="background:#F9FAFB;border-bottom:1px solid #E5E7EB;">
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;">이름</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">부서</th>
            <th style="text-align:right;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">실근무시간</th>
            <th style="text-align:right;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">자리비움</th>
            <th style="text-align:right;font-size:13px;font-weight:700;color:#6B7280;padding:10px 14px;">외출</th>
            <th style="text-align:left;font-size:13px;font-weight:700;color:#6B7280;padding:10px 20px;">비고</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
            <tr style="border-bottom:1px solid #F3F4F6;">
              <td style="padding:11px 20px;font-size:15px;font-weight:700;">{{ r.name }}</td>
              <td style="padding:11px 14px;font-size:15px;color:#6B7280;">{{ r.dept }}</td>
              <td style="padding:11px 14px;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;">{{ r.work }}</td>
              <td style="padding:11px 14px;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;color:#6B7280;">{{ r.away }}</td>
              <td style="padding:11px 14px;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;color:#6B7280;">{{ r.out }}</td>
              <td style="padding:11px 20px;font-size:15px;color:#6B7280;">{{ r.note }}</td>
            </tr>
          </sc-for>
        </tbody>
        <tfoot>
          <tr style="background:#F9FAFB;border-top:1px solid #E5E7EB;">
            <td style="padding:11px 20px;font-size:15px;font-weight:700;" colspan="2">합계 (6명)</td>
            <td style="padding:11px 14px;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;">247:10</td>
            <td style="padding:11px 14px;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:#6B7280;">6:40</td>
            <td style="padding:11px 14px;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:#6B7280;">5:20</td>
            <td style="padding:11px 20px;"></td>
          </tr>
        </tfoot>
      </table>
    </section>

    <!-- Coming soon notice -->
    <div style="display:flex;align-items:center;gap:10px;background:#F9FAFB;border:1px dashed #D1D5DB;border-radius:10px;padding:14px 18px;">
      <span style="width:18px;height:18px;color:#9CA3AF;display:flex;flex-shrink:0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></span>
      <span style="font-size:15px;color:#6B7280;">그래프·통계 시각화는 추후 제공 예정입니다.</span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { unit: '주' };
  renderVals() {
    const ic = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', false, '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', false, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', false, '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', true,    '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['설정', false,     '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: ic(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    const unit = this.state.unit;
    const units = ['일','주','월'].map(label => {
      const a = label === unit;
      return { label, select: () => this.setState({ unit: label }),
        bg: a?'#fff':'transparent', fg: a?'#2563EB':'#6B7280', shadow: a?'0 1px 2px rgba(0,0,0,0.08)':'none' };
    });
    const rows = [
      { name:'홍길동', dept:'영업팀', work:'42:30', away:'1:20', out:'1:00', note:'—' },
      { name:'김민준', dept:'개발팀', work:'45:10', away:'0:40', out:'0:00', note:'초과 5:10' },
      { name:'이서윤', dept:'디자인팀', work:'40:05', away:'1:10', out:'2:00', note:'—' },
      { name:'박도현', dept:'경영지원팀', work:'39:40', away:'0:50', out:'0:20', note:'—' },
      { name:'최유진', dept:'영업팀', work:'41:15', away:'1:30', out:'2:00', note:'지각 1회' },
      { name:'한도윤', dept:'개발팀', work:'38:30', away:'1:10', out:'0:00', note:'연차 1일' },
    ];
    return { menu, units, rows };
  }
}
</script>
</body>
</html>
