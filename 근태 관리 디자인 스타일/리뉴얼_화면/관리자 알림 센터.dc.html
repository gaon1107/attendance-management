<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh;background:#F9FAFB;font-family:Pretendard,-apple-system,sans-serif;color:#111827;display:flex;">

  <aside style="width:76px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E5E7EB;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 0;">
    <div style="width:36px;height:36px;border-radius:9px;background:#2563EB;display:flex;align-items:center;justify-content:center;margin-bottom:22px;"><span style="color:#fff;font-size:17px;font-weight:700;">근</span></div>
    <nav style="display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="7">
        <a href="#" style="position:relative;width:56px;height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;background:{{ m.bg }};color:{{ m.color }};" style-hover="background:#F3F4F6;">
          <span style="width:19px;height:19px;display:flex;" dangerouslySetInnerHTML="{{ m.icon }}"></span>
          <span style="font-size:11px;font-weight:700;">{{ m.label }}</span>
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;width:32px;height:32px;border-radius:50%;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#374151;">관</div>
  </aside>

  <main style="flex:1;min-width:0;padding:24px 28px 48px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div>
        <div style="font-size:22px;font-weight:700;line-height:1.2;">알림 센터</div>
        <div style="font-size:13px;color:#6B7280;margin-top:3px;">처리가 필요한 항목과 최근 활동입니다.</div>
      </div>
      <button style="height:40px;padding:0 16px;border:1px solid #D1D5DB;border-radius:7px;background:#fff;color:#374151;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;" style-hover="background:#F9FAFB;">모두 읽음</button>
    </div>

    <!-- Filter chips -->
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
        <button onClick="{{ c.select }}" style="height:34px;padding:0 14px;border:1px solid {{ c.border }};border-radius:17px;background:{{ c.bg }};color:{{ c.fg }};font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;">{{ c.label }}</button>
      </sc-for>
    </div>

    <!-- Action-needed panel -->
    <section style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;max-width:820px;">
      <div style="display:flex;align-items:center;gap:9px;padding:14px 20px;border-bottom:1px solid #E5E7EB;">
        <span style="font-size:15px;font-weight:700;">처리 필요</span>
        <span style="min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#DC2626;color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;">3</span>
      </div>
      <sc-for list="{{ actions }}" as="n" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid #F3F4F6;">
          <span style="width:36px;height:36px;flex-shrink:0;border-radius:9px;background:#F3F4F6;color:{{ n.iconFg }};display:flex;align-items:center;justify-content:center;" dangerouslySetInnerHTML="{{ n.icon }}"></span>
          <div style="flex:1;min-width:0;">
            <div style="font-size:15px;font-weight:700;">{{ n.title }}</div>
            <div style="font-size:13px;color:#6B7280;margin-top:2px;">{{ n.body }}</div>
          </div>
          <span style="font-size:13px;color:#9CA3AF;flex-shrink:0;white-space:nowrap;">{{ n.time }}</span>
          <button style="height:36px;padding:0 14px;border:none;border-radius:7px;background:#2563EB;color:#fff;font-family:inherit;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;flex-shrink:0;" style-hover="background:#1D4ED8;">{{ n.cta }}</button>
        </div>
      </sc-for>

      <!-- Recent activity -->
      <div style="padding:14px 20px;border-bottom:1px solid #F3F4F6;font-size:15px;font-weight:700;">최근 활동</div>
      <sc-for list="{{ activity }}" as="n" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid #F3F4F6;">
          <span style="width:32px;height:32px;flex-shrink:0;border-radius:8px;background:#F3F4F6;color:{{ n.iconFg }};display:flex;align-items:center;justify-content:center;" dangerouslySetInnerHTML="{{ n.icon }}"></span>
          <div style="flex:1;min-width:0;">
            <div style="font-size:15px;color:#111827;">{{ n.title }}</div>
            <div style="font-size:13px;color:#6B7280;margin-top:2px;">{{ n.body }}</div>
          </div>
          <span style="font-size:13px;color:#9CA3AF;flex-shrink:0;white-space:nowrap;">{{ n.time }}</span>
        </div>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { chip: '전체' };
  renderVals() {
    const nav = (p) => ({ __html: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const raw = [
      ['대시보드', false, '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
      ['직원관리', false, '<circle cx="9" cy="7" r="3"/><path d="M3 21v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 3.5a3 3 0 0 1 0 6"/>'],
      ['근태현황', false, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
      ['휴가관리', false, '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 16l2 2 4-4"/>'],
      ['리포트', false,   '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
      ['생체정보', false, '<path d="M12 11a3 3 0 0 0-3 3v3"/><path d="M6 8a8 8 0 0 1 12 0"/><path d="M4 12a10 10 0 0 1 16 0"/><path d="M12 15v4"/>'],
      ['설정', false,     '<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 0-8 8"/><path d="M12 8v4l3 2"/>'],
    ];
    const menu = raw.map(([label, active, p]) => ({
      label, icon: nav(p),
      weight: active ? 700 : 400,
      color: active ? '#2563EB' : '#374151',
      bg: active ? '#EFF6FF' : 'transparent',
      iconColor: active ? '#2563EB' : '#9CA3AF',
    }));
    const ic = (p) => ({ __html: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' });
    const I = {
      leave: ic('<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/>'),
      fix:   ic('<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
      warn:  ic('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
      user:  ic('<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 12 0v1"/>'),
      ok:    ic('<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>'),
    };
    const chip = this.state.chip;
    const chips = ['전체','휴가','정정','근태'].map(label => {
      const a = label === chip;
      return { label, select: () => this.setState({ chip: label }),
        bg: a?'#EFF6FF':'#fff', fg: a?'#1D4ED8':'#6B7280', border: a?'#2563EB':'#D1D5DB' };
    });
    return {
      menu, chips,
      actions: [
        { iconFg:'#2563EB', icon:I.leave, title:'휴가 신청 2건 대기', body:'이서윤(연차 2일), 최유진(반차)', time:'방금', cta:'검토' },
        { iconFg:'#B45309', icon:I.fix, title:'근태 정정 요청', body:'홍길동 · 7월 1일 퇴근시각 정정', time:'1시간 전', cta:'검토' },
        { iconFg:'#DC2626', icon:I.warn, title:'무단 결근 발생', body:'정우성 · 7월 4일 출근 기록 없음', time:'오늘 오전', cta:'확인' },
      ],
      activity: [
        { iconFg:'#16A34A', icon:I.ok, title:'박도현 휴가 승인 완료', body:'6월 28일 병가 1일', time:'어제' },
        { iconFg:'#2563EB', icon:I.user, title:'김수아 직원 초대 발송', body:'총무팀 · 초대 대기 중', time:'어제' },
        { iconFg:'#16A34A', icon:I.ok, title:'이준서 얼굴 등록 완료', body:'개발팀 · 얼굴인증 활성화', time:'2일 전' },
        { iconFg:'#2563EB', icon:I.leave, title:'월간 근태 리포트 생성', body:'2026년 6월 리포트 다운로드 가능', time:'7월 1일' },
      ],
    };
  }
}
</script>
</body>
</html>
