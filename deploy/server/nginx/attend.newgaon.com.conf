# 근태관리 attend.newgaon.com (2026-11-18 운영 준비 4-5) — 서버 E /etc/nginx/sites-available/attend.newgaon.com
#   근태 상자 = 서버 안 127.0.0.1:3300 (/opt/attendance, docker-compose.prod.yml)
#   이 파일 하나 + 문 비밀번호 파일(/etc/nginx/attendance-operator.htpasswd)만 근태 몫이다. 다른 서비스 설정은 건드리지 않는다.
#   되돌리기: sites-enabled 링크·이 파일 삭제 → nginx -t → systemctl reload nginx
#   근거: docs/09_test/배포전_체크리스트.md 2-1·3·3-2·6·8번
#
# ★ 인증서: certbot(webroot) — 자동 갱신(certbot.timer, 갱신 뒤 nginx reload)

# ── 요청 수 제한 구역 (http 단계 — 이름은 모두 att_ 로 시작해 다른 서비스와 겹치지 않게) ──
# 저장·전송(POST 등)만 센다. 화면 보기(GET·HEAD)는 세지 않는다(빈 열쇠 = 세지 않음).
#   🔴 경로(/login)가 아니라 "쓰기 요청 전체"에 거는 이유: 로그인·가입은 서버 액션이라
#      어느 주소로 보내도 실행된다(체크리스트 3-2). 헤더(Next-Action)만 보면 JS 없는 폼 전송으로 우회된다.
map $request_method $att_write_key {
    GET     "";
    HEAD    "";
    default $binary_remote_addr;
}
# 일반: IP당 분당 60건 + 순간 120건까지 — 한 사무실(공인 IP 1개) 직원 100명이 아침에 몰려도 넉넉하다
limit_req_zone $att_write_key      zone=att_write:10m   rate=60r/m;
# PC 근무시간 프로그램(/api/agent): 한 사무실 PC 수백 대가 같은 IP로 보낸다 → 따로 넉넉하게
limit_req_zone $att_write_key      zone=att_agent:10m   rate=600r/m;
# 운영자 화면(/operator): 보기·쓰기 모두 센다 — 문 비밀번호 계산 전에 쏟아붓기를 자른다
limit_req_zone $binary_remote_addr zone=att_op_ip:1m    rate=300r/m;
limit_req_zone $server_name        zone=att_op_all:1m   rate=30r/s;
# 큰 업로드(회사 문서·신청 첨부): nginx가 로그인 확인 "전에" 본문 전체(최대 53MB)를 받아 디스크에 쓰므로 따로 좁게
#   (2026-11-18 검수 L6) 업로드는 드물다 — IP당 분당 30 + 순간 30
limit_req_zone $binary_remote_addr zone=att_upload:10m  rate=30r/m;
# 화면 보기(GET·HEAD): 한 곳에서 쏟아붓는 요청으로 앱(CPU 2개 상한)이 멈추는 것만 막는 아주 넉넉한 상한 (검수 L7)
#   IP당 초당 50 + 순간 500. Next는 화면마다 미리 불러오기 요청을 여러 번 보내므로 넉넉해야 한다.
#   정적 파일(/_next/static)은 세지 않는다.
map $request_method $att_read_key {
    GET     $binary_remote_addr;
    HEAD    $binary_remote_addr;
    default "";
}
limit_req_zone $att_read_key       zone=att_read:10m    rate=50r/s;
# PC-OFF 내려받기(60MB대 파일, 2026-11-20) — 업로드 구역과 분리(같이 쓰면 직원들이 한꺼번에 받을 때 첨부 올리기까지 막힌다).
#   요청 수: IP당 분당 120 + 순간 200(요청 수로는 거의 걸리지 않게). 실제 상한은 아래 동시 연결 수다.
#   큰 파일은 요청 수로는 통신량을 못 막는다 → 동시 연결 수(IP당·사이트 전체)와 연결당 속도도 묶는다(아래 location).
limit_req_zone  $binary_remote_addr zone=att_dl:10m      rate=120r/m;
limit_conn_zone $binary_remote_addr zone=att_dl_ip:10m;
limit_conn_zone $server_name        zone=att_dl_all:1m;
# 문자 발송결과 회신(/api/sms/callback, 2026-11-22 메시지 관리 3-3)
#   비즈모아샷이 발송 결과를 알려 주는 주소다. 한 번에 30명에게 보내면 회신도 (접수+결과로) 60건쯤 몰려 온다.
#   일반 쓰기 제한(분당 60)에 걸리면 **결과를 영영 못 받는다**(문자 회사가 다시 보내 준다는 보장이 없다).
#   · 모든 회신이 문자 회사 서버 IP 한 곳에서 오므로, IP 기준 제한은 사실상 "문자 회사 전체"에 걸린다.
#   · 분당 200 = 우리 쓰임(한 번에 최대 60건)보다 넉넉하고, 아래 우회 위험은 작게 묶는 값이다.
limit_req_zone $att_write_key      zone=att_smscb:1m   rate=200r/m;
# 🔴 이 주소는 끝에 **비밀 토큰**이 붙는다 → 접속 기록에 주소를 그대로 남기면 로그를 읽는 사람이 토큰을 본다.
#    이 구역만 토큰 자리를 ***로 바꿔 남긴다(언제·어디서·결과는 그대로 추적할 수 있다).
log_format att_smscb '$remote_addr - [$time_local] "$request_method /api/sms/callback/*** $server_protocol" '
                     '$status $body_bytes_sent "$http_user_agent"';

# [HTTP 80] 인증서 자동갱신 통로 유지 + 나머지는 HTTPS로 자동 이동
server {
    listen 80;
    listen [::]:80;
    server_name attend.newgaon.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# [HTTPS 443] 근태관리
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name attend.newgaon.com;

    ssl_certificate     /etc/letsencrypt/live/attend.newgaon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/attend.newgaon.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 근태 전용 기록 — "아침에 로그인이 안 됐다" 신고가 오면 여기서 확인(체크리스트 3-2)
    access_log /var/log/nginx/attend.access.log;
    error_log  /var/log/nginx/attend.error.log warn;
    limit_req_status 429;
    limit_req_log_level warn;

    # 본문 크기: 서버 액션 4MB(얼굴 출퇴근 사진 3장) → 5MB. 큰 업로드 두 곳은 아래에서 따로 연다.
    client_max_body_size 5m;

    # 🔴 필수 4줄(체크리스트 8번) — 하나라도 빠지면 실제로 고장 난다
    #   Host 빠짐 → 로그인·출퇴근 버튼(서버 액션) 전부 실패 / X-Forwarded-For 는 덧붙이기 금지(IP 위조)
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;
    # (검수 L5) Next는 서버 액션 출처 검사에서 X-Forwarded-Host를 Host보다 먼저 본다.
    #   중간 장비가 이 헤더를 붙여 보내도 우리 주소로 덮어써야 버튼이 거부되지 않는다.
    #   ⚠️ 이 줄들은 server 단계에 둔다 — location 안에 proxy_set_header를 하나라도 쓰면 그 구역은 위 필수 4줄을 물려받지 않는다.
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;

    location / {
        limit_req zone=att_write burst=120 nodelay;
        limit_req zone=att_read  burst=500 nodelay;
        proxy_pass http://127.0.0.1:3300;
    }

    # 정적 파일(화면 부품·글꼴·그림) — 개수 제한 없음
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3300;
    }

    # 로그인 화면은 로그인한 사람의 실명을 담는다 → 공용 캐시 저장 금지(체크리스트 2-1)
    #   앱이 보내는 Cache-Control 은 숨기고 이 값으로 바꾼다(겹쳐 두 줄이 되지 않게)
    location = /login {
        limit_req zone=att_write burst=120 nodelay;
        limit_req zone=att_read  burst=500 nodelay;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        proxy_pass http://127.0.0.1:3300;
    }

    # 큰 업로드: 회사 문서 10MB / 신청 첨부 10MB×5개(+여유 2MB) — 앱 한도와 맞춤
    location = /api/company-doc/upload {
        limit_req zone=att_upload burst=30 nodelay;
        limit_req zone=att_write  burst=120 nodelay;
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:3300;
    }
    location = /api/request-attachment/upload {
        limit_req zone=att_upload burst=30 nodelay;
        limit_req zone=att_write  burst=120 nodelay;
        client_max_body_size 53m;
        proxy_pass http://127.0.0.1:3300;
    }

    # 문자 발송결과 회신 (2026-11-22, 메시지 관리 3-3) — 비즈모아샷 서버가 결과를 POST 해 준다.
    #   · 공개 주소다(로그인 없음). 주소 끝의 토큰이 운영 설정값과 다르면 **앱이 404**로 끝낸다.
    #   · 주소 모양까지 여기서 좁힌다(토큰 글자·길이) — 아무 주소나 이 구역을 타지 못하게.
    #   ⚠️ 그래도 토큰 모양만 흉내 낸 주소는 이 구역을 탈 수 있다(앱에서 404). PC 프로그램 구역과 달리
    #      토큰이 비밀값이라 주소를 설정에 적어 둘 수 없기 때문이다. 그래서 분당 600이 아니라 **200**으로 묶고,
    #      그 뒤는 앱의 로그인 시도 제한(lib/login-throttle.ts)이 받는다.
    #   · 접속 기록은 토큰을 가린 형식으로, **전용 파일**에 남긴다(위 att_smscb — 한 파일에 두 형식이 섞이지 않게).
    #   🔴 (2026-11-22 검수 중간 1) **오류 기록에는 주소가 통째로 찍힌다** — 요청수 제한(warn)이나 앱 재시작 중
    #      502/504(error)가 나면 `request: "POST /api/sms/callback/<진짜토큰>"`이 그대로 남는다. 가린 접속 기록이
    #      무의미해지므로, 이 구역만 오류 기록 문턱을 crit으로 올려 그 줄들이 아예 안 남게 한다.
    #      (토큰이 샜다 싶으면 .env 값을 새로 만들어 넣으면 끝이다 — 따로 보관할 필요 없는 값이다.)
    #   · 본문 상한: 앱은 64KB에서 버리는데 nginx 기본값(5MB)으로 받아 두면 그만큼 헛되이 받는다 → 128KB로 좁힌다.
    location ~ ^/api/sms/callback/[A-Za-z0-9_-]{16,128}$ {
        limit_req zone=att_smscb burst=200 nodelay;
        limit_req zone=att_read  burst=500 nodelay;
        client_max_body_size 128k;
        access_log /var/log/nginx/attend.smscb.access.log att_smscb;
        error_log  /var/log/nginx/attend.smscb.error.log crit;
        proxy_pass http://127.0.0.1:3300;
    }

    # PC 근무시간 프로그램 — 열쇠(토큰) 인증, 같은 IP의 PC가 많다
    #   🔴 (검수 M1) 실제 주소 4개만 "정확히" 연다. 예전처럼 /api/agent/ 접두사로 열면, 그 아래 없는 주소로
    #      로그인·가입 서버 액션을 보내 일반 제한(분당 60) 대신 이 구역(분당 600)을 타는 우회로가 생긴다
    #      (Next는 없는 주소로 온 POST도 404 화면이 서버 액션으로 처리한다).
    #   ⚠️ app/api/agent/ 아래에 새 주소를 만들면 여기 목록에도 넣어야 한다(빠지면 분당 60에 걸린다).
    location ~ ^/api/agent/(events|overtime|pair|policy)$ {
        limit_req zone=att_agent burst=600 nodelay;
        limit_req zone=att_read  burst=500 nodelay;
        proxy_pass http://127.0.0.1:3300;
    }

    # PC-OFF 프로그램 내려받기 (2026-11-20) — 관리자가 직원에게 이 주소를 보내면 직원이 내려받는다.
    #   · 파일은 저장소가 아니라 서버 /var/www/attend-downloads/ 에 둔다(60MB 넘는 실행 파일을 깃에 넣지 않는다).
    #     새 버전은 같은 이름으로 파일만 바꾼다 → 주소는 그대로.
    #   · 공개 주소다(로그인 없음). 프로그램만으로는 아무것도 못 하고, 웹에서 받은 6자리 연결코드가 있어야 회사와 연결된다.
    #   · 정확히 이 주소 하나만 연다(= 위치). 앱으로 넘기지 않으므로 서버 액션 우회로가 되지 않는다(POST는 nginx가 405).
    #   · 제한(검수 중간 1·2, 재확인 중간): 전용 구역 att_dl + 동시 연결 IP당 10·사이트 전체 20 + 연결당 초당 2MB
    #     → 내려받기 전체가 쓰는 회선 = 최대 20 × 2MB/s ≈ 320Mbps. 서버 회선 속도는 가상 장비라 확인 불가(2026-11-20) →
    #       보수적으로 잡아 같은 서버의 LMS·근태 출퇴근 몫을 남긴다. 회선을 확인하면 이 두 숫자를 다시 정한다.
    #     → 한 명은 30초쯤 걸린다. 한 사무실에서 동시에 11번째부터는 "많습니다" 안내(429) — 잠시 뒤 다시 받으면 된다.
    #   · 파일이 없거나(404) 몰릴 때(429·503) 한글 안내를 보여준다(검수 중간 3) — "첨부" 헤더는 성공 때만 붙는다(always 없음).
    #   · 파일을 올리는 절차: deploy/server/README.md "PC-OFF 내려받기 파일" (임시 이름으로 올림 → 내용 확인 → mv로 교체)
    location = /download/pc-off {
        limit_req  zone=att_dl burst=200 nodelay;
        limit_conn att_dl_ip 10;
        limit_conn att_dl_all 20;
        limit_conn_status 503;
        limit_rate 2m;
        max_ranges 1;
        alias /var/www/attend-downloads/pc-off.zip;
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="PC-OFF-setup.zip"';
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        error_page 404 = @att_dl_missing;
        error_page 429 503 = @att_dl_busy;
    }
    location @att_dl_missing {
        default_type "text/plain; charset=utf-8";
        return 404 "PC-OFF 설치 파일을 준비하고 있습니다. 잠시 후 다시 시도하거나 회사 관리자에게 문의해 주세요.\n";
    }
    location @att_dl_busy {
        default_type "text/plain; charset=utf-8";
        return 429 "지금 내려받는 사람이 많습니다. 1분 뒤 다시 시도해 주세요.\n";
    }

    # 운영자(본사) 화면 — 문 비밀번호(2026-11-18 결정: 사장님 인터넷이 유동 IP라 IP 제한 대신)
    #   처리 순서: 요청 수 제한(PREACCESS) → 문 비밀번호(ACCESS) → 앱의 운영자 로그인
    #   해시는 SHA-512(openssl passwd -6). bcrypt 금지 — nginx 작업자를 멈춰 같은 서버의 LMS까지 느려진다.
    #   ⚠️ 경로 제한은 "화면을 숨기는 것"이다. 서버 액션을 다른 주소로 쏘는 우회는 위 att_write + 앱 코드 상한이 막는다.
    location ^~ /operator {
        limit_req zone=att_op_ip  burst=300 nodelay;
        limit_req zone=att_op_all burst=300 nodelay;
        auth_basic           "attendance operator";
        auth_basic_user_file /etc/nginx/attendance-operator.htpasswd;
        proxy_pass http://127.0.0.1:3300;
    }
}
